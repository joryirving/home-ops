---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kubernetes/apps/test
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-info
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  patches:
    - # Add Kustomization defaults for all child Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          deletionPolicy: WaitForTermination
          postBuild:
            substitute:
              CLUSTER: ${CLUSTER}
              SNAPSHOTCLASS: ${SNAPSHOTCLASS}
              STORAGECLASS: ${STORAGECLASS}
              STORAGE_HR: ${STORAGE_HR}
              STORAGE_NS: ${STORAGE_NS}
              SUBDOMAIN_SUFFIX: ${SUBDOMAIN_SUFFIX} # not injected on main: an empty value renders as null and fails admission
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  install:
                    crds: CreateReplace
                  rollback:
                    cleanupOnFail: true
                    recreate: true
                  timeout: 10m
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    - # Net-new CNPG cluster: plain initdb (no Barman recovery).
      # Use the `components.postgres/cnpg=init` label on an app's Flux Kustomization
      # to mark it as a brand-new cluster with no existing data. The component
      # default is bootstrap.recovery from Barman; this label opts out for net-new
      # apps that have no backup yet to recover from.
      # $${...} escape preserves the variable through outer (cluster-apps) substitution
      # so the inner (app) Kustomization's postBuild can resolve APP/POSTGRES_USERNAME.
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - target:
                group: postgresql.cnpg.io
                version: v1
                kind: Cluster
              patch: |-
                - op: replace
                  path: /spec/bootstrap
                  value:
                    initdb:
                      database: $${POSTGRES_USERNAME:=$${APP}}
                      owner: $${POSTGRES_USERNAME:=$${APP}}
                - op: remove
                  path: /spec/externalClusters
      target:
        kind: Kustomization
        labelSelector: "components.postgres/cnpg=init"
    - # Configure Dragonfly for ToolHive's Redis auth-storage Lua scripts.
      # Replication remains enabled; standalone mode and undeclared-key access
      # are required by ToolHive's scripts.
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - target:
                group: dragonflydb.io
                version: v1alpha1
                kind: Dragonfly
              patch: |-
                - op: remove
                  path: /spec/args/2
                - op: add
                  path: /spec/args/-
                  value: --default_lua_flags=allow-undeclared-keys
      target:
        kind: Kustomization
        labelSelector: "components.dragonfly/cluster-mode=non-cluster"
    - # Fix ARC Runner perms for D-CSI
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  values:
                    template:
                      spec:
                        securityContext:
                          fsGroup: 123
              target:
                kind: HelmRelease
      target:
        kind: Kustomization
        name: actions-runner-controller-runners
        labelSelector: "components.storage/driver=democratic-csi"
    - # Set Snapshot controller value for D-CSI
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  values:
                    controller:
                      args:
                        enableDistributedSnapshotting: true
              target:
                kind: HelmRelease
      target:
        kind: Kustomization
        name: snapshot-controller
        labelSelector: "components.storage/driver=democratic-csi"
