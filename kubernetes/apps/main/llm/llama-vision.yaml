---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app llama-vision
spec:
  components:
    - ../../../../components/gpu
  dependsOn:
    - name: llmkube
  interval: 1h
  path: ./kubernetes/apps/base/llm/llama-vision
  postBuild:
    substitute:
      APP: *app
  wait: false
  prune: true
