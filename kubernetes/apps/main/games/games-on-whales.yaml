---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fenrir
spec:
  interval: 1h
  ref:
    commit: 3f75c1aa5e69f2370ea31b6e2cf10c406ad97abb
  url: https://github.com/axolotlite/fenrir
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fenrir-crds
spec:
  interval: 1h
  path: ./crds
  prune: false
  sourceRef:
    kind: GitRepository
    name: fenrir
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app games-on-whales
spec:
  dependsOn:
    - name: fenrir-crds
    - name: k8s-gpu-dra-driver
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/base/games/games-on-whales
  postBuild:
    substitute:
      APP: *app
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
