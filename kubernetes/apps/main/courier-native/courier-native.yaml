---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app courier-native
spec:
  dependsOn:
    - name: courier
      namespace: llm
    - name: litellm
      namespace: llm
  interval: 1h
  path: ./kubernetes/apps/base/courier-native/courier-native
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
