---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app amdgpu-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: amdgpu-exporter
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      hostPID: true
      nodeSelector:
        topology.kubernetes.io/gpus: amd
      securityContext:
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
    controllers:
      amdgpu-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/amdgpu-exporter
              tag: 0.2.0@sha256:bbb890a2729a2b01425cde5dcb9e43546b75dc0569159921643f7694e3fb5da1
            env:
              PROC_ROOT: /host/proc
              SYSFS_ROOT: /host/sys
              TZ: America/Edmonton
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: &port 9494
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      proc:
        type: hostPath
        hostPath: /proc
        globalMounts:
          - path: /host/proc
            readOnly: true
      sys:
        type: hostPath
        hostPath: /sys
        globalMounts:
          - path: /host/sys
            readOnly: true
    service:
      app:
        ports:
          metrics:
            enabled: true
            protocol: TCP
            port: *port
