---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 15m
  dependsOn: []
  values:
    additionalPrometheusRulesMap:
      coredns-rules:
        groups:
          - name: coredns
            rules:
              - alert: CoreDnsForwardHealthcheckFailure
                annotations:
                  summary: CoreDNS pod {{ $labels.pod }} on cluster {{ $labels.cluster
                    }} has forward healthcheck failures.
                expr: sum by (pod) (rate(coredns_forward_healthcheck_broken_total[5m]))
                  > 0
                for: 5m
                labels:
                  severity: warning
              - alert: CoreDnsServfailHigh
                annotations:
                  summary: CoreDNS pod {{ $labels.pod }} on cluster {{ $labels.cluster
                    }} has a SERVFAIL response ratio of {{ $value | humanizePercentage
                    }}.
                expr: ((sum by (pod) (rate(coredns_dns_responses_total{rcode="SERVFAIL"}[5m]))
                  / sum by (pod) (rate(coredns_dns_responses_total[5m]))) > 0.01)
                  and (sum by (pod) (rate(coredns_dns_responses_total[5m])) > 0)
                for: 5m
                labels:
                  severity: warning
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub.
                    This may lead to rate limiting.
                expr: count(time() -
                  container_last_seen{image=~"(docker.io).*",container!=""} < 30) >
                  100
                labels:
                  severity: critical
      hpa-rules:
        groups:
          - name: hpa
            rules:
              - alert: KubeHpaMaxedOut
                annotations:
                  description: HPA {{ $labels.namespace }}/{{
                    $labels.horizontalpodautoscaler }} has been running at max
                    replicas for longer than 15 minutes on cluster {{
                    $labels.cluster }}.
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubehpamaxedout
                  summary: HPA is running at max replicas
                expr: (kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics"}
                  == kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics"})
                  and on (namespace, horizontalpodautoscaler, cluster)
                  (kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics"}
                  != kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics"})
                  and on (namespace, horizontalpodautoscaler, cluster)
                  (kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics"}
                  > 1)
                for: 15m
                labels:
                  severity: warning
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{
                    $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{
                    $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total -
                  kube_pod_container_status_restarts_total offset 10m >= 1) and
                  ignoring (reason)
                  min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m])
                  == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in
                    a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
    alertmanager:
      route:
        main:
          enabled: true
          hostnames: ["${ALERTMANAGER_SUBDOMAIN}.jory.dev"]
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
          global:
            resolveTimeout: 5m
        externalUrl: https://${ALERTMANAGER_SUBDOMAIN}.jory.dev
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ${STORAGECLASS}
              resources:
                requests:
                  storage: 1Gi
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      disabled:
        KubeHpaMaxedOut: true
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          dashboards: grafana
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      rbac:
        extraRules:
          - apiGroups: ["foreman.llmkube.dev"]
            resources: ["agentictasks", "workloads", "fleetnodes"]
            verbs: ["list", "watch"]
      # Resource definitions are a verbatim copy of the foreman chart's CRS
      # ConfigMap (charts/foreman/templates/crs-configmap.yaml, #1086), which
      # the chart's Grafana dashboard and PrometheusRule are keyed to. KSM
      # cannot mount that ConfigMap across namespaces, so the content lives
      # here; refresh it when the foreman chart's CRS definitions change.
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              # -- AgenticTask -------------------------------------------------------
              - groupVersionKind:
                  group: foreman.llmkube.dev
                  version: v1alpha1
                  kind: AgenticTask
                metricNamePrefix: foreman_agentictask
                metrics:
                  # foreman_agentictask_info{namespace,name,workload,agent,phase,verdict}
                  - name: info
                    help: "AgenticTask phase and verdict"
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          phase: [status, phase]
                          verdict: [status, verdict]
                          workload: [metadata, labels, "foreman.llmkube.dev/workload"]
                          agent: [spec, agentRef, name]

                  # Enum-style gauges: one series per state, value=1 on the active
                  # state. Easy to alert on (e.g. sum by (namespace) of the Pending
                  # series = pending task count).
                  - name: phase
                    help: "AgenticTask phase (1 = active)"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, phase]
                        labelsMapping:
                          Pending: pending
                          Scheduled: scheduled
                          Running: running
                          Verifying: verifying
                          Succeeded: succeeded
                          Failed: failed

                  - name: verdict
                    help: "AgenticTask verdict (1 = active)"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, verdict]
                        labelsMapping:
                          GO: go
                          "NO-GO": no-go
                          INCOMPLETE: incomplete
                          "GATE-PASS": gate-pass
                          "GATE-FAIL": gate-fail
                          "GATE-ERROR": gate-error
                          Skipped: skipped

                  # Counter for failed children, derived from the AgenticTask's own
                  # phase (a task is either failed or it isn't).
                  - name: tasks_failed
                    help: "AgenticTasks in Failed phase (gauge=1 per failed task)"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, phase]
                        labelsMapping:
                          Failed: failed

              # -- Workload ----------------------------------------------------------
              - groupVersionKind:
                  group: foreman.llmkube.dev
                  version: v1alpha1
                  kind: Workload
                metricNamePrefix: foreman_workload
                metrics:
                  # foreman_workload_info{namespace,name,phase,repo}
                  - name: info
                    help: "Workload phase and repo"
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          phase: [status, phase]
                          repo: [spec, repo]

                  # foreman_workload_succeeded_tasks / _failed_tasks / _incomplete_tasks
                  # (integer gauges = status.<field>)
                  - name: succeeded_tasks
                    help: "Succeeded child AgenticTasks for this Workload"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, succeededTasks]

                  - name: failed_tasks
                    help: "Failed child AgenticTasks for this Workload"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, failedTasks]

                  - name: incomplete_tasks
                    help: "Incomplete child AgenticTasks for this Workload"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, incompleteTasks]

                  # Enum-style phase gauges for Workload (Planning / Planned /
                  # Dispatched / Completed / Failed).
                  - name: phase
                    help: "Workload phase (1 = active)"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, phase]
                        labelsMapping:
                          Planning: planning
                          Planned: planned
                          Dispatched: dispatched
                          Completed: completed
                          Failed: failed

              # -- FleetNode ---------------------------------------------------------
              - groupVersionKind:
                  group: foreman.llmkube.dev
                  version: v1alpha1
                  kind: FleetNode
                metricNamePrefix: foreman_fleetnode
                metrics:
                  # foreman_fleetnode_info{node,accelerator,os,arch}
                  - name: info
                    help: "FleetNode identity and capability"
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          node: [spec, nodeName]
                          accelerator: [status, capability, accelerator]
                          os: [status, os]
                          arch: [status, arch]

                  # foreman_fleetnode_heartbeat_timestamp_seconds (gauge = unix seconds
                  # of LastHeartbeatTime, 0 when absent).
                  - name: heartbeat_timestamp_seconds
                    help: "FleetNode last heartbeat unix timestamp (0 = no heartbeat)"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, lastHeartbeatTime]

                  # foreman_fleetnode_ram_gigabytes (gauge = status.capability.totalRAMGB)
                  - name: ram_gigabytes
                    help: "FleetNode total RAM in GiB"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, capability, totalRAMGB]

                  # Enum-style phase gauges (Ready / Draining / NotReady / Unknown).
                  - name: phase
                    help: "FleetNode phase (1 = active)"
                    each:
                      type: Gauge
                      gauge:
                        valueFrom:
                          path: [status, phase]
                        labelsMapping:
                          Ready: ready
                          Draining: draining
                          NotReady: not-ready
                          Unknown: unknown
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames: ["${SUBDOMAIN}.jory.dev"]
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalLabels:
          cluster: ${CLUSTER}
        externalUrl: ${SUBDOMAIN}.jory.dev
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 3000Mi
        version: v2.55.1 # override 'unsupported Prometheus version' error for prompp
        image:
          registry: mirror.gcr.io
          repository: prompp/prompp
          tag: 0.8.7
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 30d
        retentionSize: ${PVC_CAPACITY}GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ${STORAGECLASS}
              resources:
                requests:
                  storage: ${PVC_CAPACITY}Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          metricRelabelings:
            - action: drop
              sourceLabels: ["mountpoint"]
              regex: /etc/.*
  valuesFrom:
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml
