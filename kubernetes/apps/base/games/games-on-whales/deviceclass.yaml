---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/resource.k8s.io/deviceclass_v1.json
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gow-wolf
spec:
  config:
    - opaque:
        driver: wolf.dra.io
        parameters:
          video_settings:
            runner_render_node: /dev/dri/renderD128
            video_producer_buffer_caps: video/x-raw(memory:DMABuf), drm-format={NV12,YV12,YU12,P012,YUYV,YU24,AB24,AR24,XB24,XR24}
            wayland_render_node: /dev/dri/renderD128
  selectors:
    - cel:
        expression: device.driver == "wolf.dra.io"
