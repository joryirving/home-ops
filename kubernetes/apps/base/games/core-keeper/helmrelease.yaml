---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: core-keeper
spec:
  chartRef:
    kind: OCIRepository
    name: core-keeper
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      core-keeper:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: escaping/core-keeper-dedicated
              tag: latest@sha256:87fa7925596264e1460cb6c7c128e9d39ac5445206e04e587993b5d4afa7c90f
            env:
              ## Container Settings
              TZ: America/Edmonton
              # WORLD_INDEX: "0" # Which world index to use.
              WORLD_NAME: Noods Core Keeper # The name to use for the server.
              # WORLD_SEED: "0" # The seed to use for a new world. Set to 0 to generate random seed.
              DATA_PATH: &datapath /home/steam/core-keeper-data # Save file location. If not set it defaults to a sub-folder named "DedicatedServer" at the default Core Keeper save location.
              MAX_PLAYERS: "8" # Maximum number of players that will be allowed to connect to server.
              SEASON: "0" # Enables Seasonal Events. 0 is default, 1 is Easter, 2 is Halloween, 3 is Christmas.
              SERVER_IP: 0.0.0.0 # Bind the direct-connect listener on all pod interfaces.
              SERVER_PORT: &port "27015" # Towonel forwards this UDP port to the edge.
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &disabled
                enabled: false
              readiness: *disabled
              startup: *disabled
            resources:
              requests:
                cpu: 1000m
              limits:
                memory: 8Gi
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: *datapath
      files:
        existingClaim: "{{ .Release.Name }}-server-files"
        globalMounts:
          - path: /home/steam/core-keeper-dedicated
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.69.10.37
          external-dns.alpha.kubernetes.io/hostname: core-keeper.jory.dev
          external-dns.alpha.kubernetes.io/target: towonel.jory.dev
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
          towonel.io/game.public-port: "27015"
          towonel.io/game.udp: "true"
          towonel.io/tunnel: enable
          towonel.io/tunnel-ref: network/towonel-main
        ports:
          game:
            enabled: true
            protocol: UDP
            port: *port
