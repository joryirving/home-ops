---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinchflat
spec:
  chartRef:
    kind: OCIRepository
    name: pinchflat
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      pinchflat:
        annotations:
          reloader.stakater.com/auto: "true"
        # NGX's yt-dlp update worker rewrites the binary in place (copy, --update-to,
        # rename). A PATH-prepended copy in an emptyDir keeps that working under
        # readOnlyRootFilesystem; the initContainer re-baselines it to the image
        # version on every pod start.
        initContainers:
          yt-dlp:
            image:
              repository: ghcr.io/thebadfella/pinchflat-ngx
              tag: 2026.10.20-postgres@sha256:5f4631f433805fd8e83b354a266284880fa15de8b81c8fd3228171fc21943207
            command:
              - sh
              - -c
              - cp /usr/local/bin/yt-dlp /yt-dlp-bin/yt-dlp && chmod 0755 /yt-dlp-bin/yt-dlp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/thebadfella/pinchflat-ngx
              tag: 2026.10.20-postgres@sha256:5f4631f433805fd8e83b354a266284880fa15de8b81c8fd3228171fc21943207
            env:
              BASIC_AUTH_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: pinchflat
                    key: BASIC_AUTH_PASSWORD
              BASIC_AUTH_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: pinchflat
                    key: BASIC_AUTH_USERNAME
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: pinchflat-app
                    key: uri
              DOWNLOAD_STAGING_PATH: /downloads-staging
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: pinchflat
                    key: OIDC_CLIENT_ID
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: pinchflat
                    key: OIDC_CLIENT_SECRET
              OIDC_ISSUER:
                valueFrom:
                  secretKeyRef:
                    name: pinchflat
                    key: OIDC_ISSUER
              OIDC_REDIRECT_URI:
                valueFrom:
                  secretKeyRef:
                    name: pinchflat
                    key: OIDC_REDIRECT_URI
              PATH: /yt-dlp-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              POT_PROVIDER_URL: http://localhost:4416
              PORT: &port 80
              TZ: America/Edmonton
              TZ_DATA_PATH: /tmp/elixir_tz_data
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          # bgutil PO-token provider server. NGX enables its in-image yt-dlp
          # plugin only when POT_PROVIDER_URL is set; same pod keeps the
          # unauthenticated provider on localhost.
          pot-provider:
            image:
              repository: docker.io/brainicism/bgutil-ytdlp-pot-provider
              tag: 2.0.2@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      yt-dlp:
        type: emptyDir
        globalMounts:
          - path: /etc/yt-dlp
      yt-dlp-bin:
        type: emptyDir
        advancedMounts:
          pinchflat:
            yt-dlp:
              - path: /yt-dlp-bin
            app:
              - path: /yt-dlp-bin
      staging:
        type: emptyDir
        sizeLimit: 25Gi
        advancedMounts:
          pinchflat:
            app:
              - path: /downloads-staging
      media:
        type: nfs
        server: voyager.internal
        path: /mnt/akademiya/data
        advancedMounts:
          pinchflat:
            app:
              - path: /downloads
                subPath: pinchflat
      tmp:
        type: emptyDir
    route:
      app:
        hostnames: ["{{ .Release.Name }}.jory.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
