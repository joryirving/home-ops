---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name pinchflat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        BASIC_AUTH_PASSWORD: "{{ .BASIC_AUTH_PASSWORD }}"
        BASIC_AUTH_USERNAME: "{{ .BASIC_AUTH_USERNAME }}"
        OIDC_CLIENT_ID: "{{ .PINCHFLAT_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .PINCHFLAT_CLIENT_SECRET }}"
        OIDC_ISSUER: https://sso.jory.dev/application/o/pinchflat/
        OIDC_PROVIDER_NAME: Authentik
        OIDC_REDIRECT_URI: https://pinchflat.jory.dev/auth/oidc/callback
  dataFrom:
    - extract:
        key: pinchflat
