---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brrpolice
spec:
  chartRef:
    kind: OCIRepository
    name: brrpolice
  interval: 15m
  dependsOn: []
  values:
    config:
      qbittorrent:
        base_url: http://qbittorrent.downloads.svc.cluster.local
    extraEnv:
      - name: TZ
        value: America/Edmonton
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      serviceMonitor:
        enabled: true
    persistence:
      existingClaim: brrpolice
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 100
      runAsNonRoot: true
      runAsUser: 1000
