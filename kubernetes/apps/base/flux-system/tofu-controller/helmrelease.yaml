      enabled: true
      serviceMonitor:
        enabled: true
        interval: 1m
    runner:
      image:
        repository: ghcr.io/joryirving/opentofu-runner
        tag: 1.13.10@sha256:7813fd75aa3ba4cdbdbba60e819f252d86537269bf5ee119453049583033e506
