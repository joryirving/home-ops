---
apiVersion: towonel.io/v1alpha1
kind: TowonelAgent
metadata:
  # Keep the operator's generated identity so source-managed routes stay attached.
  name: ${TOWONEL_AGENT_NAME}
  labels:
    app.kubernetes.io/managed-by: towonel-operator
spec:
  mode: Managed
  tunnelRef:
    name: towonel-${CLUSTER}
    namespace: network
  workload:
    disableUDPGSO: true
    # Track agent releases independently of the operator chart.
    image: codeberg.org/towonel/towonel-agent:1.11.2@sha256:602e6afe2c322b905d4034ee40a8958f4a137337ed5a4186491699dbb100eda7
