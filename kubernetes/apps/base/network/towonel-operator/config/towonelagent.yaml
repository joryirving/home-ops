---
apiVersion: towonel.io/v1alpha1
kind: TowonelAgent
metadata:
  # Keep the operator's generated identity so source-managed routes stay attached.
  name: ${TOWONEL_AGENT_NAME}
  labels:
    app.kubernetes.io/managed-by: towonel-operator
spec:
  mode: Managed
  tunnelRef:
    name: towonel-${CLUSTER}
    namespace: network
  workload:
    image: codeberg.org/towonel/towonel-agent:1.11.0@sha256:f2e0d2bba2a30b85def3e7b6c110a74ad23c6be31697516225a42a8c999712c9
