---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-operator
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-operator
  interval: 15m
  values:
    agentNamespace: network
    credentials:
      existingSecret: towonel-operator-secret
      tokenKey: TOWONEL_API_KEY
    gatewayAPI:
      enabled: true
    observability:
      dashboards:
        enabled: ${TOWONEL_DASHBOARD_ENABLED:=false}
        grafanaOperator:
          enabled: ${TOWONEL_DASHBOARD_ENABLED:=false}
          matchLabels:
            dashboards: grafana
      metrics:
        agentPodMonitor:
          enabled: ${TOWONEL_METRICS_ENABLED:=false}
        serviceMonitor:
          enabled: ${TOWONEL_METRICS_ENABLED:=false}
    towonel:
      apiURL: https://towonel.jory.dev
