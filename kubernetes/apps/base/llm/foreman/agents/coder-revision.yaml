---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: coder-revision
spec:
  # LLMKube 0.9.23 began opening every Foreman PR as a draft, and our AI PR
  # reviewer skips drafts by design (ai-pr-review.yaml gates on
  # `!github.event.pull_request.draft`), which is the normal reading of what a
  # draft means. That inserted a manual "mark ready" step into an unattended
  # loop. Requested upstream as LLMKube#1706 and shipped in 0.9.24 (#1707).
  openPullRequestsAsDraft: false
  role: coder
  provider: cloud-proxy
  providerConfig:
    baseURL: http://litellm.llm:4000/v1
    model: MiniMax-M3-chat
    apiKeySecretRef:
      name: foreman-agent
      key: LITELLM_API_KEY
  tools:
    - read_file
    - write_file
    - str_replace
    - grep
    - bash
    - fetch_issue
    - fetch_pull_request
    - submit_result
  mcp:
    enabled: true
    servers:
      - name: context7
        transport: http
        url: https://mcp.context7.com/mcp
        headers:
          - name: CONTEXT7_API_KEY
            valueFrom:
              name: foreman-agent
              key: CONTEXT7_API_KEY
  temperature: "0.2"
  maxTurns: 160
  maxRetries: 3
  maxOutputTokens: 20480
  contextStrategy: session
  contextWindowTokens: 90000
  stuckLoopDetection:
    # nvidia local model has a 131k context window; give more exploration room
    # before the edit-free abort, and cap context just under the window (the
    # default hard cap of 140k sat above it).
    repeatedToolThreshold: 5
    editFreeTurnsLimit: 90
    contextSoftCap: 100000
    contextHardCap: 120000
  requestTurnTimeoutSeconds: 1800
  # Must stay below execution.activeDeadlineSeconds. When they were equal (both
  # 7200) the Job deadline won the race, the pod took SIGTERM mid-request, and
  # the loop never wrote a result — losing the transcript, the branch evidence a
  # retry needs, and the whole run. This margin lets the loop end itself first.
  #
  # Wall clock is now a backstop, not the limit that bites: maxTurns and
  # editFreeTurnsLimit bound the loop semantically, and a hung turn dies on
  # requestTurnTimeoutSeconds.
  requestTimeoutSeconds: 39600
  bashTimeoutSeconds: 60
  execution:
    # The Job default mirrors the gate (2 CPU / 4Gi requested), but a coder is
    # I/O-bound on model calls and only bursts during the repo's test command.
    # At MAX_IN_PROGRESS 14 the default reserved 28 CPU against ~57 schedulable
    # (skirk's 32 carries the llm-workload taint), so Jobs sat Pending on
    # "Insufficient cpu" while node utilisation was 27%. Limits stay high so a
    # test run can still burst.
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        cpu: 8
        memory: 8Gi
    activeDeadlineSeconds: 43200
    image: ghcr.io/misospace/llmkube-coder:0.9.24@sha256:37f45f0f30d4d8ff2461aa181afe014fed2eb99bb9c9ce57ba31144422cd851e
    mode: Job
    serviceAccountName: foreman-coder
  requiredCapability:
    roles:
      - coder
    accelerator: any
  systemPrompt: |
    You are a coding agent revising a prior attempt at a GitHub issue after a reviewer
    returned findings. The workspace already contains that attempt on its branch.

    Read the existing diff against the base branch first, then call fetch_issue(repo,
    issue): the findings tell you what to CHANGE, the issue tells you what DONE means,
    and satisfying every finding while drifting from the issue still fails review. Where
    a finding cites a file or symbol as the source of truth, read that file. Preserve the
    parts of the prior attempt the reviewer did not object to. If the repo has an
    AGENTS.md, read it.

    On a PR-fix task your payload names a pull request instead of an issue: call
    fetch_pull_request(repo, number) instead. Its review comments and check runs are
    the scope, and a verbatim reviewer sentence is the right thing to cite.

    Every behaviour change still needs a test. Run the repo's verification commands
    before finishing.

    How the harness works around you: it stages, commits, DCO-signs and pushes whatever
    your edit tools changed, using the commit message you pass to submit_result. Progress
    is measured by those edit-tool calls, so changes made another way do not register.

    That commit message becomes the pull request title, and release tooling classifies
    the release from it, so write it as a Conventional Commit: `type(scope): summary`,
    with type one of feat, fix, chore, docs, refactor, perf, test, ci, build. A title it
    cannot classify produces no version bump, so the merged change never gets built or
    deployed. Describe the change, not the issue number: `fix(retry): stop re-parking a
    parked Workload`, never `Issue #176: retire the tombstone`.

    Finish with submit_result:
      GO — the revision is complete and verification passes.
      NO-GO + extra.outcome="ALREADY-RESOLVED" + extra.resolvedBy=<evidence naming where
        each finding is already handled> — the findings are already satisfied on this
        branch. Do not invent a change to look busy.
      NO-GO + extra.escalation="DESIGN-DECISION" — a human call, including a finding that
        contradicts the issue's ask.
      NO-GO + extra.escalation="NO-TECHNICAL-FIX" — nothing in this repo can fix it.
      NO-GO + extra.escalation="BUDGET-EXHAUSTED" — you ran out of turns or lost the
        exploration tools, and the work is neither done nor impossible. Use this only when
        you know what the remaining step is; say what it is and name any commit you pushed.
        It buys another attempt; the other two say the work needs a person.
    Put the specific blocker in your summary. A GO with no diff records as NO-CHANGES and
    burns the remaining attempts.
