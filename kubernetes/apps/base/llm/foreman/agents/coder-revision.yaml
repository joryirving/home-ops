---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: coder-revision
spec:
  role: coder
  provider: cloud-proxy
  providerConfig:
    baseURL: http://litellm.llm:4000/v1
    model: self-hosted
    apiKeySecretRef:
      name: foreman-agent
      key: LITELLM_API_KEY
  tools:
    - read_file
    - write_file
    - str_replace
    - grep
    - bash
    - fetch_issue
    - submit_result
  mcp:
    enabled: true
    servers:
      - name: context7
        transport: http
        url: https://mcp.context7.com/mcp
        headers:
          - name: CONTEXT7_API_KEY
            valueFrom:
              name: foreman-agent
              key: CONTEXT7_API_KEY
  temperature: "0.2"
  maxTurns: 160
  maxRetries: 3
  maxOutputTokens: 20480
  stuckLoopDetection:
    # nvidia local model has a 131k context window; give more exploration room
    # before the edit-free abort, and cap context just under the window (the
    # default hard cap of 140k sat above it).
    editFreeTurnsLimit: 40
    contextSoftCap: 100000
    contextHardCap: 120000
  requestTurnTimeoutSeconds: 1800
  # Must stay below execution.activeDeadlineSeconds. When they were equal (both
  # 7200) the Job deadline won the race, the pod took SIGTERM mid-request, and
  # the loop never wrote a result — losing the transcript, the branch evidence a
  # retry needs, and the whole run. This margin lets the loop end itself first.
  #
  # Wall clock is now a backstop, not the limit that bites: maxTurns and
  # editFreeTurnsLimit bound the loop semantically, and a hung turn dies on
  # requestTurnTimeoutSeconds.
  requestTimeoutSeconds: 39600
  bashTimeoutSeconds: 60
  execution:
    activeDeadlineSeconds: 43200
    image: ghcr.io/misospace/llmkube-coder:0.9.16@sha256:c99120f992ae588fdaa5000377da4da1d4e04f349ba681e27083f5a4008cc97f
    mode: Job
    serviceAccountName: foreman-coder
  requiredCapability:
    roles:
      - coder
    accelerator: any
  systemPrompt: |
    You are a coding agent revising a prior attempt at a GitHub issue after a reviewer
    returned findings. The workspace already contains that attempt on its branch.

    Read the existing diff against the base branch first, then call fetch_issue(repo,
    issue): the findings tell you what to CHANGE, the issue tells you what DONE means,
    and satisfying every finding while drifting from the issue still fails review. Where
    a finding cites a file or symbol as the source of truth, read that file. Preserve the
    parts of the prior attempt the reviewer did not object to. If the repo has an
    AGENTS.md, read it.

    Every behaviour change still needs a test. Run the repo's verification commands
    before finishing.

    How the harness works around you: it stages, commits, DCO-signs and pushes whatever
    your edit tools changed, using the commit message you pass to submit_result. Progress
    is measured by those edit-tool calls, so changes made another way do not register.

    Finish with submit_result:
      GO — the revision is complete and verification passes.
      NO-GO + extra.outcome="ALREADY-RESOLVED" + extra.resolvedBy=<evidence naming where
        each finding is already handled> — the findings are already satisfied on this
        branch. Do not invent a change to look busy.
      NO-GO + extra.escalation="DESIGN-DECISION" — a human call, including a finding that
        contradicts the issue's ask.
      NO-GO + extra.escalation="NO-TECHNICAL-FIX" — nothing in this repo can fix it.
    Put the specific blocker in your summary. A GO with no diff records as NO-CHANGES and
    burns the remaining attempts.
