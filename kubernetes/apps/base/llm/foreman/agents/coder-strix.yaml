---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: coder-strix
spec:
  role: coder
  provider: cloud-proxy
  providerConfig:
    baseURL: http://litellm.llm:4000/v1
    model: self-hosted
    apiKeySecretRef:
      name: foreman-agent
      key: LITELLM_API_KEY
  tools:
    - read_file
    - write_file
    - str_replace
    - grep
    - bash
    - fetch_issue
    - submit_result
  mcp:
    enabled: true
    servers:
      - name: context7
        transport: http
        url: https://mcp.context7.com/mcp
        headers:
          - name: CONTEXT7_API_KEY
            valueFrom:
              name: foreman-agent
              key: CONTEXT7_API_KEY
  temperature: "0.2"
  maxTurns: 160
  maxRetries: 3
  maxOutputTokens: 20480
  stuckLoopDetection:
    # nvidia local model has a 131k context window; give more exploration room
    # before the edit-free abort, and cap context just under the window (the
    # default hard cap of 140k sat above it).
    editFreeTurnsLimit: 40
    contextSoftCap: 100000
    contextHardCap: 120000
  requestTurnTimeoutSeconds: 1800
  # Must stay below execution.activeDeadlineSeconds. When they were equal (both
  # 7200) the Job deadline won the race, the pod took SIGTERM mid-request, and
  # the loop never wrote a result — losing the transcript, the branch evidence a
  # retry needs, and the whole run. This margin lets the loop end itself first.
  #
  # Wall clock is now a backstop, not the limit that bites: maxTurns and
  # editFreeTurnsLimit bound the loop semantically, and a hung turn dies on
  # requestTurnTimeoutSeconds.
  requestTimeoutSeconds: 39600
  bashTimeoutSeconds: 60
  execution:
    activeDeadlineSeconds: 43200
    image: ghcr.io/misospace/llmkube-coder:0.9.16@sha256:c99120f992ae588fdaa5000377da4da1d4e04f349ba681e27083f5a4008cc97f
    mode: Job
    serviceAccountName: foreman-coder
  requiredCapability:
    # Matches the shared foreman-agent (roles: worker,coder,verifier). accelerator
    # "any" because requiredCapability pins the executor node, not the model — the
    # model's GPU placement is handled by the llama-nvidia InferenceService.
    roles:
      - coder
    accelerator: any
  systemPrompt: |
    You are a coding agent resolving one GitHub issue in the referenced repo.

    Start by calling fetch_issue(repo, issue). On a retry the payload carries only the
    previous attempt's feedback — the original ask and acceptance criteria are not in it.
    If the repo has an AGENTS.md, read it: it carries conventions and the testing traps
    earlier attempts learned the hard way.

    When the issue names files, those paths are where the work goes — start from them
    rather than searching for the behaviour by name. An issue often describes something
    that does not exist yet, in which case the named file is where to create it.

    Make the change, add a test for any behaviour change, and run the repo's own
    verification commands before finishing.

    How the harness works around you: it stages, commits, DCO-signs and pushes whatever
    your edit tools changed, using the commit message you pass to submit_result. Progress
    is measured by those edit-tool calls, so changes made another way do not register.

    Finish with submit_result:
      GO — the change is complete and verification passes.
      NO-GO + extra.outcome="ALREADY-RESOLVED" + extra.resolvedBy=<file and what it
        already does> — the code where the issue points already does what it asks.
      NO-GO + extra.escalation="DESIGN-DECISION" — a product or architecture call a
        human has to make.
      NO-GO + extra.escalation="NO-TECHNICAL-FIX" — nothing in this repo can fix it
        (wrong layer, upstream bug, external service).
    Put the specific blocker in your summary. These route the issue, so a wrong one
    removes real work from the queue. If you cannot find what the issue points at, read
    the files it names and work from what is there — not having found it yet is not a
    blocker.
