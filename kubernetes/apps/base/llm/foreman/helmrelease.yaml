---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foreman
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: foreman
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    foreman:
      # CRD status metrics (#1001/#1086): renders the chart's CRS ConfigMap,
      # Grafana dashboard, and PrometheusRule. kube-state-metrics consumes the
      # same resource definitions via kube-prometheus-stack values (KSM cannot
      # mount a ConfigMap across namespaces).
      crs:
        enabled: true
        # Chart 0.9.16's shipped rule uses time_seconds(), which is not a
        # PromQL function; the prometheus-operator admission webhook rejects
        # it and the whole Helm upgrade rolls back. Re-enable when the fix
        # ships upstream.
        alerts:
          enabled: false
    operator:
      # Audit-record ConfigMaps (foreman.llmkube.dev/audit) accumulate one per
      # task and are only GC'd by the operator's reaper. Default retention is 7d;
      # trim to 48h — a homelab does not need a week of audit trail, and heavy
      # task churn otherwise piles up hundreds of CMs (#990).
      audit:
        retention: 48h
    agent:
      replicaCount: 3
      mode: native
      taskNamespace: llm
      roles:
        - worker
        - coder
        - verifier
      image:
        repository: ghcr.io/misospace/llmkube-coder
        tag: "0.9.16@sha256:c99120f992ae588fdaa5000377da4da1d4e04f349ba681e27083f5a4008cc97f"
      githubToken:
        secretName: foreman-agent
        secretKey: GITHUB_TOKEN
      commitAuthorName: Saffron
      commitAuthorEmail: 263493777+itsmiso-ai@users.noreply.github.com
      gateCache:
        storageClass: ceph-filesystem
        accessModes: ["ReadWriteMany"]
    coder:
      gitCredentialsSecret: foreman-agent
      gitCredentialsSecretKey: GITHUB_TOKEN
