---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm-d-router
spec:
  chartRef:
    kind: OCIRepository
    name: llm-d-router
  interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    router:
      modelServers:
        matchLabels:
          inference.llmkube.dev/runtime: generic
        targetPorts:
        - number: 8080
      proxy:
        failOpen: false
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 1Gi
      epp:
        replicas: 1
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
