---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lemonade-tts-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-hostpath
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lemonade-tts-iris-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 40Gi
