---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bluetts
spec:
  chartRef:
    kind: OCIRepository
    name: bluetts
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      nodeSelector:
        topology.kubernetes.io/gpus: intel
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      bluetts:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/bluetts
              tag: 3.0.1@sha256:12b2c7bed54b29a7a06abf7110e87e28552fe326584f77cd06ea8ade6f8506b8
            env:
              BLUE_PROVIDERS: WebGpuExecutionProvider
              TZ: America/Edmonton
              ORT_INTRA: "8"
            probes:
              liveness:
                enabled: true
                spec:
                  initialDelaySeconds: 20
                  periodSeconds: 20
                  failureThreshold: 6
              readiness:
                enabled: true
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 12
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 4Gi
            securityContext:
              privileged: true
              readOnlyRootFilesystem: true
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      render:
        type: hostPath
        hostPath: /dev/dri/renderD128
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/dri/renderD128
    service:
      app:
        ports:
          http:
            port: &port 8000
