---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bluetts
spec:
  chartRef:
    kind: OCIRepository
    name: bluetts
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      nodeSelector:
        topology.kubernetes.io/gpus: intel
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      bluetts:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/bluetts
              tag: sandbox@sha256:08b128206f080c1b51de66142254946ca5071695e281e8a7b9498e7d0e6bca6b
            command:
              - /app/.venv/bin/python
              - -c
              - import time; time.sleep(86400)
            env:
              BLUE_PROVIDERS: WebGpuExecutionProvider
              TZ: America/Edmonton
              ORT_INTRA: "8"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 4Gi
            securityContext:
              privileged: true
              readOnlyRootFilesystem: true
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      render:
        type: hostPath
        hostPath: /dev/dri/renderD128
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/dri/renderD128
    service:
      app:
        ports:
          http:
            port: &port 8000
