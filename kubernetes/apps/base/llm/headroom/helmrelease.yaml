---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headroom
spec:
  chartRef:
    kind: OCIRepository
    name: headroom
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
    controllers:
      headroom:
        replicas: 2
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/headroomlabs-ai/headroom
              tag: 0.39.1-slim-nonroot@sha256:f1a93370f9c9a16fd5f2d3c530c92b138f93f8ad0d23618d7789b5884be32f08
            env:
              HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
              HEADROOM_HOST: 0.0.0.0
              HEADROOM_MODE: cache
              HEADROOM_PORT: &port 8787
              HEADROOM_TELEMETRY: "off"
              HEADROOM_WORKSPACE_DIR: /data/headroom
              HF_HOME: /data/huggingface
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
