---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ninfer
spec:
  chartRef:
    kind: OCIRepository
    name: ninfer
  interval: 15m
  values:
    controllers:
      ninfer:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/ninfer-3090
              tag: v0.6.0-sm86
            command:
              - ninfer-serve
              - /models/qwen3_8_27b.ninfer
            args:
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - --max-context
              - "130000"
              - --kv-capacity
              - auto
              - --max-concurrency
              - "1"
              - --max-pending-requests
              - "16"
              - --prefill-chunk
              - "1024"
              - --kv-dtype
              - int8
              - --spec
              - mtp
              - --draft-tokens
              - "3"
              - --lm-head-draft
            env:
              NVIDIA_DRIVER_CAPABILITIES: all
              NVIDIA_VISIBLE_DEVICES: all
            resources:
              requests:
                cpu: 500m
                memory: 16Gi
                nvidia.com/gpu: 1
              limits:
                nvidia.com/gpu: 1
    defaultPodOptions:
      runtimeClassName: nvidia
      nodeSelector:
        topology.kubernetes.io: egpu
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
    service:
      app:
        controller: ninfer
        ports:
          http:
            port: 8080
    persistence:
      models:
        existingClaim: ninfer-models
        globalMounts:
          - path: /models
