---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: memini-rerank
spec:
  source: https://huggingface.co/gpustack/jina-reranker-v2-base-multilingual-GGUF/resolve/main/jina-reranker-v2-base-multilingual-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: memini-rerank
  labels:
    krr/ignore: "true"
spec:
  modelRef: memini-rerank
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:7fa75431b8a78f9528cab4aaf65e8ae3e13da546a3cc7221247ca81bab864d84
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 3
  priority: normal
  podLabels:
    cpu-inference: "true"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: memini-rerank
  contextSize: 8096
  parallelSlots: 4
  batchSize: 8192
  uBatchSize: 8192
  env:
    - name: GOMP_CPU_AFFINITY
      value: "0-11"
    - name: KMP_AFFINITY
      value: "granularity=fine,proc_list=[0-11],explicit"
  resources:
    cpu: "2"
    memory: 8Gi
  mode: rerank
  extraArgs:
    - --alias
    - memini-rerank
    - --cont-batching
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
