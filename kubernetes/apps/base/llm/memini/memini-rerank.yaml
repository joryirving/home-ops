---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: memini-rerank
spec:
  source: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: rerank
  labels:
    krr/ignore: "true"
spec:
  modelRef: memini-rerank
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:5766735f77edf02ca179264e71e18ed1466e9332912e30f88f7a4ccd0dc6d5b6
  command:
    - /app/llama-server
  securityContext:
    privileged: true
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    rerank-pool: "true"
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: layla
  contextSize: 16384
  parallelSlots: 4
  batchSize: 16384
  uBatchSize: 16384
  resources:
    cpu: 500m
    memory: 4Gi
  mode: rerank
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --n-gpu-layers
    - "99"
    - --load-mode
    - mmap
  extraVolumes:
    - name: render
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
  extraVolumeMounts:
    - name: render
      mountPath: /dev/dri/renderD128
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
