---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: pr-reviewer-action
spec:
  # Public upstream repo, pinned to the commit the GHCR images were built
  # from (sha-1799b9f7…); source-controller runs `helm dependency build`
  # when packaging the chart at this path.
  url: https://github.com/misospace/pr-reviewer-action.git
  ref:
    commit: 1799b9f750a28764b0afc441a7e840acbfe50137
  interval: 30m
