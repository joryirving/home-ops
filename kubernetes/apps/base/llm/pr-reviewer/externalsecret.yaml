---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pr-reviewer-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pr-reviewer-github
    template:
      engineVersion: v2
      data:
        # The key NAME becomes the mounted file name; the chart points
        # PR_REVIEWER_GITHUB_APP_PRIVATE_KEY_FILE at it.
        private-key.pem: "{{ .BOT_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: github-saffron
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pr-reviewer
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pr-reviewer
  dataFrom:
    - extract:
        key: pr-reviewer
