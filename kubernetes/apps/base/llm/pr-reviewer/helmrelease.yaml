---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-reviewer
spec:
  interval: 1h
  # Required placeholder: the postgres component JSON-patches the
  # cloudnative-pg dependency in.
  dependsOn: []
  # Versioned OCI chart release (misospace/pr-reviewer-action#1708):
  # chart version == appVersion == release; never replaced once published.
  chartRef:
    kind: OCIRepository
    name: pr-reviewer
  values:
    controller:
      instanceConfig: |-
        version: 1
        unknown-profile-policy: reject
        forges:
          - name: github
            kind: github
            endpoint: https://api.github.com
            credential: github-app
        model-profiles:
          - name: primary
            endpoint: http://litellm.llm:4000/v1
            api-format: openai
            credential: litellm
            model: glm-5.3-flash
        default-model-profile: primary
        executor-profiles:
          - name: k8s-jobs
            kind: kubernetes
            max-reviews: 2
            kubernetes:
              image: ghcr.io/misospace/pr-reviewer-worker@sha256:fa608079bfcf5be45ee7e05f628ae7764ab063187ac90270448b091c4db42143
              args: []
              namespace: llm
              service-account: pr-reviewer-worker
              ttl-seconds-after-finished: 1800
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              volumes:
                - claim: pr-reviewer-runs
                  controller-root: /var/lib/pr-reviewer/runs
                - claim: pr-reviewer-workspace
                  controller-root: /var/lib/pr-reviewer/cache
        default-executor-profile: k8s-jobs
        adoption:
          mode: allowlist
          allowlist: ["joryirving/home-ops", "joryirving/joryirving"]
          denylist: []
          discovered-default: adopt

      # CNPG-generated secret (component provisions the Cluster, CNPG mints
      # the -app secret with the uri key).
      controlPlaneUrlExistingSecret:
        name: pr-reviewer-app
        key: uri

      webhook:
        enabled: true
        port: 8080
        existingSecret:
          name: pr-reviewer
          key: WEBHOOK_SECRET

      admin:
        enabled: true
        port: 8081
        existingSecret:
          name: pr-reviewer
          key: ADMIN_TOKEN
        dashboard: true

      reconcile:
        enabled: true
        intervalMs: 300000
        # The saffron App's joryirving-account installation (covers both
        # pilot repos; must match the webhook's installation for convergence).
        githubInstallationId: "136450513"
        repos:
          - joryirving/home-ops
          - joryirving/joryirving

      forgeAuth:
        platform: github
        github:
          appId: "3901073"
          appPrivateKeyExistingSecret:
            name: pr-reviewer-github
            key: private-key.pem

      credentials:
        litellm:
          existingSecret:
            name: litellm-key-pr-review
            key: api-key

      # In-cluster TLS fix for misospace/pr-reviewer-action#1773: the runtime
      # sets TLS SNI from KUBERNETES_SERVICE_HOST, and the kubelet injects the
      # ClusterIP — an IP never matches the apiserver cert SANs, so every API
      # call (credential sweeps, executor Job creation) fails the handshake.
      # User-specified env overrides the injected service variables; the DNS
      # name is the conventional SNI. Superseded by the upstream SNI fix.
      env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "443"

      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/misospace/pr-reviewer-controller
                tag: "3.10.0"
                digest: sha256:648ea396fb7efa7fa365b97583908a992ddf84ce18e6e6417f8ea67a70c2d428
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi

      service:
        webhook:
          enabled: true
          ports:
            webhook:
              port: 8080
            # Operations dashboard (#742) + admin API — GET /dashboard on the
            # admin listener; the webhook intake (POST-only) stays on 8080.
            admin:
              port: 8081

      # Gateway route via the chart's bjw-s common passthrough (same shape as
      # app-template route blocks). Public surface is deliberately narrow and
      # there is NO default rule: unmatched paths 404 at the gateway, so
      # /metrics and /healthz are never exposed (ServiceMonitor scrapes
      # in-cluster). /admin/* rides the same origin because the dashboard
      # shell fetches its data from the listener it was served by (bearer-
      # guarded); the webhook intake gets a dedicated /hook path.
      # GitHub App webhook URL: https://pr-reviewer.jory.dev/hook
      route:
        main:
          hostnames: ["pr-reviewer.jory.dev"]
          parentRefs:
            - name: envoy-external
              namespace: network
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /hook
              backendRefs:
                - identifier: webhook
                  port: 8080
            - matches:
                - path:
                    type: PathPrefix
                    value: /admin
              backendRefs:
                - identifier: webhook
                  port: 8081
            - matches:
                - path:
                    type: PathPrefix
                    value: /dashboard
              backendRefs:
                - identifier: webhook
                  port: 8081
            - matches:
                - path:
                    type: Exact
                    value: /
              # Serve the dashboard at the bare host root without redirect.
              # Only the exact / request is rewritten; asset paths still use
              # the existing /dashboard prefix, and /admin stays protected.
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplaceFullPath
                      replaceFullPath: /dashboard
              backendRefs:
                - identifier: webhook
                  port: 8081

      persistence:
        runs:
          existingClaim: pr-reviewer-runs
        workspace-cache:
          existingClaim: pr-reviewer-workspace

    workerExecutor:
      mode: kubernetes
      namespace: "" # same namespace as the controller: shared claims mount at identical paths
      serviceAccount:
        create: true
        name: pr-reviewer-worker
      image:
        repository: ghcr.io/misospace/pr-reviewer-worker
        tag: "3.10.0"
      ttlSecondsAfterFinished: 1800
      volumeClaims:
        - name: pr-reviewer-runs
          size: 20Gi
          storageClass: ceph-filesystem # RWX: controller and worker Jobs share these claims
        - name: pr-reviewer-workspace
          size: 20Gi
          storageClass: ceph-filesystem

    # Chart default since 3.10.0 (misospace/pr-reviewer-action#1716): policies
    # are opt-in. Keep them explicitly off for the canary until they are
    # re-qualified with the documented KPR/model-endpoint exceptions.
    networkPolicy:
      enabled: false
