---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper-iris
spec:
  chartRef:
    kind: OCIRepository
    name: whisper
  interval: 15m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      whisper-iris:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/speaches-ai/speaches
              tag: 0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
            env:
              ENABLE_UI: "false"
              HF_HUB_CACHE: /cache/huggingface/hub
              PRELOAD_MODELS: '["Systran/faster-whisper-small.en"]'
              STT_MODEL_TTL: "-1"
              UVICORN_PORT: "8080"
              WHISPER__COMPUTE_TYPE: int8
              WHISPER__CPU_THREADS: "14"
              WHISPER__INFERENCE_DEVICE: cpu
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 4Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 6
    service:
      app:
        ports:
          http:
            port: 8080
    persistence:
      cache:
        existingClaim: whisper-iris-cache
        globalMounts:
          - path: /cache
