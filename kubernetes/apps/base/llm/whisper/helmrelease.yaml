---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
spec:
  chartRef:
    kind: OCIRepository
    name: whisper
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      nodeSelector:
        topology.kubernetes.io/gpus: intel
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      whisper:
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: openvino/model_server
              tag: 2026.4.1-gpu@sha256:a928903fe429f1e3e27107cc45932d30d95febfd2d1159dc50869c3eac76fc58
            command: ["ovms"]
            args:
              - --source_model
              - OpenVINO/whisper-large-v3-turbo-int4-ov
              - --model_name
              - whisper
              - --task
              - speech2text
              - --target_device
              - NPU
              - --model_repository_path
              - /cache
              - --cache_dir
              - /cache/ov-cache
              - --rest_port
              - "8080"
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 8Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /v2/health/live, port: 8080 }
                  periodSeconds: 10
                  failureThreshold: 360
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /v2/health/live, port: 8080 }
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /v2/health/ready, port: 8080 }
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 6
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames: ["{{ .Release.Name }}.jory.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      cache:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /cache
      accel:
        type: hostPath
        hostPath: /dev/accel
        hostPathType: Directory
        globalMounts:
          - path: /dev/accel
