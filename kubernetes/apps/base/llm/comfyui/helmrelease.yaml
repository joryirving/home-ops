---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: comfyui
spec:
  chartRef:
    kind: OCIRepository
    name: comfyui
  dependsOn: []
  interval: 15m
  values:
    controllers:
      comfyui:
        # replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/comfyui-xpu
              tag: 0.45.0@sha256:9abc2955fb1223de7dd5c7bcbaaa498c5dd26e9a20a2396139afca744222c51d
            securityContext:
              privileged: true
            env:
              COMFYUI_DISABLE_EXECUTION_CACHE: "0"
              COMFYUI_DISABLE_SMART_MEMORY: "0"
              HF_XET_HIGH_PERFORMANCE: "1"
              OMNIXPU_QWEN_IMAGE21_QKV: "1"
              ONEAPI_DEVICE_SELECTOR: "level_zero:gpu"
            resources:
              requests:
                cpu: 500m
                memory: 8Gi
              limits:
                memory: 24Gi
    defaultPodOptions:
      hostIPC: true
      nodeSelector:
        topology.kubernetes.io/gpus: intel
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
    service:
      app:
        ports:
          http:
            port: 8188
    route:
      app:
        hostnames: ["{{ .Release.Name }}.jory.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      comfyui:
        existingClaim: "comfyui"
        globalMounts:
          - path: /models/host
          - path: /data/user
            subPath: user
      data:
        type: nfs
        server: voyager.internal
        path: /mnt/daena/comfyui/
        globalMounts:
          - path: /data/output
            subPath: output
          - path: /data/input
            subPath: input
