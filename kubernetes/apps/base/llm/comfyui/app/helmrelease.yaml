---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: comfyui
spec:
  chartRef:
    kind: OCIRepository
    name: comfyui
  dependsOn: []
  interval: 15m
  values:
    controllers:
      comfyui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: yanwk/comfyui-boot
              tag: cpu@sha256:28813f118b7ec92d7c58fa729d382364ceaf87f6ea43eda9a44a5d73009ab0dd
            env:
              # --cpu is required; without it ComfyUI probes for an accelerator.
              CLI_ARGS: "--listen 0.0.0.0 --port 8188 --use-pytorch-cross-attention --disable-mmap --cpu"
              OMP_NUM_THREADS: "16"
              MKL_NUM_THREADS: "16"
            # It no longer shares a node with an LLM, so it no longer has to be
            # the sacrificial BestEffort pod. CPU inference wants cores: request 4
            # so it always schedules, cap at 16 of eula's 20 so a long generation
            # cannot starve the control plane. No memory limit - a hard cap would
            # OOM mid-generation, and the request is what protects it.
            resources:
              requests:
                cpu: "4"
                memory: 16Gi
              limits:
                cpu: "16"
    defaultPodOptions:
      hostIPC: true
      # No GPU at all now, so nothing pins this beyond keeping it off skirk —
      # that node's RAM belongs to dsv4f and comfyui no longer needs its iGPU.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/gpus
                    operator: DoesNotExist
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.69.10.44
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: 8188
    route:
      app:
        hostnames: ["{{ .Release.Name }}.jory.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      comfyui:
        existingClaim: "comfyui"
        globalMounts:
          - path: /root/ComfyUI/
      data:
        type: nfs
        server: voyager.internal
        path: /mnt/daena/comfyui/
        globalMounts:
          - path: /root/ComfyUI/output
            subPath: output
          - path: /root/ComfyUI/input
            subPath: input
