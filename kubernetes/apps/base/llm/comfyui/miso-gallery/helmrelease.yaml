---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miso-gallery
  namespace: llm
spec:
  chartRef:
    kind: OCIRepository
    name: miso-gallery
  interval: 15m
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      miso-gallery:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/misospace/miso-gallery
              tag: 0.2.0@sha256:230e17eb2268d7f922bb0925c51710075a3a6ea55004ea2bdb48b51b33c2218c
            env:
              IMAGE_BASE_URL: https://miso-gallery.jory.dev
              GALLERY_SCAN_LIMIT: 50000
            envFrom:
              - secretRef:
                  name: miso-gallery
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 2000m
                memory: 1Gi
    persistence:
      data:
        type: nfs
        server: voyager.internal
        path: /mnt/daena/comfyui/output
    route:
      app:
        hostnames: ["miso-gallery.jory.dev"]
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: 5000
