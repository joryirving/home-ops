---
# yaml-language-server: $schema=https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.31/#configmap-v1-core
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-wake-config
data:
  config.toml: |
    port = ":8080"
    # shenhe cold-boots from S5 in ~70s; hold the first request long enough.
    timeout = "10m"
    response_header_timeout = "20m"
    poll_interval = "5s"
    health_check_interval = "30s"
    health_cache_duration = "10s"

    # broadcast_ip is the target's UNICAST host IP, not a subnet broadcast. A
    # unicast magic packet routes cross-VLAN normally (the VLAN 69 "Servers"
    # network drops inbound cross-VLAN broadcast) and reaches the sleeping NIC
    # because the DHCP reservation keeps the gateway's IP->MAC binding alive.
    [[machines]]
    name = "shenhe"
    mac_address = "d8:9d:67:f4:2b:03"
    broadcast_ip = "10.69.1.25"
    wol_port = 9
    health_check = "tcp://shenhe.internal:8188"

    [[machines]]
    name = "smurf-pc"
    mac_address = "b4:2e:99:3e:2c:f3"
    broadcast_ip = "10.69.1.255"
    wol_port = 9
    health_check = "tcp://smurf-pc.internal:8889"

    [[routes]]
    machine = "shenhe"
    hostname = "comfy-wake.llm"
    destination = "http://shenhe.internal:8188"
    health_check = "tcp://shenhe.internal:8188"

    [[routes]]
    machine = "smurf-pc"
    hostname = "gemma-wake.llm"
    destination = "http://smurf-pc.internal:8889"
    health_check = "tcp://smurf-pc.internal:8889"
