---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: dispatch-mcp
spec:
  image: ghcr.io/misospace/dispatch-mcp:0.5.74@sha256:4531cf780454426d46cc1c8e7cebb124f0ad5200c98dc47d40ae686c5636b285
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    - name: DISPATCH_URL
      value: http://dispatch.llm:3000
  secrets:
    - name: toolhive-dispatch
      key: token
      targetEnvName: DISPATCH_AGENT_TOKEN
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
