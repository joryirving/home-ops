---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: dispatch-mcp
spec:
  image: ghcr.io/misospace/dispatch-mcp:0.5.71@sha256:06304dc367b8cdedae3e31c5567ba2fced64d8a5c4c203faab7250782edc5ed4
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    - name: DISPATCH_URL
      value: http://dispatch.llm:3000
  secrets:
    - name: toolhive-dispatch
      key: token
      targetEnvName: DISPATCH_AGENT_TOKEN
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
