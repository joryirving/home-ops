---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: marketplace-mcp
spec:
  image: ghcr.io/misospace/marketplace:main@sha256:2039b86f44bf7efccb56b0213bf8982b7f881d0d08e15a5936de91074ef70847
  transport: streamable-http
  mcpPort: 8080
  env:
    - name: MARKETPLACE_BACKEND
      value: facebook
    - name: HOST
      value: 0.0.0.0
    - name: PORT
      value: "8080"
    - name: BROWSER_PROFILE_DIR
      value: /home/node/.marketplace/browser-profile
    - name: FACEBOOK_MARKETS_FILE
      value: /etc/marketplace/markets.json
    - name: REAUTH_ADMIN_PORT
      value: "8787"
    - name: REAUTH_VIEWER_PORT
      value: "6080"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  podTemplateSpec:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mcp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: browser-profile
              mountPath: /home/node/.marketplace/browser-profile
            - name: markets
              mountPath: /etc/marketplace
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: browser-profile
          persistentVolumeClaim:
            claimName: marketplace-browser-profile
        - name: markets
          configMap:
            name: marketplace-markets
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  groupRef:
    name: mcp-tools
