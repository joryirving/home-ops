---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: marketplace-mcp
spec:
  image: ghcr.io/misospace/marketplace-mcp:main@sha256:be147f8db246ecf0a5f84c9c22e34935bcdadb09b038977eac9306913bcaa170
  transport: streamable-http
  mcpPort: 8080
  env:
    - name: MARKETPLACE_BACKEND
      value: facebook
    - name: HOST
      value: 0.0.0.0
    - name: HOME
      value: /tmp
    - name: PORT
      value: "8080"
    - name: BROWSER_PROFILE_DIR
      value: /home/node/.marketplace/browser-profile
    - name: FACEBOOK_MARKETS_FILE
      value: /etc/marketplace/markets.json
    - name: REAUTH_ADMIN_PORT
      value: "8787"
  secrets:
    - name: marketplace-mcp-user
      key: FACEBOOK_USERNAME
    - name: marketplace-mcp-password
      key: FACEBOOK_PASSWORD
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  podTemplateSpec:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mcp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: browser-profile
              mountPath: /home/node/.marketplace/browser-profile
            - name: markets
              mountPath: /etc/marketplace
              readOnly: true
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: browser-profile
          persistentVolumeClaim:
            claimName: marketplace-browser-profile
        - name: markets
          configMap:
            name: marketplace-markets
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  groupRef:
    name: mcp-tools
