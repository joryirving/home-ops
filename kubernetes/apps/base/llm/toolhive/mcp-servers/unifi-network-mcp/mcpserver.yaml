---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: unifi-network-mcp
spec:
  image: ghcr.io/sirkirby/unifi-network-mcp:0.29.4@sha256:1f54603ee12a66361bf9de74ce1d7abaf5e7a01f8f7d094bc64ed83dee79fd8b
  transport: streamable-http
  mcpPort: 3000
  groupRef:
    name: mcp-tools
  env:
    - name: UNIFI_NETWORK_HOST
      value: unifi.internal
    - name: UNIFI_NETWORK_SITE
      value: default
    - name: UNIFI_NETWORK_VERIFY_SSL
      value: "false"
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HTTP_TRANSPORT
      value: streamable-http
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_PORT
      value: "3000"
    - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
      value: "false"
    - name: UNIFI_TOOL_REGISTRATION_MODE
      value: meta_only
    - name: UNIFI_POLICY_CREATE
      value: "false"
    - name: UNIFI_POLICY_UPDATE
      value: "false"
    - name: UNIFI_POLICY_DELETE
      value: "false"
    - name: UNIFI_TOOL_PERMISSION_MODE
      value: confirm
  secrets:
    - name: toolhive-unifi-network-username
      key: UNIFI_NETWORK_USERNAME
      targetEnvName: UNIFI_NETWORK_USERNAME
    - name: toolhive-unifi-network-password
      key: UNIFI_NETWORK_PASSWORD
      targetEnvName: UNIFI_NETWORK_PASSWORD
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
