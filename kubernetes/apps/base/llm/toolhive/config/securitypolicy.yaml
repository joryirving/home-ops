---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp-gateway-api-key
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-gateway
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: mcp-gateway-api-keys
    extractFrom:
      - headers:
          - x-api-key
    sanitize: true
