---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-internal
spec:
  authServerConfig:
    issuer: https://mcp.jory.dev
    signingKeySecretRefs:
      - key: signing-key
        name: toolhive-auth
    upstreamProviders:
      - name: authentik
        oauth2Config:
          allowPrivateIPs: true
          authorizationEndpoint: https://sso.jory.dev/application/o/authorize/
          clientId: toolhive
          clientSecretRef:
            key: client-secret
            name: toolhive-auth
          redirectUri: https://mcp.jory.dev/oauth/callback
          scopes:
            - openid
            - profile
            - email
          tokenEndpoint: https://sso.jory.dev/application/o/token/
          userInfo:
            endpointUrl: https://sso.jory.dev/application/o/userinfo/
        type: oauth2
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      embeddingModel: toolhive-embed
      embeddingProvider: openai
      embeddingService: http://litellm.llm:4000/v1
      embeddingServiceTimeout: 60s
  incomingAuth:
    oidcConfigRef:
      audience: https://mcp.jory.dev
      name: mcp-gateway
      resourceUrl: https://mcp.jory.dev
      scopes:
        - openid
    type: oidc
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-embed
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
  sessionStorage:
    address: toolhive-config-dragonfly.llm:6379
    db: 0
    keyPrefix: "toolhive:vmcp:"
    provider: redis
