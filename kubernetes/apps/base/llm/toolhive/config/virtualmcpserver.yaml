---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-internal
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      embeddingModel: toolhive-embed
      embeddingProvider: openai
      embeddingService: http://litellm.llm:4000/v1
      embeddingServiceTimeout: 180s
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-embed
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
  sessionStorage:
    address: toolhive-config-dragonfly.llm:6379
    db: 0
    keyPrefix: "toolhive:vmcp:"
    passwordRef:
      key: password
      name: toolhive-config-redis
    provider: redis
