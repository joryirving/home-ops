---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcp-gateway-api-keys
    template:
      data:
        macbook: '{{ .TOOLHIVE_MACBOOK_API_KEY }}'
  dataFrom:
  - extract:
      key: toolhive
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-config-redis
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: toolhive-config-redis
    template:
      data:
        password: '{{ .TOOLHIVE_CONFIG_REDIS_PASSWORD }}'
  dataFrom:
  - extract:
      key: toolhive
