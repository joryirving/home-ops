---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-embed
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        OPENAI_API_KEY: "{{ .LITELLM_TOOLHIVE_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        client-secret: "{{ .TOOLHIVE_CLIENT_SECRET }}"
        hmac-secret: "{{ .TOOLHIVE_HMAC_SECRET }}"
        signing-key: "{{ .TOOLHIVE_SIGNING_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-config-redis
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        password: "{{ .TOOLHIVE_CONFIG_REDIS_PASSWORD }}"
  dataFrom:
    - extract:
        key: toolhive
