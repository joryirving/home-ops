---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: courier
spec:
  chartRef:
    kind: OCIRepository
    name: courier
  dependsOn: []
  interval: 15m
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            args:
              - --leader-elect
              - --git-remote-template=https://github.com/%s.git
              - --git-credential-secret=courier-github
              - --executor-environment-secret=courier-executor
    # Courier core has no Dispatch dependency. This home-ops deployment keeps
    # the optional Dispatch adapter configured but disabled for first reconcile.
    dispatch:
      enabled: false
      agentName: courier
      baseURL: http://dispatch.llm.svc.cluster.local:3000
      laneProfile: local
      pollInterval: 30s
      queueLane: local
      tokenSecret:
        key: token
        name: courier-dispatch
    executor:
      mcp:
        githubURL: http://mcp-github-proxy.llm.svc.cluster.local:8080/mcp
    rawResources:
      local-lane-profile:
        forceRename: local
        manifest:
          apiVersion: courier.misospace.dev/v1alpha1
          kind: LaneProfile
          metadata:
            name: local
            namespace: llm
          spec:
            concurrency: 1
            framing: >-
              You are a local coordinator: plan, delegate, integrate, and
              verify. Do not implement yourself. Send small, file-scoped work to
              coder-local, and keep at most TWO coder-local in flight — the 3090
              handles about two full-context requests at once, so a third only
              queues and steals throughput. Use explorer-local for recon and
              "where/how is X" scouting before you plan. After a substantive
              change, dispatch agentic-local for an independent review pass over
              the diff, then act on what it finds. Push and update the feature
              branch, get CI healthy, never merge, and leave the pull request
              open and ready for human review.
            roles:
              agentic-local: litellm/qwen3.8-flash-next
              coder-local: litellm/qwen3.8-27b
              coordinator: litellm/qwen3.8-flash-next
              explorer-local: litellm/gemma-4-12b-it-qat
