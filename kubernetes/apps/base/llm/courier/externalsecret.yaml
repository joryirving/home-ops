---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courier-dispatch
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: courier-dispatch
    template:
      engineVersion: v2
      data:
        token: "{{ .DISPATCH_AGENT_TOKEN }}"
  dataFrom:
    - extract:
        key: dispatch
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courier-executor
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: courier-executor
    template:
      engineVersion: v2
      data:
        LITELLM_API_KEY: "{{ .LITELLM_COURIER_API_KEY }}"
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        OPENCODE_CONFIG_CONTENT: |-
          {
            "compaction": { "auto": true, "keep": { "tokens": 20000 }, "buffer": 16384 },
            "tool_output": { "max_lines": 800, "max_bytes": 16384 },
            "provider": {
              "litellm": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "LiteLLM",
                "options": {
                  "baseURL": "http://litellm.llm:4000/v1",
                  "apiKey": "{env:LITELLM_API_KEY}",
                  "timeout": 1800000,
                  "headerTimeout": 900000,
                  "chunkTimeout": 900000
                },
                "models": {
                  "qwen3.8-27b": {
                    "name": "Qwen3.8-27B W4A16 (3090 vLLM)",
                    "limit": {
                      "context": 147456,
                      "output": 24576
                    }
                  },
                  "qwen3.8-flash-next": {
                    "name": "Qwen3.8-Flash-Next IQ4_NL (Strix ROCm, vision)",
                    "limit": {
                      "context": 262144,
                      "output": 16384
                    }
                  },
                  "free-pool": {
                    "name": "Free pool (free-tier cloud models)",
                    "limit": {
                      "context": 200000,
                      "output": 64000
                    }
                  }
                }
              }
            }
          }
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: github-miso
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courier-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: courier-github
    template:
      engineVersion: v2
      data:
        token: "{{ .GITHUB_TOKEN }}"
        username: x-access-token
  dataFrom:
    - extract:
        key: github-miso
