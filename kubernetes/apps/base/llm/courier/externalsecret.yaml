---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courier-dispatch
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: courier-dispatch
    template:
      engineVersion: v2
      data:
        token: "{{ .DISPATCH_AGENT_TOKEN }}"
  dataFrom:
    - extract:
        key: dispatch
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courier-executor
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: courier-executor
    template:
      engineVersion: v2
      data:
        LITELLM_API_KEY: "{{ .LITELLM_COURIER_API_KEY }}"
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        OPENCODE_CONFIG_CONTENT: |-
          {
            "compaction": { "auto": true, "keep": { "tokens": 20000 }, "buffer": 16384 },
            "tool_output": { "max_lines": 800, "max_bytes": 16384 },
            "provider": {
              "litellm": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "LiteLLM",
                "options": {
                  "baseURL": "http://litellm.llm:4000/v1",
                  "apiKey": "{env:LITELLM_API_KEY}",
                  "timeout": 1800000,
                  "headerTimeout": 900000,
                  "chunkTimeout": 900000
                },
                "models": {
                  "qwen3.8-27b": {
                    "name": "Qwen3.8-27B W4A16 (3090 vLLM)",
                    "limit": {
                      "context": 147456,
                      "output": 24576
                    }
                  },
                  "qwen3.8-flash-next": {
                    "name": "Qwen3.8-Flash-Next IQ4_NL (Strix ROCm, vision)",
                    "limit": {
                      "context": 262144,
                      "output": 16384
                    }
                  },
                  "free-pool": {
                    "name": "Free pool (free-tier cloud models)",
                    "limit": {
                      "context": 200000,
                      "output": 64000
                    }
                  },
                  "dsv4.1f": {
                    "name": "DeepSeek V4.1 Flash (Hyper, daily-cap)",
                    "limit": {
                      "context": 1000000,
                      "output": 131072
                    }
                  },
                  "implementation-pool": {
                    "name": "Implementation Pool (Luna high -> 27B -> M2.7, 147k)",
                    "limit": {
                      "context": 147456,
                      "output": 16384
                    }
                  },
                  "reasoning-pool": {
                    "name": "Reasoning Pool (K2.7 -> Sol -> GLM-5.3-Flash -> M3 -> flash-next)",
                    "limit": {
                      "context": 1000000,
                      "output": 16384
                    }
                  },
                  "glm-5.3-flash": {
                    "name": "GLM 5.3 Flash (oracle)",
                    "limit": {
                      "context": 1000000,
                      "output": 131072
                    }
                  }
                }
              },
              "litellm-anthropic": {
                "npm": "@ai-sdk/anthropic",
                "name": "LiteLLM Anthropic",
                "options": {
                  "baseURL": "http://litellm.llm:4000/v1",
                  "authToken": "{env:LITELLM_API_KEY}",
                  "timeout": 1800000
                },
                "models": {
                  "MiniMax-M3": {
                    "name": "MiniMax M3 (1M ctx, flat-rate, cloud)",
                    "limit": {
                      "context": 1000000,
                      "output": 131072
                    }
                  },
                  "MiniMax-M2.7": {
                    "name": "MiniMax M2.7 (262k ctx, flat-rate)",
                    "limit": {
                      "context": 204800,
                      "output": 131072
                    }
                  }
                }
              }
            }
          }
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: github-miso
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courier-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: courier-github
    template:
      engineVersion: v2
      data:
        token: "{{ .GITHUB_TOKEN }}"
        username: x-access-token
  dataFrom:
    - extract:
        key: github-miso
