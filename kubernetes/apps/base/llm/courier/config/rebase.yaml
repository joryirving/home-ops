---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/courier.misospace.dev/laneprofile_v1alpha1.json
apiVersion: courier.misospace.dev/v1alpha1
kind: LaneProfile
metadata:
  name: rebase
  namespace: llm
spec:
  concurrency: 1
  # The engine's deterministic rules resolve what they can; when
  # --rebase-model-assist is enabled on the manager, the same lane model is
  # asked once per episode to resolve files the closed rules reject.
  roles:
    coordinator: litellm/qwen3.8-flash-next
