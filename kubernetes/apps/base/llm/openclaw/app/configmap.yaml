---
# JSON5-friendly OpenClaw gateway config. Flux postBuild leaves OpenClaw ${VAR} placeholders;
# use $${VAR} here so Flux emits a literal ${VAR} for runtime env substitution.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
data:
  openclaw.json: |
    {
      agents: {
        defaults: {
          // continuation-skip: workspace files inject once per session, not on every
          // continuation turn; agents rely on lossless-claw summaries + memory_recall after.
          // If agents "forget their contract" deep into long sessions, flip back to "always".
          contextInjection: "continuation-skip",
          // Truncation caps, not allocations (live files are ~3KB each after the 2026-07-29
          // prompt-hygiene trim). Sized to catch runaway daily memory/YYYY-MM-DD.md logs.
          // Previous values: 50000 / 100000.
          bootstrapMaxChars: 16384,
          bootstrapTotalMaxChars: 49152,
          thinkingDefault: "high",
          timeoutSeconds: 1800,
          model: {
            primary: "minimax/MiniMax-M3",
            fallbacks: [
              "litellm/llama-strix",
              "litellm/llama-nvidia",
              "litellm/dsv4f",
            ]
          },
          imageModel: {
            primary: "litellm/llama-nvidia-chat",
            fallbacks: [
              "litellm/llama-strix-chat",
              "litellm/glm-5.3-flash",
              "minimax/MiniMax-M3",
            ]
          },
          mediaModels: {
            image: {
              primary: "comfy/workflow",
            },
          },
          models: {
            "litellm/kimi-k2.7": { alias: "kimi-cheap", params: { cache_prompt: true } },
            "litellm/kimi-k3": { alias: "kimi", params: { cache_prompt: true } },
            "minimax/MiniMax-M3": { alias: "minimax", params: { cacheRetention: "short" } },
            "minimax/MiniMax-M2.7": { alias: "minimax-old", params: { cacheRetention: "short" } },
            "litellm/llama-strix": { alias: "skirk", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/llama-strix-chat": { alias: "skirk-chat", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/llama-reviewer": { alias: "reviewer", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/llama-reviewer-chat": { alias: "reviewer-chat", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/local-pool": { alias: "local", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/local-pool-chat": { alias: "local-chat", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/llama-nvidia": { alias: "nvidia", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/llama-nvidia-chat": { alias: "nvidia-chat", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/dsv4f": { alias: "dsv4f", params: { cache_prompt: true } },
            "litellm/glm-5.3-flash": { alias: "glm-flash", params: { cache_prompt: true } },
            "litellm/glm-5.3": { alias: "glm-5.3", params: { cache_prompt: true } },
            "litellm/frontier-pool": { alias: "frontier" },
            "litellm/reasoning-pool": { alias: "reasoning" },
            "litellm/implementation-pool": { alias: "implementation" },
            "litellm/chatgpt/gpt-6-astra": { alias: "astra" },
            "litellm/chatgpt/gpt-5.6-sol": { alias: "gpt" },
            "litellm/chatgpt/gpt-5.6-terra": { alias: "gpt-balanced" },
            "litellm/chatgpt/gpt-5.6-luna": { alias: "gpt-cheap" },
          },
          modelPolicy: {
            allow: [
              "litellm/kimi-k2.7",
              "litellm/kimi-k3",
              "minimax/MiniMax-M3",
              "minimax/MiniMax-M2.7",
              "litellm/llama-strix",
              "litellm/llama-strix-chat",
              "litellm/llama-reviewer",
              "litellm/llama-reviewer-chat",
              "litellm/local-pool",
              "litellm/local-pool-chat",
              "litellm/llama-nvidia",
              "litellm/llama-nvidia-chat",
              "litellm/dsv4f",
              "litellm/glm-5.3-flash",
              "litellm/glm-5.3",
              "litellm/frontier-pool",
              "litellm/reasoning-pool",
              "litellm/implementation-pool",
              "litellm/chatgpt/gpt-6-astra",
              "litellm/chatgpt/gpt-5.6-sol",
              "litellm/chatgpt/gpt-5.6-terra",
              "litellm/chatgpt/gpt-5.6-luna",
            ],
          },
          compaction: { mode: "default", timeoutSeconds: 600, memoryFlush: { enabled: true, softThresholdTokens: 80000 },
          },
          maxConcurrent: 4,
          subagents: {
            model: {
              primary: "minimax/MiniMax-M3",
            },
            archiveAfterMinutes: 120,
            maxConcurrent: 3,
            thinking: "high",
          },
          heartbeat: {
            every: "60m",
            model: "litellm/llama-strix-chat",
            directPolicy: "allow",
            lightContext: true,
            isolatedSession: true,
          },
          systemAgent: { agentId: "main" },
        },
        entries: {
          main: {
            name: "Miso",
            workspace: "/home/node/.openclaw/workspace",
            agentDir: "/home/node/.openclaw/agents/main/agent",
            thinkingDefault: "adaptive",
            tools: { alsoAllow: ["memory_recall", "memory_list", "memory_remember"] },
            identity: {
              name: "Miso",
              avatar: "avatars/miso_avatar.png",
            },
            model: {
              primary: "litellm/glm-5.3-flash",
              fallbacks: [
                "minimax/MiniMax-M3",
                "litellm/kimi-k3",
                "litellm/dsv4f",
                "litellm/llama-nvidia",
                "litellm/llama-strix",
              ]
            },
          },
          matcha: {
            name: "Matcha",
            workspace: "/home/node/.openclaw/workspace-matcha",
            agentDir: "/home/node/.openclaw/agents/matcha/agent",
            tools: { allow: ["exec", "message", "read", "web_fetch", "web_search", "view_image", "memory_recall", "memory_list", "memory_remember"] },
            thinkingDefault: "low",
            model: {
              primary: "litellm/dsv4f",
              fallbacks: [
                "minimax/MiniMax-M2.7",
                "litellm/llama-strix",
                "litellm/llama-nvidia",
              ]
            },
            identity: {
              name: "Matcha",
              avatar: "avatars/matcha_avatar.png",
            }
          },
          saffron: {
            name: "Saffron",
            workspace: "/home/node/.openclaw/workspace-saffron",
            agentDir: "/home/node/.openclaw/agents/saffron/agent",
            tools: { allow: ["exec", "read", "write", "message", "web_fetch", "web_search", "browser", "sessions_spawn", "memory_recall", "memory_list", "memory_remember", "toolhive__find_tool","toolhive__call_tool"] },
            thinkingDefault: "high",
            model: {
              primary: "litellm/reasoning-pool",
              fallbacks: [
                "litellm/dsv4f",
                "litellm/llama-nvidia",
                "litellm/llama-strix",
              ]
            },
            identity: {
              name: "Saffron",
              avatar: "avatars/saffron_avatar.png",
            }
          },
          sage: {
            name: "Sage",
            workspace: "/home/node/.openclaw/workspace-sage",
            agentDir: "/home/node/.openclaw/agents/sage/agent",
            tools: { allow: ["web_fetch", "web_search", "view_image", "chart_generate", "youtube_tldw", "reddit_thread", "facebook_listing", "sage_runtime_status", "sage_office_temperature", "sage_reference_remember", "memory_recall", "memory_list"] },
            thinkingDefault: "low",
            model: {
              primary: "litellm/llama-nvidia-chat",
              fallbacks: [],
            },
            identity: {
              name: "Sage",
              avatar: "avatars/sage_avatar.png",
            }
          },
        },
        ownership: "explicit",
      },
      tts: {
        provider: "openai",
        providers: {
          // Self-hosted Lemonade, OpenMOSS TTS on the Strix iGPU via Vulkan.
          // Uses the openai provider because Lemonade serves an OpenAI-compatible
          // /v1/audio/speech. extraBody carries the pinned voice reference, which
          // OpenMOSS needs on every request because it has no saved-voice concept;
          // it is also far faster than voice_design_description, which reinvents a
          // reference each call. responseFormat is wav because OpenMOSS v0.3 encodes
          // only wav or pcm, and ffmpeg in this pod converts to opus for Discord.
          openai: {
            baseUrl: "http://lemonade-tts.llm:13305/v1",
            apiKey: "not-required",
            model: "MOSS-TTS-Local",
            responseFormat: "wav",
            extraBody: {
              reference_wav_b64: "",
            },
          },
          elevenlabs: {
            apiKey: "$${ELEVENLABS_API_KEY}",
            voiceId: "cgSgspJ2msm6clMCkdW9",
            modelId: "eleven_multilingual_v2",
          },
          minimax: {
            baseUrl: "https://api.minimax.io",
            apiKey: "$${MINIMAX_TTS_API_KEY}",
            model: "speech-2.8-hd",
            voiceId: "English_radiant_girl",
          },
        },
      },
      tools: {
        media: {
          image: { timeoutSeconds: 180 },
          audio: { enabled: true },
          models: [
            { type: "cli", command: "whisper-stt", args: ["{{AttachmentPath}}"], capabilities: ["audio"], timeoutSeconds: 120 },
          ],
        },
        sessions: { visibility: "all" },
        agentToAgent: { enabled: true },
        exec: { mode: "full", strictInlineEval: false },
        elevated: { enabled: true, allowFrom: { discord: ["$${DISCORD_ADMIN_USER_ID}"] } },
        web: { search: { enabled: true, provider: "searxng", openaiCodex: { enabled: true, mode: "cached" } }, fetch: { enabled: true } },
      },
      commands: {
        native: "auto",
        nativeSkills: "auto",
        restart: false,
        ownerAllowFrom: ["discord:$${DISCORD_ADMIN_USER_ID}"],
        allowFrom: { discord: ["$${DISCORD_ADMIN_USER_ID}"] },
      },
      models: {
        providers: {
          "litellm": {
            baseUrl: "http://litellm.llm:4000/v1",
            apiKey: "$${LITELLM_API_KEY}",
            api: "openai-completions",
            timeoutSeconds: 1800,
            models: [
              { id: "kimi-k2.7", name: "Kimi K2.7 Code", reasoning: true, input: ["text", "image"], cost: { input: 0.95, output: 4, cacheRead: 0.19, cacheWrite: 0.95 }, contextWindow: 262144, maxTokens: 32768, compat: { supportsUsageInStreaming: true } },
              { id: "kimi-k3", name: "Kimi K3", reasoning: true, input: ["text", "image"], cost: { input: 3, output: 15, cacheRead: 0.3, cacheWrite: 3 }, contextWindow: 262144, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "llama-strix", name: "Qwen3.6-35B-A3B UD-Q4_K_XL (ROCm)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "llama-strix-chat", name: "Qwen3.6-35B-A3B non-thinking (ROCm)", reasoning: false, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "llama-reviewer", name: "Gemma-4-12B-it-QAT (9070XT)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "llama-reviewer-chat", name: "Gemma-4-12B non-thinking (9070XT)", reasoning: false, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "local-pool", name: "Local pool (nvidia/gemma/strix, thinking)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "local-pool-chat", name: "Local pool (non-thinking)", reasoning: false, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "llama-nvidia", name: "Qwen3.8-27B UD Q4_K_XL (CUDA)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "llama-nvidia-chat", name: "Qwen3.8-27B non-thinking (CUDA)", reasoning: false, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "dsv4f", name: "DeepSeek V4 Flash (neuralwatt)", reasoning: true, input: ["text"], cost: { input: 0.0577, output: 0.0577, cacheRead: 0.0577, cacheWrite: 0.0577 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "glm-5.3-flash", name: "Z.Ai GLM 5.3 Flash", reasoning: true, input: ["text", "image"], cost: { input: 0.15, output: 0.5, cacheRead: 0.03, cacheWrite: 0.15 }, contextWindow: 1000000, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "glm-5.3", name: "Z.Ai GLM 5.3", reasoning: true, input: ["text"], cost: { input: 1.4, output: 4.4, cacheRead: 0.28, cacheWrite: 1.4 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "implementation-pool", name: "Implementation Pool (luna->M2.7->nvidia)", reasoning: true, input: ["text"], cost: { input: 0.2, output: 1.2, cacheRead: 0.02, cacheWrite: 0.2 }, contextWindow: 131072, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "frontier-pool", name: "Frontier Pool (astra->K3->GLM)", reasoning: true, input: ["text", "image"], cost: { input: 10, output: 50, cacheRead: 1, cacheWrite: 12.5 }, contextWindow: 262144, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "reasoning-pool", name: "Reasoning Pool (terra->glm-flash->M3->strix)", reasoning: true, input: ["text"], cost: { input: 0.2, output: 1.2, cacheRead: 0.02, cacheWrite: 0.2 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "chatgpt/gpt-6-astra", name: "ChatGPT GPT-6 Astra", reasoning: true, input: ["text"], cost: { input: 10, output: 50, cacheRead: 1, cacheWrite: 12.5 }, contextWindow: 272000, maxTokens: 128000, compat: { supportsUsageInStreaming: true } },
              { id: "chatgpt/gpt-5.6-sol", name: "ChatGPT GPT-5.6 Sol", reasoning: true, input: ["text"], cost: { input: 5, output: 30, cacheRead: 0.5, cacheWrite: 5 }, contextWindow: 1050000, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "chatgpt/gpt-5.6-terra", name: "ChatGPT GPT-5.6 Terra", reasoning: true, input: ["text"], cost: { input: 2, output: 12, cacheRead: 0.2, cacheWrite: 2 }, contextWindow: 1050000, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "chatgpt/gpt-5.6-luna", name: "ChatGPT GPT-5.6 Luna", reasoning: true, input: ["text"], cost: { input: 0.2, output: 1.2, cacheRead: 0.02, cacheWrite: 0.2 }, contextWindow: 1050000, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
            ]
          },
          "minimax": {
            baseUrl: "http://litellm.llm:4000",
            apiKey: "$${LITELLM_API_KEY}",
            api: "anthropic-messages",
            timeoutSeconds: 600,
            models: [
              { id: "MiniMax-M3", name: "MiniMax M3", reasoning: true, input: ["text","image"], cost: { input: 0.3, output: 1.2, cacheRead: 0.03, cacheWrite: 0.3 }, contextWindow: 262144, maxTokens: 32768, compat: { supportsUsageInStreaming: true } },
              { id: "MiniMax-M2.7", name: "MiniMax M2.7", reasoning: true, input: ["text"], cost: { input: 0.3, output: 1.2, cacheRead: 0.03, cacheWrite: 0.3 }, contextWindow: 204800, maxTokens: 32768, compat: { supportsUsageInStreaming: true } },
            ],
          },
        }
      },
      auth: {
        profiles: {
          "openai:$${OPENAI_CODEX_USERNAME}": { provider: "openai", mode: "oauth" },
        },
      },
      bindings: [
        { agentId: "main",    match: { channel: "discord", accountId: "default" } },
        { agentId: "saffron", match: { channel: "discord", accountId: "saffron" } },
        { agentId: "matcha",  match: { channel: "discord", accountId: "matcha" } },
        { agentId: "matcha",  match: { channel: "discord", accountId: "matcha", peer: { kind: "channel", id: "$${MATCHA_CHANNEL_ID}" } } },
        { agentId: "sage", match: { channel: "discord", accountId: "sage" } },
        { agentId: "main", match: { channel: "discord", accountId: "*" } },
      ],
      channels: {
        discord: {
          enabled: true,
          defaultAccount: "default",
          actions: {
            messages: true,
            channels: true,
            search: true,
            reactions: false,
            stickers: false,
            polls: false,
            permissions: false,
            threads: false,
            pins: false,
            memberInfo: false,
            roleInfo: false,
            roles: false,
            channelInfo: false,
            voiceStatus: false,
            events: false,
            moderation: false,
            emojiUploads: false,
            stickerUploads: false,
          },
          voice: {
            enabled: true,
            mode: "stt-tts",
          },
          streaming: { block: { enabled: false } },
          groupPolicy: "allowlist",
          dmPolicy: "pairing",
          accounts: {
            default: {
              token: "$${DISCORD_BOT_TOKEN}",
              responsePrefix: "[{model}]",
              guilds: {
                "*": { users: ["$${DISCORD_ADMIN_USER_ID}"] },
              },
            },
            saffron: {
              token: "$${SAFFRON_BOT_TOKEN}",
              responsePrefix: "[{model}]",
              guilds: {
                "*": { users: ["$${DISCORD_ADMIN_USER_ID}"] },
              },
            },
            matcha: {
              token: "$${MATCHA_BOT_TOKEN}",
              guilds: {
                "*": {
                  channels: {
                    matcha: { enabled: true, requireMention: false },
                  },
                },
              },
            },
            sage: {
              token: "$${SAGE_BOT_TOKEN}",
              dmPolicy: "disabled",
              guilds: {
                "western-subaru-club": {
                  requireMention: true,
                },
                "tako-tuesday": {
                  requireMention: true,
                },
                "*": { users: ["$${DISCORD_ADMIN_USER_ID}"] },
              },
            },
          },
        },
      },
      plugins: {
        allow: ["discord", "lossless-claw", "memini", "searxng", "comfy", "memory-wiki", "chart-renderer", "youtube-tldw", "reddit-thread", "facebook-listing", "sage-environment", "sage-reference-memory", "minimax", "litellm", "browser", "admin-http-rpc", "openai"],
        entries: {
          discord: { enabled: true },
          "chart-renderer": { enabled: true },
          "youtube-tldw": { enabled: true },
          "reddit-thread": { enabled: true },
          "facebook-listing": { enabled: true },
          comfy: {
            enabled: true,
            config: {
              mode: "local",
              allowPrivateNetwork: true,
              baseUrl: "http://10.69.10.44:8188",
              image: {
                workflowPath: "/home/node/.openclaw/workflows/openclaw-generate.json",
                promptNodeId: "2",
                outputNodeId: "7",
              },
            },
          },
          "admin-http-rpc": { enabled: true },
          "lossless-claw": {
            enabled: true,
            hooks: {
              allowConversationAccess: true,
            },
            llm: { allowModelOverride: true, allowedModels: [ "litellm/local-pool-chat" ], },
            subagent: { allowModelOverride: true, allowedModels: [ "litellm/local-pool-chat" ], },
            config: {
              contextThreshold: 0.75,
              contextThresholdOverrides: [
                {
                  name: "llama-strix-family-safe",
                  match: { model: "litellm/llama-strix" },
                  contextThreshold: 0.50,
                },
                {
                  name: "llama-strix-chat-family-safe",
                  match: { model: "litellm/llama-strix-chat" },
                  contextThreshold: 0.50,
                },
                {
                  name: "llama-nvidia-family-safe",
                  match: { model: "litellm/llama-nvidia" },
                  contextThreshold: 0.50,
                },
                {
                  name: "llama-nvidia-chat-family-safe",
                  match: { model: "litellm/llama-nvidia-chat" },
                  contextThreshold: 0.50,
                },
                {
                  name: "llama-reviewer-family-safe",
                  match: { model: "litellm/llama-reviewer" },
                  contextThreshold: 0.50,
                },
                {
                  name: "llama-reviewer-chat-family-safe",
                  match: { model: "litellm/llama-reviewer-chat" },
                  contextThreshold: 0.50,
                },
                {
                  name: "local-pool-family-safe",
                  match: { model: "litellm/local-pool" },
                  contextThreshold: 0.50,
                },
                {
                  name: "local-pool-chat-family-safe",
                  match: { model: "litellm/local-pool-chat" },
                  contextThreshold: 0.50,
                },
              ],
              delegationTimeoutMs: 1000000,
              expansionModel: "litellm/local-pool-chat",
              freshTailCount: 64,
              freshTailMaxTokens: 24000,
              ignoreSessionPatterns: [
                "agent:*:cron:**",
                "agent:*:heartbeat:**",
                "heartbeat:**",
                "**:heartbeat:**"
              ],
              incrementalMaxDepth: 1,
              leafChunkTokens: 20000,
              newSessionRetainDepth: 2,
              proactiveThresholdCompactionMode: "inline",
              pruneHeartbeatOk: true,
              skipStatelessSessions: true,
              statelessSessionPatterns: [ "agent:*:subagent:**" ],
              summaryModel: "litellm/local-pool-chat",
              summaryTimeoutMs: 1000000,
              sweepDeadlineMs: 300000,
              compactUntilUnderDeadlineMs: 600000,
              transcriptGcEnabled: false,
              largeFileThresholdTokens: 6000,
              stubLargeToolPayloads: false,
            },
          },
          searxng: {
            enabled: true,
            config: {
              webSearch: {
                baseUrl: "http://searxng.llm:8080",
                language: "en"
              }
            }
          },
          "memory-wiki": {
            enabled: true,
            config: {
              vaultMode: "bridge",
              vault: {
                path: "/home/node/.openclaw/wiki/main",
                renderMode: "native",
              },
              bridge: {
                enabled: true,
                readMemoryArtifacts: true,
                indexDreamReports: true,
                indexDailyNotes: true,
                indexMemoryRoot: true,
                followMemoryEvents: true,
              },
              search: {
                backend: "shared",
                corpus: "all",
              },
              render: {
                preserveHumanBlocks: true,
                createBacklinks: true,
                createDashboards: true,
              },
            },
          },
          openai: {
            enabled: true,
          },
          browser: {
            enabled: true,
          },
          memini: {
            enabled: true,
            hooks: {
              allowConversationAccess: true,
            },
            config: {
              base_url: "http://memini.llm:8080",
