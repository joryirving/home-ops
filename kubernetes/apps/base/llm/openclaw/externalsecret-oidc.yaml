---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        # Envoy Gateway SecurityPolicy OIDC expects these exact key names.
        client-id: "{{ .OPENCLAW_CLIENT_ID }}"
        client-secret: "{{ .OPENCLAW_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: openclaw
