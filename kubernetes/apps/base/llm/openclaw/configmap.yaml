---
# JSON5-friendly OpenClaw gateway config. Flux postBuild leaves OpenClaw ${VAR} placeholders;
# use $${VAR} here so Flux emits a literal ${VAR} for runtime env substitution.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
data:
  openclaw.json: |
    {
      agents: {
        defaults: {
          // continuation-skip: workspace files inject once per session, not on every
          // continuation turn; agents rely on lossless-claw summaries + memory_recall after.
          // If agents "forget their contract" deep into long sessions, flip back to "always".
          contextInjection: "continuation-skip",
          // Truncation caps, not allocations (live files are ~3KB each after the 2026-07-29
          // prompt-hygiene trim). Sized to catch runaway daily memory/YYYY-MM-DD.md logs.
          // Previous values: 50000 / 100000.
          bootstrapMaxChars: 16384,
          bootstrapTotalMaxChars: 49152,
          thinkingDefault: "high",
          timeoutSeconds: 1800,
          model: {
            primary: "minimax/MiniMax-M3.1-Flash",
            fallbacks: [
              "litellm/qwen3.8-flash-next",
              "litellm/qwen3.8-27b",
              "litellm/dsv4.1f",
            ]
          },
          imageModel: {
            primary: "litellm/qwen3.8-flash-next-chat",
            fallbacks: [
              "litellm/muse-glimmer",
              "litellm/glm-5.3-flash",
              "litellm/dsv4.1f",
              "minimax/MiniMax-M3.1-Flash",
            ]
          },
          mediaModels: {
            image: {
              primary: "comfy/workflow",
            },
          },
          models: {
            "litellm/kimi-k2.7": { alias: "kimi-cheap", params: { cache_prompt: true } },
            "litellm/kimi-k3": { alias: "kimi", params: { cache_prompt: true } },
            "minimax/MiniMax-M3": { alias: "minimax-old", params: { cacheRetention: "short" } },
            "litellm-anthropic/MiniMax-M3.1-Flash": { alias: "minimax", params: { cacheRetention: "short" } },
            "litellm/qwen3.8-flash-next": { alias: "skirk", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/qwen3.8-flash-next-chat": { alias: "skirk-chat", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/local-pool": { alias: "local", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/local-pool-chat": { alias: "local-chat", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/qwen3.8-27b": { alias: "nvidia", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/qwen3.8-27b-chat": { alias: "nvidia-chat", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/muse-glimmer": { alias: "muse", params: { cache_prompt: true, extra_body: { return_progress: true } } },
            "litellm/dsv4.1f": { alias: "dsv4.1f", params: { cache_prompt: true } },
            "litellm/glm-5.3-flash": { alias: "glm-flash", params: { cache_prompt: true } },
            "litellm/glm-5.3": { alias: "glm-5.3", params: { cache_prompt: true } },
            "litellm/frontier-pool": { alias: "frontier" },
            "litellm/reasoning-pool": { alias: "reasoning" },
            "litellm/implementation-pool": { alias: "implementation" },
            "litellm/chatgpt/gpt-6-astra": { alias: "gpt" },
            "litellm/chatgpt/gpt-6.1-sol": { alias: "gpt-balanced" },
            "litellm/chatgpt/gpt-6-luna": { alias: "gpt-cheap" },
          },
          modelPolicy: {
            allow: [
              "litellm/kimi-k2.7",
              "litellm/kimi-k3",
              "minimax/MiniMax-M3.1-Flash",
              "minimax/MiniMax-M3",
              "litellm/qwen3.8-flash-next",
              "litellm/qwen3.8-flash-next-chat",
              "litellm/local-pool",
              "litellm/local-pool-chat",
              "litellm/qwen3.8-27b",
              "litellm/qwen3.8-27b-chat",
              "litellm/muse-glimmer",
              "litellm/dsv4.1f",
              "litellm/glm-5.3-flash",
              "litellm/glm-5.3",
              "litellm/frontier-pool",
              "litellm/reasoning-pool",
              "litellm/implementation-pool",
              "litellm/chatgpt/gpt-6-astra",
              "litellm/chatgpt/gpt-6.1-sol",
              "litellm/chatgpt/gpt-6-luna",
            ],
          },
          compaction: { mode: "default", timeoutSeconds: 600, memoryFlush: { enabled: true, softThresholdTokens: 80000 },
          },
          maxConcurrent: 4,
          subagents: {
            model: {
              primary: "litellm/muse-glimmer",
            },
            archiveAfterMinutes: 120,
            maxConcurrent: 3,
            thinking: "high",
          },
          heartbeat: {
            every: "60m",
            model: "litellm/qwen3.8-flash-next-chat",
            directPolicy: "allow",
            lightContext: true,
            isolatedSession: true,
          },
          systemAgent: { agentId: "main" },
        },
        entries: {
          main: {
            name: "Miso",
            workspace: "/home/node/.openclaw/workspace",
            agentDir: "/home/node/.openclaw/agents/main/agent",
            thinkingDefault: "adaptive",
            tools: { alsoAllow: ["memory_recall", "memory_list", "memory_remember", "memory_forget", "memory_briefing"] },
            identity: {
              name: "Miso",
              avatar: "avatars/miso_avatar.png",
            },
            model: {
              primary: "litellm/glm-5.3-flash",
              fallbacks: [
                "litellm/kimi-k3",
                "minimax/MiniMax-M3.1-Flash",
                "litellm/muse-glimmer",
                "litellm/qwen3.8-flash-next",
                "litellm/dsv4.1f",
              ]
            },
            heartbeat: {
              // Explicit delivery route — the owner-DM resolution path fails
              // closed for unproven targets under dmPolicy "pairing", leaving
              // heartbeats skipped with "no-route" since the 2026.9 conversion.
              target: "discord",
              to: "$${DISCORD_ADMIN_USER_ID}",
            },
          },
          matcha: {
            name: "Matcha",
            workspace: "/home/node/.openclaw/workspace-matcha",
            agentDir: "/home/node/.openclaw/agents/matcha/agent",
            tools: { allow: ["exec", "message", "read", "web_fetch", "web_search", "view_image", "memory_recall", "memory_list", "memory_remember"] },
            thinkingDefault: "low",
            model: {
              primary: "minimax/MiniMax-M3.1-Flash",
              fallbacks: [
                "litellm/muse-glimmer",
                "litellm/qwen3.8-flash-next",
              ]
            },
            identity: {
              name: "Matcha",
              avatar: "avatars/matcha_avatar.png",
            }
          },
          saffron: {
            name: "Saffron",
            workspace: "/home/node/.openclaw/workspace-saffron",
            agentDir: "/home/node/.openclaw/agents/saffron/agent",
            tools: { allow: ["exec", "read", "write", "message", "web_fetch", "web_search", "browser", "sessions_spawn", "memory_recall", "memory_list", "memory_remember", "toolhive__find_tool","toolhive__call_tool"] },
            thinkingDefault: "high",
            model: {
              primary: "litellm/reasoning-pool",
              fallbacks: [
                "litellm/dsv4.1f",
                "litellm/muse-glimmer",
                "litellm/qwen3.8-flash-next",
              ]
            },
            identity: {
              name: "Saffron",
              avatar: "avatars/saffron_avatar.png",
            }
          },
          sage: {
            name: "Sage",
            workspace: "/home/node/.openclaw/workspace-sage",
            agentDir: "/home/node/.openclaw/agents/sage/agent",
            tools: { allow: ["message", "web_fetch", "web_search", "view_image", "chart_generate", "youtube_tldw", "reddit_thread", "facebook_listing", "sage_runtime_status", "sage_office_temperature", "sage_reference_remember", "memory_recall", "memory_list"] },
            thinkingDefault: "low",
            model: {
              primary: "litellm/muse-glimmer",
              fallbacks: [
                "litellm/qwen3.8-27b-chat",
                "litellm/qwen3.8-flash-next-chat",
              ],
            },
            identity: {
              name: "Sage",
              avatar: "avatars/sage_avatar.png",
            }
          },
        },
        ownership: "explicit",
      },
      tts: {
        provider: "openai",
        providers: {
          // Self-hosted Lemonade, OpenMOSS TTS on the Strix iGPU via Vulkan.
          // Uses the openai provider because Lemonade serves an OpenAI-compatible
          // /v1/audio/speech. extraBody carries the pinned voice reference, which
          // OpenMOSS needs on every request because it has no saved-voice concept;
          // it is also far faster than voice_design_description, which reinvents a
          // reference each call. responseFormat is wav because OpenMOSS v0.3 encodes
          // only wav or pcm, and ffmpeg in this pod converts to opus for Discord.
          // Reference is a 6s 24kHz mono clip of the target speaker, diarized and
          // cut from https://www.youtube.com/watch?v=bGB1W_q20xM (cluster-0 speaker,
          // 36-42s of the VAD-trimmed stream). Rendered A/B against three candidate
          // clips; this one won on pacing and similarity.
          openai: {
            baseUrl: "http://lemonade-tts.llm:13305/v1",
            apiKey: "not-required",
            model: "MOSS-TTS-Local",
            responseFormat: "wav",
            extraBody: {
              reference_wav_b64: "",
            },
          },
          elevenlabs: {
            apiKey: "$${ELEVENLABS_API_KEY}",
            voiceId: "cgSgspJ2msm6clMCkdW9",
            modelId: "eleven_multilingual_v2",
          },
          minimax: {
            baseUrl: "https://api.minimax.io",
            apiKey: "$${MINIMAX_TTS_API_KEY}",
            model: "speech-2.8-hd",
            voiceId: "English_radiant_girl",
          },
        },
      },
      // Talk (Vet 2026-09-23): realtime talk providers are cloud-only
      // (OpenAI/Google realtime APIs). Force the native stt-tts loop so
      // Android nodes use on-device STT + talk.speak TTS (Lemonade above)
      // with no cloud realtime dependency. Matches live gateway config.
      talk: {
        realtime: {
          mode: "stt-tts",
        },
      },
      tools: {
        media: {
          image: { timeoutSeconds: 180 },
          audio: { enabled: true },
          models: [
            { type: "cli", command: "whisper-stt", args: ["{{AttachmentPath}}"], capabilities: ["audio"], timeoutSeconds: 120 },
          ],
        },
        sessions: { visibility: "all" },
        agentToAgent: { enabled: true },
        exec: { mode: "full", strictInlineEval: false },
        elevated: { enabled: true, allowFrom: { discord: ["$${DISCORD_ADMIN_USER_ID}"] } },
        web: { search: { enabled: true, provider: "searxng", openaiCodex: { enabled: true, mode: "cached" } }, fetch: { enabled: true } },
      },
      commands: {
        native: "auto",
        nativeSkills: "auto",
        restart: false,
        ownerAllowFrom: ["discord:$${DISCORD_ADMIN_USER_ID}"],
        allowFrom: { discord: ["$${DISCORD_ADMIN_USER_ID}"] },
      },
      models: {
        providers: {
          "litellm": {
            baseUrl: "http://litellm.llm:4000/v1",
            apiKey: "$${LITELLM_API_KEY}",
            api: "openai-completions",
            timeoutSeconds: 1800,
            models: [
              { id: "kimi-k2.7", name: "Kimi K2.7 Code", reasoning: true, input: ["text", "image"], cost: { input: 0.95, output: 4, cacheRead: 0.19, cacheWrite: 0.95 }, contextWindow: 262144, maxTokens: 32768, compat: { supportsUsageInStreaming: true } },
              { id: "kimi-k3", name: "Kimi K3", reasoning: true, input: ["text", "image"], cost: { input: 3, output: 15, cacheRead: 0.3, cacheWrite: 3 }, contextWindow: 1048576, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "qwen3.8-flash-next", name: "Qwen3.8-Flash-Next IQ4_NL (Strix)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "qwen3.8-flash-next-chat", name: "Qwen3.8-Flash-Next non-thinking (Strix)", reasoning: false, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "local-pool", name: "Local pool (nvidia/strix, thinking)", reasoning: true, input: ["text"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 20480, compat: { supportsUsageInStreaming: true } },
              { id: "local-pool-chat", name: "Local pool (non-thinking)", reasoning: false, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 20480, compat: { supportsUsageInStreaming: true } },
              { id: "qwen3.8-27b", name: "Qwen3.8-27B AutoRound W4A16 (vLLM)", reasoning: true, input: ["text"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 147456, maxTokens: 24576, compat: { supportsUsageInStreaming: true } },
              { id: "qwen3.8-27b-chat", name: "Qwen3.8-27B non-thinking (vLLM)", reasoning: false, input: ["text"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 147456, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "muse-glimmer", name: "Muse-Glimmer-30B Q5_K_M (CUDA)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 20480, compat: { supportsUsageInStreaming: true } },
              { id: "dsv4.1f", name: "DeepSeek V4.1 Flash (hyper)", reasoning: true, input: ["text", "image"], cost: { input: 0.32664, output: 1.30656, cacheRead: 0.032664, cacheWrite: 0 }, contextWindow: 1000000, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "glm-5.3-flash", name: "Z.Ai GLM 5.3 Flash", reasoning: true, input: ["text", "image"], cost: { input: 0.15, output: 0.5, cacheRead: 0.03, cacheWrite: 0.15 }, contextWindow: 1000000, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "glm-5.3", name: "Z.Ai GLM 5.3", reasoning: true, input: ["text"], cost: { input: 1.4, output: 4.4, cacheRead: 0.28, cacheWrite: 1.4 }, contextWindow: 1000000, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "implementation-pool", name: "Implementation Pool (luna->glm-flash->nvidia)", reasoning: true, input: ["text"], cost: { input: 0.1, output: 0.5, cacheRead: 0.01, cacheWrite: 0.125 }, contextWindow: 147456, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "frontier-pool", name: "Frontier Pool (astra->K3->GLM)", reasoning: true, input: ["text", "image"], cost: { input: 10, output: 50, cacheRead: 1, cacheWrite: 12.5 }, contextWindow: 272000, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "reasoning-pool", name: "Reasoning Pool (sol->dsv4.1f->strix)", reasoning: true, input: ["text"], cost: { input: 2, output: 10, cacheRead: 0.2, cacheWrite: 2.5 }, contextWindow: 262144, maxTokens: 16384, compat: { supportsUsageInStreaming: true } },
              { id: "chatgpt/gpt-6-astra", name: "ChatGPT GPT-6 Astra", reasoning: true, input: ["text"], cost: { input: 10, output: 50, cacheRead: 1, cacheWrite: 12.5 }, contextWindow: 272000, maxTokens: 128000, compat: { supportsUsageInStreaming: true } },
              { id: "chatgpt/gpt-6.1-sol", name: "ChatGPT GPT-6.1 Sol", reasoning: true, input: ["text"], cost: { input: 2, output: 10, cacheRead: 0.1, cacheWrite: 2.5 }, contextWindow: 272000, maxTokens: 128000, compat: { supportsUsageInStreaming: true } },
              { id: "chatgpt/gpt-6-luna", name: "ChatGPT GPT-6 Luna", reasoning: true, input: ["text"], cost: { input: 0.1, output: 0.5, cacheRead: 0.01, cacheWrite: 0.125 }, contextWindow: 272000, maxTokens: 128000, compat: { supportsUsageInStreaming: true } },
            ]
          },
          "minimax": {
            baseUrl: "http://litellm.llm:4000",
            apiKey: "$${LITELLM_API_KEY}",
            api: "anthropic-messages",
            timeoutSeconds: 600,
            models: [
              { id: "MiniMax-M3", name: "MiniMax M3", reasoning: true, input: ["text","image"], cost: { input: 0.3, output: 1.2, cacheRead: 0.06, cacheWrite: 0.3 }, contextWindow: 1000000, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
              { id: "MiniMax-M3.1-Flash", name: "MiniMax M3.1 Flash", reasoning: true, input: ["text","image"], cost: { input: 0.15, output: 0.6, cacheRead: 0.015, cacheWrite: 0.15 }, contextWindow: 1000000, maxTokens: 131072, compat: { supportsUsageInStreaming: true } },
            ],
          },
        }
      },
      auth: {
        profiles: {
          "openai:$${OPENAI_CODEX_USERNAME}": { provider: "openai", mode: "oauth" },
        },
      },
      bindings: [
        { agentId: "main",    match: { channel: "discord", accountId: "default" } },
        { agentId: "saffron", match: { channel: "discord", accountId: "saffron" } },
        { agentId: "matcha",  match: { channel: "discord", accountId: "matcha" } },
        { agentId: "sage", match: { channel: "discord", accountId: "sage" } },
        { agentId: "main", match: { channel: "discord", accountId: "*" } },
      ],
      channels: {
        discord: {
          enabled: true,
          allowBots: false,
          defaultAccount: "default",
          actions: {
            messages: true,
            channels: true,
            search: true,
            reactions: false,
            stickers: false,
            polls: false,
            permissions: false,
            threads: false,
            pins: false,
            memberInfo: false,
            roleInfo: false,
            roles: false,
            channelInfo: false,
            voiceStatus: false,
            events: false,
            moderation: false,
            emojiUploads: false,
            stickerUploads: false,
          },
          voice: {
            enabled: true,
            mode: "stt-tts",
          },
          streaming: { block: { enabled: false } },
          groupPolicy: "allowlist",
          dmPolicy: "pairing",
          accounts: {
            default: {
              token: "$${DISCORD_BOT_TOKEN}",
              responsePrefix: "[{model}]",
              guilds: {
                "*": { users: ["$${DISCORD_ADMIN_USER_ID}"] },
              },
            },
            saffron: {
              token: "$${SAFFRON_BOT_TOKEN}",
              responsePrefix: "[{model}]",
              guilds: {
                "*": { users: ["$${DISCORD_ADMIN_USER_ID}"] },
              },
            },
            matcha: {
              token: "$${MATCHA_BOT_TOKEN}",
              guilds: {
                "*": {
                  channels: {
                    matcha: { enabled: true, requireMention: false },
                  },
                },
              },
            },
            sage: {
              token: "$${SAGE_BOT_TOKEN}",
              dmPolicy: "allowlist",
              allowFrom: ["$${DISCORD_ADMIN_USER_ID}"],
              guilds: {
                "western-subaru-club": {
                  requireMention: true,
                },
                "tako-tuesday": {
                  requireMention: true,
                },
                "ex-repsol": {
                  requireMention: true,
                },
                "*": { users: ["$${DISCORD_ADMIN_USER_ID}"] },
              },
            },
          },
        },
      },
      plugins: {
        allow: ["discord", "lossless-claw", "memini", "searxng", "comfy", "memory-wiki", "chart-renderer", "youtube-tldw", "reddit-thread", "facebook-listing", "sage-environment", "sage-reference-memory", "minimax", "litellm", "browser", "admin-http-rpc", "openai", "device-pair", "image-ui-autostart"],
        entries: {
          discord: { enabled: true },
          "image-ui-autostart": { enabled: true },
          "device-pair": { enabled: true, config: { publicUrl: "https://miso.jory.dev" } },
          "chart-renderer": { enabled: true },
          "youtube-tldw": { enabled: true },
          "reddit-thread": { enabled: true },
          "facebook-listing": { enabled: true },
          comfy: {
            enabled: true,
            config: {
              mode: "local",
              allowPrivateNetwork: true,
              baseUrl: "http://comfy-fast-wake.llm:8080",
              image: {
                workflowPath: "/home/node/.openclaw/workflows/openclaw-generate.json",
                promptNodeId: "2",
                outputNodeId: "7",
                timeoutMs: 900000,
              },
            },
          },
          "admin-http-rpc": { enabled: true },
          "lossless-claw": {
            enabled: true,
            hooks: {
              allowConversationAccess: true,
            },
            llm: { allowModelOverride: true, allowedModels: [ "litellm/local-pool-chat" ], },
            subagent: { allowModelOverride: true, allowedModels: [ "litellm/local-pool-chat" ], },
            config: {
              contextThreshold: 0.75,
              contextThresholdOverrides: [
                {
                  name: "qwen3.8-flash-next-family-safe",
                  match: { model: "litellm/qwen3.8-flash-next" },
                  contextThreshold: 0.50,
                },
                {
                  name: "qwen3.8-flash-next-chat-family-safe",
                  match: { model: "litellm/qwen3.8-flash-next-chat" },
                  contextThreshold: 0.50,
                },
                {
                  name: "qwen3.8-27b-family-safe",
                  match: { model: "litellm/qwen3.8-27b" },
                  contextThreshold: 0.50,
                },
                {
                  name: "qwen3.8-27b-chat-family-safe",
                  match: { model: "litellm/qwen3.8-27b-chat" },
                  contextThreshold: 0.50,
                },
                {
                  name: "local-pool-family-safe",
                  match: { model: "litellm/local-pool" },
                  contextThreshold: 0.50,
                },
                {
                  name: "local-pool-chat-family-safe",
                  match: { model: "litellm/local-pool-chat" },
                  contextThreshold: 0.50,
                },
              ],
              delegationTimeoutMs: 1000000,
              expansionModel: "litellm/local-pool-chat",
              freshTailCount: 64,
              freshTailMaxTokens: 24000,
              ignoreSessionPatterns: [
                "agent:*:cron:**",
                "agent:*:heartbeat:**",
                "heartbeat:**",
                "**:heartbeat:**"
              ],
              incrementalMaxDepth: 1,
              leafChunkTokens: 20000,
              newSessionRetainDepth: 2,
              proactiveThresholdCompactionMode: "inline",
              pruneHeartbeatOk: true,
              skipStatelessSessions: true,
              statelessSessionPatterns: [ "agent:*:subagent:**" ],
              summaryModel: "litellm/local-pool-chat",
              summaryTimeoutMs: 1000000,
              sweepDeadlineMs: 300000,
              compactUntilUnderDeadlineMs: 600000,
              largeFileThresholdTokens: 6000,
              stubLargeToolPayloads: false,
            },
          },
          searxng: {
            enabled: true,
            config: {
              webSearch: {
                baseUrl: "http://searxng.llm:8080",
                language: "en"
              }
            }
          },
          "memory-wiki": {
            enabled: true,
            config: {
              vaultMode: "bridge",
              vault: {
                path: "/home/node/.openclaw/wiki/main",
                renderMode: "native",
              },
              bridge: {
                enabled: true,
                readMemoryArtifacts: true,
                indexDreamReports: true,
                indexDailyNotes: true,
                indexMemoryRoot: true,
                followMemoryEvents: true,
              },
              search: {
                backend: "shared",
                corpus: "all",
              },
              render: {
                preserveHumanBlocks: true,
