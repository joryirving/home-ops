---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./configmap.yaml
  - ./externalsecret.yaml
  - ./externalsecret-oidc.yaml
  - ./helmrelease.yaml
  - ./litellmkey.yaml
  - ./ocirepository.yaml
#  openclaw models auth login --provider openai

configMapGenerator:
  - name: openclaw-plugins
    files:
      - install.cjs=./plugins/install.cjs
      - inventory.json=./plugins/inventory.json
generatorOptions:
  disableNameSuffixHash: true
