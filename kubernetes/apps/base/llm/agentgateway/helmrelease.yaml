---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      agentgateway:
        containers:
          app:
            image:
              repository: ghcr.io/agentgateway/agentgateway
              tag: v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
            args:
              - -f
              - /etc/agentgateway/config.yaml
            envFrom:
              - secretRef:
                  name: litellm
            probes:
              liveness:
                enabled: true
                spec:
                  tcpSocket:
                    port: 4000
              readiness:
                enabled: true
                spec:
                  tcpSocket:
                    port: 4000
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      config:
        type: configMap
        name: agentgateway-config
        advancedMounts:
          agentgateway:
            app:
              - path: /etc/agentgateway
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          agentgateway:
            app:
              - path: /tmp
    service:
      app:
        ports:
          http:
            port: 4000
    route:
      app:
        hostnames: ["agentgateway.jory.dev"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 4000
