---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-function-sync
data:
  sync.py: |
    """Reconcile the OpenClaw Gateway pipes before Open WebUI starts."""

    from __future__ import annotations

    import hashlib
    import urllib.request

    from open_webui.models.config import Config
    from open_webui.models.functions import FunctionForm, Functions


    PIPE_REF = "50d30bb37e25e9e37bbe167a38b74c2ef5baffbc"
    PIPE_URL = (
        "https://raw.githubusercontent.com/Eliav2/"
        f"openclaw-openwebui-integration/{PIPE_REF}/openclaw_pipe.py"
    )
    PIPE_SHA256 = "ae9d2c52a732d2ebce5b1e6ad9a80c5d8c542822891568fabb833ea346590f40"
    TOKEN_LINE = "token = valves.GATEWAY_TOKEN"
    TOKEN_FALLBACK = (
        'token = valves.GATEWAY_TOKEN or '
        'os.environ.get("OPENCLAW_GATEWAY_TOKEN", "")'
    )
    NAME_MARKER = "\n\nimport asyncio\n"
    OPENAI_BASE_URLS = [
        "http://llama-server.llm:8080/v1",
        "http://smurf-pc:1234/v1",
        "http://mac:1234/v1",
        "http://macbookpro:1234/v1",
        "http://llama-memory:8080/v1",
        "http://llama-vision:8080/v1",
        "https://api.minimax.io/v1",
        "https://litellm.jory.dev/v1",
        "http://10.69.10.120:8080/v1",
    ]
    OPENAI_ENABLED_URLS = {"https://litellm.jory.dev/v1"}
    OLLAMA_BASE_URLS = []
    MODEL_DISCOVERY_MARKER = (
        "    # 1. Try live gateway (fast path only if already connected)\n"
        "    global _gateway_connection\n"
        "    conn = _gateway_connection\n"
    )
    MODEL_DISCOVERY_PATCH = (
        "    # 1. Try live gateway, connecting when the picker asks.\n"
        "    global _gateway_connection\n"
        "    conn = _gateway_connection\n"
        "    if conn is None:\n"
        "        try:\n"
        "            conn = await _get_gateway_connection(lambda: valves)\n"
        "        except Exception as e:\n"
        "            pipe_log(f\"Gateway model discovery connection failed: {e}\")\n"
        "            conn = None\n"
    )
    FUNCTION_DESCRIPTION = (
        "Run an OpenClaw agent over its native Gateway WebSocket with "
        "streaming tool cards and persistent sessions."
    )
    FUNCTIONS = (
        ("openclaw_gateway", "OpenClaw - Miso", "main", "openclaw-bridge"),
        ("openclaw_matcha", "OpenClaw - Matcha", "matcha", "openclaw-bridge-matcha"),
        ("openclaw_saffron", "OpenClaw - Saffron", "saffron", "openclaw-bridge-saffron"),
    )


    def fetch_pipe() -> str:
        request = urllib.request.Request(
            PIPE_URL,
            headers={"User-Agent": "home-ops/open-webui-function-sync"},
        )
        with urllib.request.urlopen(request, timeout=30) as response:
            content = response.read()

        digest = hashlib.sha256(content).hexdigest()
        if digest != PIPE_SHA256:
            raise RuntimeError(
                f"OpenClaw pipe checksum mismatch: expected {PIPE_SHA256}, got {digest}"
            )

        source = content.decode("utf-8")
        if source.count(TOKEN_LINE) != 1:
            raise RuntimeError("OpenClaw pipe token lookup changed upstream")
        source = source.replace(TOKEN_LINE, TOKEN_FALLBACK, 1)
        if source.count(NAME_MARKER) != 1:
            raise RuntimeError("OpenClaw pipe import layout changed upstream")
        if source.count(MODEL_DISCOVERY_MARKER) != 1:
            raise RuntimeError("OpenClaw pipe model discovery layout changed upstream")
        source = source.replace(MODEL_DISCOVERY_MARKER, MODEL_DISCOVERY_PATCH, 1)
        return source


    def manifest(source: str) -> dict[str, str]:
        frontmatter = source.split('"""', 2)[1]
        values: dict[str, str] = {}
        for line in frontmatter.splitlines():
            if ":" not in line:
                continue
            key, value = line.split(":", 1)
            values[key.strip()] = value.strip()
        return values


    def named_source(source: str, display_name: str) -> str:
        return source.replace(
            NAME_MARKER,
            f"\n\nname = {display_name!r}\n" + NAME_MARKER,
            1,
        )


    async def sync() -> None:
        # Open WebUI persists these settings in PostgreSQL, so environment
        # variables alone do not reconcile provider endpoints. Keep the database
        # aligned with the deployment intent while disabling stale LAN probes.
        provider_config = await Config.get_many(
            "openai.api_configs",
            "ollama.api_configs",
        )
        openai_api_configs = provider_config.get("openai.api_configs") or {}
        for index, url in enumerate(OPENAI_BASE_URLS):
            config = dict(openai_api_configs.get(str(index), {}))
            config["enable"] = url in OPENAI_ENABLED_URLS
            openai_api_configs[str(index)] = config

        ollama_api_configs = provider_config.get("ollama.api_configs") or {}
        for index, config in ollama_api_configs.items():
            config = dict(config)
            config["enable"] = False
            ollama_api_configs[index] = config

        await Config.upsert(
            {
                "openai.enable": True,
                "openai.api_base_urls": OPENAI_BASE_URLS,
                "openai.api_configs": openai_api_configs,
                "ollama.enable": False,
                "ollama.base_urls": OLLAMA_BASE_URLS,
                "ollama.api_configs": ollama_api_configs,
            }
        )

        source = fetch_pipe()
        source_manifest = manifest(source)

        for function_id, function_name, agent_id, state_suffix in FUNCTIONS:
            content = named_source(source, f"{function_name} / ")
            form = FunctionForm(
                id=function_id,
                name=function_name,
                content=content,
                meta={
                    "description": FUNCTION_DESCRIPTION,
                    "manifest": source_manifest,
                },
            )
            existing = await Functions.get_function_by_id(function_id)
            if existing:
                result = await Functions.update_function_by_id(
                    function_id,
                    {
                        "name": function_name,
                        "type": "pipe",
                        "content": content,
                        "meta": form.meta.model_dump(mode="json"),
                        "is_active": True,
                        "is_global": True,
                    },
                )
            else:
                result = await Functions.insert_new_function("gitops", "pipe", form)

            if not result:
                raise RuntimeError(f"failed to reconcile function {function_id}")

            if not await Functions.update_function_by_id(
                function_id,
                {
                    "is_active": True,
                    "is_global": True,
                },
            ):
                raise RuntimeError(f"failed to activate function {function_id}")

            valves = {
                "GATEWAY_URL": "openclaw.llm.svc.cluster.local:18789",
                "GATEWAY_TOKEN": "",
                "STATE_DIR": f"/app/backend/data/{state_suffix}",
                "AGENT_ID": agent_id,
                "ENABLE_FILE_SERVER": False,
                "USE_OWUI_FILES": True,
                "SEND_STOP_ON_CANCEL": True,
                "AUTO_TITLE": False,
            }
            if not await Functions.update_function_valves_by_id(function_id, valves):
                raise RuntimeError(f"failed to reconcile valves for {function_id}")

            print(f"reconciled {function_id} ({agent_id})")


    if __name__ == "__main__":
        import asyncio

        asyncio.run(sync())
