---
# One-time cleanup after routing chat/RAG/search through env: rows in the config table
# override env vars, so drop the stale ones (dead llama-swap URLs, empty RAG engine
# selections, UI-seeded OpenAI list). Re-creating this job is safe; deleting 0 rows is fine.
apiVersion: batch/v1
kind: Job
metadata:
  name: open-webui-config-reset
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 1209600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-reset
          # same image the app's own CNPG cluster runs; only psql is used
          image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:a66f9e4c34950b78668fa4741bf55e6a58227cc31a6e60c128f2ce1d4c072928
          command:
            - sh
            - -c
            - |
              psql "$DB_URI" -v ON_ERROR_STOP=1 -c "
                delete from config where key = any(array[
                  'rag.embedding_engine',
                  'rag.embedding_model',
                  'rag.embedding_batch_size',
                  'rag.reranking_engine',
                  'rag.reranking_model',
                  'rag.external_reranker_url',
                  'rag.external_reranker_api_key',
                  'rag.ollama.base_url',
                  'ollama.enable',
                  'ollama.base_urls',
                  'ollama.api_configs',
                  'openai.enable',
                  'openai.api_base_urls',
                  'openai.api_configs',
                  'openai.api_keys'
                ]);
              "
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: open-webui-app
                  key: uri
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
