---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 15m
  dependsOn: []
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.13.5@sha256:e0dc5a8bf5c71cadf339d1e7b9408b357da75fb2854f82cad57a1609fadf2a22
            env:
              # Image Generation (ComfyUI)
              ENABLE_IMAGE_GENERATION: true
              IMAGE_GENERATION_ENGINE: comfyui
              IMAGE_GENERATION_MODEL: JANKUTrainedChenkinNoobai_v777.safetensors
              IMAGE_SIZE: 400x400
              IMAGE_STEPS: 8
              COMFYUI_BASE_URL: http://smurf-pc:8188
              # Chat through LiteLLM; the legacy Ollama shim (llama-swap) is gone
              # ENABLE_OPENAI_API stays unset: 0.13.5 defaults it True, and the
              # OpenAI-compatible connection is exactly what points at LiteLLM
              ENABLE_OLLAMA_API: "false"
              OPENAI_API_BASE_URL: http://litellm.llm:4000/v1
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # RAG embeddings + reranking through LiteLLM aliases
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: embed
              RAG_EMBEDDING_BATCH_SIZE: "8"
              RAG_RERANKING_ENGINE: external
              RAG_EXTERNAL_RERANKER_URL: http://litellm.llm:4000/v1/rerank
              # the external reranker posts its own Bearer token; without this it 401s and silently skips reranking
              RAG_EXTERNAL_RERANKER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              RAG_RERANKING_MODEL: rerank
              # Web search
              ENABLE_WEB_SEARCH: "true"
              WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
              # App
              WEBUI_URL: https://chat.jory.dev
              REDIS_URL: "redis://{{ .Release.Name }}-dragonfly:6379"
              WEBSOCKET_MANAGER: "redis"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-app"
                    key: uri
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
    route:
      app:
        hostnames: ["chat.jory.dev"]
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: 8080
