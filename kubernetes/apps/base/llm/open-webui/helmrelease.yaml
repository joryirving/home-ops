---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          function-sync:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
            command: [python, /opt/openclaw-function-sync.py]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-app"
                    key: uri
              PYTHONPATH: /app/backend
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
            env:
              # Image Generation
              ENABLE_OPENAI_API: false
              ENABLE_OLLAMA_API: true
              ENABLE_IMAGE_GENERATION: true
              IMAGE_GENERATION_ENGINE: comfyui
              IMAGE_GENERATION_MODEL: dreamshaper_8
              IMAGE_SIZE: 400x400
              IMAGE_STEPS: 8
              COMFYUI_BASE_URL: http://smurf-pc:8188
              # Open-webui settings
              ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: true
              ENABLE_PLUGINS: true
              OLLAMA_BASE_URL: http://llama-swap.llm:8080/v1
              ENABLE_RAG_WEB_SEARCH: true
              ENABLE_SEARCH_QUERY: true
              RAG_WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
              ENABLE_WEBSOCKET_SUPPORT: "true"
              WEBSOCKET_MANAGER: "redis"
              WEBSOCKET_REDIS_URL: "redis://{{ .Release.Name }}-dragonfly:6379"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-app"
                    key: uri
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 2Gi
    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
      function-sync:
        type: configMap
        name: open-webui-function-sync
        globalMounts:
          - path: /opt/openclaw-function-sync.py
            subPath: sync.py
            readOnly: true
    route:
      app:
        hostnames: ["chat.jory.dev"]
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: 8080
