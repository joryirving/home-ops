---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-nvidia-test
spec:
  source: hf://meta-models/Muse-Glimmer-30B-GGUF
  files:
    - muse-glimmer-30B-kquant-17gb.gguf
    - dflash-kquant.gguf
  format: gguf
  quantization: kquant
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: 99
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-nvidia-test
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-nvidia-test
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:dd0c408a4c3285f7809323ac17f85e70ef756bf67a3a30d4eed6805a8c1df16b
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 0
  priorityClassName: gpu-preemptible
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 131072
  flashAttention: true
  jinja: true
  parallelSlots: 1
  batchSize: 4096
  uBatchSize: 512
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  resources:
    gpu: 1
    cpu: "500m"
    memory: 16Gi
  extraArgs:
    - --alias
    - llama-nvidia-test
    - --cont-batching
    - --spec-type
    - draft-dflash
    - --spec-draft-model
    - /models/464557bd230a5831/dflash-kquant.gguf
    - --spec-draft-n-max
    - "3"
    - --spec-draft-p-min
    - "0.75"
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --cache-ram
    - "16384"
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
