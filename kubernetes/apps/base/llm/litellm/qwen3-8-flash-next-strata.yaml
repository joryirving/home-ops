---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-flash-next-strata
spec:
  source: hf://unsloth/Qwen3.8-Flash-Next-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00004.gguf
    - UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00002-of-00004.gguf
    - UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00003-of-00004.gguf
    - UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00004-of-00004.gguf
    - MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    - mmproj-BF16.gguf
  mmproj: mmproj-BF16.gguf
  format: gguf
  quantization: UD-IQ4_XS
  hardware:
    accelerator: cuda
    gpu:
      count: 1
      enabled: true
      vendor: nvidia
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-flash-next-strata
  annotations:
    inference.llmkube.dev/idle-metric: vllm:num_requests_running
    inference.llmkube.dev/idle-metric-path: /metrics?format=prometheus
spec:
  modelRef: qwen3-8-flash-next-strata
  runtime: generic
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  image: ghcr.io/niko1221/strata:0.2.22-cuda13@sha256:bd66d4d33ddb896274c72d2fc05a425670f544e1506afa5401621f6d5b6c70ca
  command:
  - /bin/sh
  - -c
  - |
    strata launch --model ud-iq4_xs --data-dir /data/Strata-data --context 300k \
      --vision gpu --tune skip --access lan --port 8080 --yes --no-tui --no-api-key \
      --parallel 2 --set conversation-cache-mib=8192 --set ple-io=direct \
      --set STRATA_ROUTE_TAIL_SKIP=unset --set STRATA_BATCH_MTP=1
    PY=/opt/strata/terminal/python/bin/python3
    while $PY -c 'import urllib.request, urllib.error
    try:
        urllib.request.urlopen("http://127.0.0.1:8080/v1/models", timeout=5)
    except urllib.error.HTTPError:
        pass
    ' 2>/dev/null; do
      sleep 15
    done
    echo "strata engine died; exiting so the pod restarts"
    exit 1
  skipModelInit: true
  replicas: 1
  priority: high
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  env:
  - name: STRATA_ALLOWED_HOSTS
    value: qwen3-8-flash-next-strata.llm.svc.cluster.local,qwen3-8-flash-next-strata.llm.svc,qwen3-8-flash-next-strata
  - name: STRATA_BATCH_MTP
    value: "1"
  tolerations:
  - key: llm-workload
    operator: Exists
    effect: NoSchedule
  resources:
    cpu: "8"
    memory: 104Gi
    gpu: 1
  extraVolumes:
  - name: models
    persistentVolumeClaim:
      claimName: llmkube-ganyu-cache
  extraVolumeMounts:
  - name: models
    mountPath: /data
  containerPort: 8080
  endpoint:
    port: 8080
    type: ClusterIP
