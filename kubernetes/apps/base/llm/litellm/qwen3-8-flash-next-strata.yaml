---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-flash-next-strata
spec:
  # Verified against HF (public, ungated) and against the pack names on disk.
  source: hf://ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
  sourceSecretRef:
    name: huggingface
  files:
  - IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
  - IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
  format: gguf
  quantization: IQ3_S
  hardware:
    accelerator: cuda
    gpu:
      count: 1
      enabled: true
      vendor: nvidia
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-flash-next-strata
  labels:
    krr/ignore: "true"
  annotations:
    # Idle-aware rollouts (same gate skirk uses): llmkube scrapes this gauge
    # per-replica and defers pod-template changes (image bumps) until the
    # engine reports zero running requests. Strata serves /metrics as JSON
    # unless ?format=prometheus is set, so the path must carry the query.
    # The probe sends no Accept header and reads baseURL+path verbatim.
    inference.llmkube.dev/idle-metric: vllm:num_requests_running
    inference.llmkube.dev/idle-metric-path: /metrics?format=prometheus
spec:
  modelRef: qwen3-8-flash-next-strata
  runtime: generic
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  # Ships engine 0.1.62-linux-x86_64-cuda-cuda13 (was 0.1.59). The saved run
  # config on the PVC still names the 0.1.59 vision reader; the Terminal
  # repoints version-folder paths at the current version when it reads the
  # config, so the stale path needs no cleanup here. Pack index stays v3, so
  # the prepared iq3_s pack carries over.
  image: ghcr.io/niko1221/strata:0.2.19-cuda13@sha256:5cf423c2ad9d2f626da250ade74cb9b48087279bff636fca3c7c08eb4f786d26
  command:
  - /bin/sh
  - -c
  - |
    # TEMPORARY TEST (2026-11-22): Inkling-2-Mini SQ-15, two serving slots at
    # 262,144 tokens. This pod is ganyu's Strata engine, so the QFN groups lose
    # their Strata rung for the duration and run on Gufo's two lanes only.
    #
    # Why SQ-15: 14.35 GB of weights leave the most VRAM for KV at 262k. SQ-20
    # is bit-exact but at this context leaves ~3 GB of VRAM and spills ~13 GB of
    # experts to RAM; SQ-10 fits fully but gives up quality.
    #
    # First start downloads strata-inkling 0.1.65 and Inkling-2-Mini-SQ-15
    # (14.35 GB) into /data, then the 0.64 GB vision shard on the first image.
    #
    # Qwen-only overrides are deliberately dropped: ple-io, STRATA_BATCH_MTP and
    # conversation-cache-mib are unverified for strata-inkling.
    #
    # --model takes the SIZE (sq-15), with --family naming the family; the
    # combined "inkling-2-mini-sq-15" key is rejected by catalog.resolve(),
    # which only knows installed size names. The launcher renders it the same
    # way: --model {size} --family {family}.
    #
    # No FAMILY/MODEL env vars on this pod: strata launch maps env overrides over
    # CLI flags and silently reverts to the wrong pack (observed).
    # --no-api-key: serve without auth, matching the keyless gufo rung. litellm
    # sends sk-llmkube-noauth, which a keyless engine ignores. Kubelet probes hit
    # /v1/models unauthenticated; a keyed engine 401s them and never becomes
    # Ready. Gotchas observed live:
    # - The key actually lives in /data/state/api-key on the PVC (NOT the launch
    #   preset json); strata 401s every request until that file is deleted once.
    #   --no-api-key does not remove it.
    # - Keyless mode enforces a DNS-rebinding Host check (keyed mode skips it),
    #   so the Service DNS names must be in STRATA_ALLOWED_HOSTS below; without
    #   it the engine 403s litellm's requests by Host header.
    # Memory (measured, 2026-11-22): 2 x 262k is not reachable on a 24 GB card.
    # q8 KV for both slots is 8.8 GB, trunk 2.07 GB, expert bodies 12.28 GB,
    # which is 23.2 GB before workspace; the engine responds by shrinking the
    # context (262144 -> 140032) AND spilling ~1000 experts to host RAM with
    # the fast host path off, which measured ~1.3 tok/s. At 128k the same KV is
    # 4.5 GB and every expert stays resident, so 2 slots stay at full speed.
    # Raise --context only together with a smaller pack (SQ-10) or one slot.
    strata launch --model sq-15 --family inkling-2-mini --data-dir /data/Strata-data \
      --context 131072 --vision gpu --tune skip --access lan --port 8080 \
      --yes --no-tui --no-api-key --parallel 2 \
      --set kv-dtype=q8 --set vram-reserve-mib=768
    # `strata launch --no-tui` starts the engine and returns; supervise it.
    # Any HTTP response means the engine is alive; connection errors mean it
    # died.
    PY=/opt/strata/terminal/python/bin/python3
    while $PY -c 'import urllib.request, urllib.error
    try:
        urllib.request.urlopen("http://127.0.0.1:8080/v1/models", timeout=5)
    except urllib.error.HTTPError:
        pass
    ' 2>/dev/null; do
      sleep 15
    done
    echo "strata engine died; exiting so the pod restarts"
    exit 1
  skipModelInit: true
  replicas: 1
  priority: high
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  # Keyless engines enforce a DNS-rebinding Host allowlist (see command
  # above); without the Service DNS names here litellm gets 403s.
  env:
  - name: STRATA_ALLOWED_HOSTS
    value: qwen3-8-flash-next-strata.llm.svc.cluster.local,qwen3-8-flash-next-strata.llm.svc,qwen3-8-flash-next-strata
  # Batch-MTP: the launch layer (drafting.py slots_draft_nothing / server.py)
  # reads ITS OWN environment to decide whether parallel slots draft — a
  # --set STRATA_BATCH_MTP=1 reaches only the engine process and the boot line
  # stays "none in parallel slots". Container-level env reaches both.
  - name: STRATA_BATCH_MTP
    value: "1"
  tolerations:
  - key: llm-workload
    operator: Exists
    effect: NoSchedule
  resources:
    cpu: "8"
    # IQ4_XS all-resident: 55.4 GiB expert arena + runtime, ~5.7 GiB int8 KV
    # per 307K session (kv-resident streams it). Two concurrent 307K sessions
    # project ~84 Gi of the 96Gi cap — measured single-session peak was 72.3
    # at 270K with ev_max 0 throughout the qualification.
    memory: 96Gi
    gpu: 1
  extraVolumes:
  - name: models
    persistentVolumeClaim:
      claimName: llmkube-ganyu-cache
  extraVolumeMounts:
  - name: models
    mountPath: /data
  containerPort: 8080
  endpoint:
    port: 8080
    type: ClusterIP
  # Keyless engine (see command above): default unauthenticated probes
  # pass. If the engine ever runs keyed again, restore probeOverrides
  # with an Authorization httpHeader — a keyed engine 401s headerless
  # probes and the pod never becomes Ready.
