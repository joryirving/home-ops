---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix-nemotron
spec:
  source: hf://ggml-org/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
  files:
    - NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix-nemotron
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-strix-nemotron
  modelCache:
    claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4@sha256:abc20cd87200d26360757346dcfd2baf84a6ef30151688db0e1c10b4979679e2
  rolloutPolicy:
    waitForIdle: false
  command:
    - llama-server
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  parallelSlots: 2
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  batchSize: 6144
  uBatchSize: 2048
  resources:
    cpu: "500m"
    memory: 28Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-strix-nemotron
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --cache-prompt
    - --kv-unified
    - --checkpoint-min-step
    - "32768"
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --load-mode
    - none
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
