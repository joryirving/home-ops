---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-flash-next
spec:
  source: pvc://llmkube-skirk-cache/staged/flash-next-hip/Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00001-of-00009.gguf
  format: gguf
  quantization: IQ4_NL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      runtime: rocm
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-flash-next
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3.8-flash-next
  runtime: llamacpp
  image: ghcr.io/joryirving/llama-qwen4exp:f5daaa3c-rocm@sha256:2d87d92ede4160c65e152c07b6ee8fd24f2d04c4d8bde6e0db4657541b346ee3
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 86400
  command:
    - /app/llama-server
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  extraVolumes:
    - name: staged
      persistentVolumeClaim:
        claimName: llmkube-skirk-cache
  extraVolumeMounts:
    - name: staged
      mountPath: /extra
      readOnly: true
  contextSize: 262144
  parallelSlots: 1
  flashAttention: true
  jinja: true
  cacheTypeK: f16
  cacheTypeV: f16
  batchSize: 16384
  uBatchSize: 16384
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: GGML_HIP_ENABLE_UNIFIED_MEMORY
      value: "1"
    - name: GGML_CUDA_DISABLE_GRAPHS
      value: "1"
    - name: LLAMA_MMB
      value: "1"
    - name: LLAMA_MMB_MIN_T
      value: "512"
    - name: LLAMA_MMB_BF16W
      value: "1"
    - name: LLAMA_MMB_GLU
      value: "1"
    - name: LLAMA_MMB_TALL
      value: "2"
    - name: LLAMA_MMB_CACHE
      value: "4"
    - name: LLAMA_MMB_F32SPLIT
      value: "2"
    - name: LLAMA_MMB_HC16
      value: "2"
    - name: LLAMA_MMB_SHADOW
      value: "2"
    - name: LLAMA_MMB_DOWN16
      value: "1"
  resources:
    cpu: "500m"
    memory: 16Gi
  extraArgs:
    - --alias
    - qwen3.8-flash-next
    - --mmproj
    - /extra/staged/flash-next-hip/mmproj-F16.gguf
    - --spec-draft-model
    - /extra/staged/flash-next-hip/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    - --spec-draft-ngl
    - "99"
    - --spec-draft-n-max
    - "2"
    - --load-mode
    - none
    - --lazy-mode
    - on-direct
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
    - --image-min-tokens
    - "1024"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
