---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-flash-next
spec:
  source: hf://ilintar/qwen3.8-flash-next-gguf-strix-halo
  sourceSecretRef:
    name: huggingface
  files:
    - Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00001-of-00009.gguf
    - Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00002-of-00009.gguf
    - Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00003-of-00009.gguf
    - Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00004-of-00009.gguf
    - Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00005-of-00009.gguf
    - Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00006-of-00009.gguf
    - Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00007-of-00009.gguf
    - Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00008-of-00009.gguf
    - Qwen3.8-Flash-Next-IQ4_NL-PROJFIX-00009-of-00009.gguf
    - mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    - mmproj-F16.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: IQ4_NL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      runtime: rocm
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-flash-next
  labels:
    krr/ignore: "true"
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3.8-flash-next
  modelCache:
    claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: ghcr.io/joryirving/llama-qwen4exp:f5daaa3c-rocm-faq@sha256:d0595332fa58dbf9060f3496ecbbe9abd93cef5f4cb216ad04df31a52cb753e9
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  command:
    - /app/llama-server
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 131072
  parallelSlots: 1
  flashAttention: true
  jinja: true
  speculativeDecoding:
    type: draft-mtp
    draftModel: mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    nDraftMax: 2
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  batchSize: 8192
  uBatchSize: 8192
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: GGML_HIP_ENABLE_UNIFIED_MEMORY
      value: "1"
    - name: GGML_CUDA_DISABLE_GRAPHS
      value: "1"
    - name: LLAMA_MMB
      value: "1"
    - name: LLAMA_MMB_MIN_T
      value: "512"
    - name: LLAMA_MMB_BF16W
      value: "1"
    - name: LLAMA_MMB_GLU
      value: "1"
    - name: LLAMA_MMB_TALL
      value: "2"
    - name: LLAMA_MMB_CACHE
      value: "4"
    - name: LLAMA_MMB_F32SPLIT
      value: "2"
    - name: LLAMA_MMB_HC16
      value: "2"
    - name: LLAMA_MMB_SHADOW
      value: "2"
    - name: LLAMA_MMB_DOWN16
      value: "1"
  resources:
    cpu: "500m"
    memory: 16Gi
  extraArgs:
    - --alias
    - qwen3.8-flash-next
    - --load-mode
    - none
    - --lazy-mode
    - on-direct
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
    - --image-min-tokens
    - "1024"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
