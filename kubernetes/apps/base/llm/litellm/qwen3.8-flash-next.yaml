---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-flash-next
spec:
  source: hf://bartowski/Qwen3.8-Flash-Next-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - Qwen3.8-Flash-Next-IQ4_NL/Qwen3.8-Flash-Next-IQ4_NL-00001-of-00003.gguf
    - Qwen3.8-Flash-Next-IQ4_NL/Qwen3.8-Flash-Next-IQ4_NL-00002-of-00003.gguf
    - Qwen3.8-Flash-Next-IQ4_NL/Qwen3.8-Flash-Next-IQ4_NL-00003-of-00003.gguf
    - mmproj-Qwen3.8-Flash-Next-f16.gguf
  mmproj: mmproj-Qwen3.8-Flash-Next-f16.gguf
  format: gguf
  quantization: IQ4_NL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      runtime: rocm
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-flash-next-mtp
spec:
  source: hf://unsloth/Qwen3.8-Flash-Next-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
  format: gguf
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-flash-next
  labels:
    krr/ignore: "true"
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3.8-flash-next
  modelCache:
    claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: ghcr.io/joryirving/llama-qwen4exp:40a9f4d0-rocm-custom@sha256:d62a196a71778ec6a26f768c7ff8b62f89d320ae02eb731eb3b0fe4cb67d753e
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 86400
  command:
    - /app/llama-server
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  parallelSlots: 1
  flashAttention: true
  jinja: true
  speculativeDecoding:
    type: draft-mtp
    draftModelRef: qwen3.8-flash-next-mtp
    nDraftMax: 2
  cacheTypeK: f16
  cacheTypeV: f16
  batchSize: 16384
  uBatchSize: 16384
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: GGML_HIP_ENABLE_UNIFIED_MEMORY
      value: "1"
  resources:
    cpu: "500m"
    memory: 30Gi
  extraArgs:
    - --alias
    - qwen3.8-flash-next
    - --load-mode
    - none
    - --lazy-mode
    - on-direct
    - -fit
    - "off"
    - --cache-ram
    - "12228"
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0.0"
    - --repeat-penalty
    - "1.0"
    - --chat-template-kwargs
    - '{"reasoning_effort":"low"}'
    - --image-min-tokens
    - "1024"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
