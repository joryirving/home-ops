---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embed
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed
  labels:
    krr/ignore: "true"
spec:
  modelRef: embed
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:5766735f77edf02ca179264e71e18ed1466e9332912e30f88f7a4ccd0dc6d5b6
  command:
    - /app/llama-server
  securityContext:
    privileged: true
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    embed-pool: "true"
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: layla
  # llama.cpp divides contextSize across parallelSlots, so the per-request
  # limit is contextSize / parallelSlots. 32 slots yielded 1024 tokens per
  # slot, and the mcp-gateway-internal VirtualMCPServer optimizer embeds the
  # whole aggregated tool catalog (~1.1k tokens and growing) in one request —
  # once it crossed 1024 every gateway session was terminated on tools/list.
  # 8 slots gives 4096 tokens per request without growing the KV cache.
  contextSize: 32768
  parallelSlots: 8
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: 500m
    memory: 4Gi
  mode: embedding
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --cache-ram
    - "512"
    - --threads
    - "4"
    - --threads-batch
    - "4"
    - --n-gpu-layers
    - "99"
    - --load-mode
    - mmap
  extraVolumes:
    - name: render
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
  extraVolumeMounts:
    - name: render
      mountPath: /dev/dri/renderD128
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
