---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embed-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hostpath
  resources:
    requests:
      storage: 5Gi
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/llmkube-dev/llmkube/main/config/crd/bases/inference.llmkube.dev_models.yaml
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embed
spec:
  source: hf://OpenVINO/Qwen3-Embedding-0.6B-int8-ov
  format: custom
  hardware:
    accelerator: cpu
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/llmkube-dev/llmkube/main/config/crd/bases/inference.llmkube.dev_inferenceservices.yaml
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed
  labels:
    krr/ignore: "true"
spec:
  modelRef: embed
  runtime: generic
  skipModelInit: true
  mode: embedding
  image: openvino/model_server:2026.4.1-gpu@sha256:a928903fe429f1e3e27107cc45932d30d95febfd2d1159dc50869c3eac76fc58
  args:
    - --source_model
    - OpenVINO/Qwen3-Embedding-0.6B-int8-ov
    - --model_name
    - embed
    - --task
    - embeddings
    - --target_device
    - GPU
    - --pooling
    - LAST
    - --max_length
    - "4096"
    - --truncate
    - "true"
    - --model_repository_path
    - /models
    - --cache_dir
    - /models/ov-cache
    - --rest_port
    - "8080"
  securityContext:
    privileged: true
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 300
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    embed-pool: "true"
  nodeSelector:
    kubernetes.io/hostname: layla
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  resources:
    cpu: 500m
    memory: 16Gi
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: embed-cache
    - name: dri
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
  extraVolumeMounts:
    - name: models
      mountPath: /models
    - name: dri
      mountPath: /dev/dri/renderD128
  containerPort: 8080
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /v2/health/live
        port: 8080
      periodSeconds: 10
      failureThreshold: 120
    liveness:
      httpGet:
        path: /v2/health/live
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 20
      failureThreshold: 6
    readiness:
      httpGet:
        path: /v2/health/ready
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 6
