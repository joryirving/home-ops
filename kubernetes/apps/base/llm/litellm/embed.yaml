---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embed
spec:
  source: hf://Qwen/Qwen3-Embedding-0.6B-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: intel
    gpu:
      enabled: true
      vendor: intel
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-intel-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed
spec:
  modelRef: embed
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:3d21475ecd4383a9649ea21737d07044399d0995490b5ce5c6d89326dc7c7771
  mode: embedding
  contextSize: 32768
  parallelSlots: 8
  batchSize: 4096
  uBatchSize: 2048
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
    - --threads
    - "4"
    - --threads-batch
    - "4"
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 300
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: intel
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  resources:
    cpu: "4"
    memory: 8Gi
  modelCache:
    claimName: llmkube-layla-cache
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 120
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
