---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embed
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed-1
  labels:
    krr/ignore: "true"
spec:
  modelRef: embed
  runtime: llamacpp
  # GPU replica on skirk (Strix Halo iGPU), Vulkan build. The DRA path is not
  # usable for a second consumer: llama-strix-gpu is allocationMode All and
  # exclusively held by the gufo claim, so a sibling claim would sit Pending
  # forever. Instead the pod borrows the render node directly — renderD128 is
  # mode 0666 on Talos, so a plain hostPath Device mount needs no claim, no
  # group/uid work, and gufo is untouched.
  # OOM history (2026-11): skirk previously co-hosted embed/rerank/STT/TTS on
  # the iGPU and OOMed; whisper and TTS were the culprits (large transient
  # buffers colliding with gufo's growing KV/ngram state in the shared GTT).
  # This pair is the ONLY co-tenant allowed on skirk. Do not add STT/TTS or
  # any transient-buffer workload here — the NPU (amdxdna, kernel >=6.14) is
  # the planned home for those.
  # Image: kyuz0/amd-strix-halo-toolboxes vulkan-radv — prebuilt llama.cpp
  # master with Strix Halo Vulkan mat-vec tuning; same digest the whisper
  # HelmReleases pin. The toolbox has no entrypoint (CMD bash), so the
  # llama-server path is set explicitly via spec.command.
  # Memory: the request is a cgroup reservation, not the model size — it must
  # cover mmap page cache, compute buffers, and GTT allocations charged to
  # the process (same reason gufo requests 108Gi). Skirk budget: gufo 108Gi
  # + these two must stay under allocatable (~125Gi), so 4Gi each.
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv@sha256:7231f437a47b26c87864312d6ca7bdf9827e6d692a3960b17eba96f4c8185ef6
  command:
    - /usr/bin/llama-server
  securityContext:
    privileged: true
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    embed-pool: "true"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                embed-pool: "true"
            topologyKey: kubernetes.io/hostname
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: skirk
  contextSize: 32768
  parallelSlots: 32
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: 500m
    memory: 4Gi
  mode: embedding
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --cache-ram
    - "0"
    - --n-gpu-layers
    - "99"
    - --load-mode
    - mmap
  extraVolumes:
    - name: amd-render
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
  extraVolumeMounts:
    - name: amd-render
      mountPath: /dev/dri/renderD128
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
