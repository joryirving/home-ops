---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embed
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed-1
  labels:
    krr/ignore: "true"
spec:
  modelRef: embed
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:460ff87b6dfd6b9e8ee0f4018540e007eb333a574994033b70dd6be46069de01
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "true"
    embed-pool: "true"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                embed-pool: "true"
            topologyKey: kubernetes.io/hostname
  contextSize: 32768
  parallelSlots: 32
  batchSize: 2048
  uBatchSize: 2048
  env:
    - name: GOMP_CPU_AFFINITY
      value: "0-11"
    - name: KMP_AFFINITY
      value: "granularity=fine,proc_list=[0-11],explicit"
  resources:
    cpu: "2"
    memory: 8Gi
  mode: embedding
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --cache-ram
    - "0"
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
---
