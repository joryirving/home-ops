---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embed
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed-1
  labels:
    krr/ignore: "true"
spec:
  modelRef: embed
  runtime: llamacpp
  # GPU replica on skirk (Strix Halo iGPU), Vulkan build. The DRA path is not
  # usable for a second consumer: llama-strix-gpu is allocationMode All and
  # exclusively held by the gufo claim, so a sibling claim would sit Pending
  # forever. Instead the pod borrows the render node directly — renderD128 is
  # mode 0666 on Talos, so a plain hostPath Device mount needs no claim, no
  # group/uid work, and gufo is untouched.
  # OOM history (2026-11): skirk previously co-hosted embed/rerank/STT/TTS on
  # the iGPU and OOMed; whisper and TTS were the culprits (large transient
  # buffers colliding with gufo's growing KV/ngram state in the shared GTT).
  # This pair is static (~1.5 GiB total) and is the ONLY co-tenant allowed on
  # skirk. Do not add STT/TTS or any transient-buffer workload here — the NPU
  # (amdxdna, kernel >=6.14) is the planned home for those.
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:73251ea4b7a9cabd9fb223109995e934ad9878acb8685d762a05667e48011750
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    embed-pool: "true"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                embed-pool: "true"
            topologyKey: kubernetes.io/hostname
  nodeSelector:
    kubernetes.io/hostname: skirk
  contextSize: 32768
  parallelSlots: 32
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: 500m
    memory: 8Gi
  mode: embedding
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --cache-ram
    - "0"
    - --n-gpu-layers
    - "99"
    - --load-mode
    - mmap
  extraVolumes:
    - name: amd-render
      hostPath:
        path: /dev/dri/renderD128
        type: Device
  extraVolumeMounts:
    - name: amd-render
      mountPath: /dev/dri/renderD128
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed-2
  labels:
    krr/ignore: "true"
spec:
  modelRef: embed
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:4d2de15a0ffbce704777c64026b40512a71e0bbc0b303a5fe5ea9bf71760dff9
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "true"
    embed-pool: "true"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                embed-pool: "true"
            topologyKey: kubernetes.io/hostname
  contextSize: 32768
  parallelSlots: 32
  batchSize: 2048
  uBatchSize: 2048
  env:
    - name: GOMP_CPU_AFFINITY
      value: "0-11"
    - name: KMP_AFFINITY
      value: "granularity=fine,proc_list=[0-11],explicit"
  resources:
    cpu: 250m
    memory: 8Gi
  mode: embedding
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --cache-ram
    - "0"
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
