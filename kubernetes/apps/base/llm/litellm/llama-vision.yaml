---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-vision
spec:
  source: hf://llmfan46/gemma-4-E4B-it-ultra-uncensored-heretic-GGUF
  files:
    - gemma-4-E4B-it-ultra-uncensored-heretic-Q4_K_M.gguf
    - gemma-4-E4B-it-mmproj-BF16.gguf
  mmproj: gemma-4-E4B-it-mmproj-BF16.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-vision
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-vision
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:7fa75431b8a78f9528cab4aaf65e8ae3e13da546a3cc7221247ca81bab864d84
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "true"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: llama-vision
  contextSize: 32768
  parallelSlots: 1
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: "4"
    memory: 16Gi
  extraArgs:
    - --alias
    - llama-vision
    - --chat-template-kwargs
    - '{"enable_thinking": false}'
    - --threads
    - "12"
    - --threads-batch
    - "16"
    - --image-max-tokens
    - "1120"
    - --mmap
  endpoint:
    port: 8080
    type: ClusterIP
