---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-vision
spec:
  source: hf://huihui-ai/Huihui-MiniCPM-V-4_5-abliterated
  files:
    - GGUF/ggml-model-Q8_0.gguf
    - GGUF/mmproj-model-f16.gguf
  mmproj: GGUF/mmproj-model-f16.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-vision
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-vision
  modelCache:
    claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4@sha256:324bf6fa8517efb5a67a647e9ed704940b9829dd785c9d086d0bceb71254209b
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  command:
    - llama-server
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 32768
  parallelSlots: 2
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  batchSize: 4096
  uBatchSize: 1024
  resources:
    cpu: "500m"
    memory: 20Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-vision
    - --cont-batching
    - --cache-ram
    - "0"
    # MiniCPM-V 4.5 uses its model-defined 448px slicing and 64-token
    # resampler; --image-min/max-tokens target other vision families.
    - --reasoning
    - "off"
    - --temp
    - "0.6"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --repeat-penalty
    - "1.05"
    - --threads
    - "8"
    - --threads-batch
    - "16"
    - --load-mode
    - none
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
