---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-27b
spec:
  source: "dbirks/Qwen3.8-27B-W4A16-AutoRound"
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: compressed-tensors
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-27b
  labels:
    krr/ignore: "true"
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3.8-27b
  runtime: generic
  image: ghcr.io/syv-ai/qwen38-27b-rtx3090@sha256:524805fa8db117bafb20c58003e715acd286fb9ada79728efa9653a928fe4531
  args:
    - single
  skipModelInit: true
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  priorityClassName: gpu-preemptible
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  env:
    - name: SPEC
      value: dflash2
    - name: CTX
      value: huge
    - name: MAX_SEQS
      value: "2"
    - name: PREFIX_CACHE
      value: "1"
    - name: EXTRA_ARGS
      value: --served-model-name qwen3.8-27b muse-glimmer
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: huggingface
          key: HF_TOKEN
  resources:
    gpu: 1
    cpu: "2"
    memory: 32Gi
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: llmkube-model-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  extraVolumeMounts:
    - name: models
      mountPath: /app/models
      subPath: vllm-27b
    - name: models
      mountPath: /cache
      subPath: vllm-27b-cache
    - name: shm
      mountPath: /dev/shm
  endpoint:
    port: 18020
    type: ClusterIP
  probeOverrides:
    startup:
      tcpSocket:
        port: 18020
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      tcpSocket:
        port: 18020
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 18020
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
