---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-27b
spec:
  source: "dbirks/Qwen3.8-27B-W4A16-AutoRound"
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: compressed-tensors
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-27b
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3.8-27b
  runtime: vllm
  image: ghcr.io/syv-ai/hyperqwen@sha256:ebd8d33a43a727423c2ec1c89d50a0237ff28ebacba33d7fd1efce2eac13b46b
  command:
    - bash
    - docker/entrypoint.sh
  args:
    - single
  skipModelInit: true
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  priorityClassName: gpu-preemptible
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  env:
    - name: MODEL
      value: /app/models/Qwen3.8-27B-W4A16-AutoRound
    - name: BASE_MODEL_DIR
      value: /app/models/Qwen3.8-27B-W4A16-AutoRound
    - name: HF_REPO
      value: dbirks/Qwen3.8-27B-W4A16-AutoRound
    - name: FAST_VARIANT
      value: "0"
    - name: SPEC
      value: mtp
    - name: CTX
      value: long
    - name: MAX_SEQS
      value: "8"
    - name: MAX_LEN
      value: "147456"
    # Trial rolled back 2026-10-20: TurboQuant KV (4-bit) worked capacity-wise
    # (253k pool, 0 preemptions) but forced SPEC=off after MTP output loops
    # (matches syv-ai/HyperQwen#323: TQ+MTP quality collapse), and solo decode
    # dropped to ~21.5 tok/s vs ~64 on fp8+MTP. Reverting to fp8+MTP baseline.
    - name: PREFIX_CACHE
      value: "1"
    - name: VERIFY
      value: "0"
    - name: HOST
      value: 0.0.0.0
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: huggingface
          key: HF_TOKEN
  resources:
    gpu: 1
    cpu: "2"
    memory: 28Gi
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: llmkube-ganyu-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 24Gi
  extraVolumeMounts:
    - name: models
      mountPath: /app/models
      subPath: vllm-27b
    - name: models
      mountPath: /cache
      subPath: vllm-27b-cache
    - name: shm
      mountPath: /dev/shm
  endpoint:
    port: 18020
    type: ClusterIP
  probeOverrides:
    startup:
      tcpSocket:
        port: 18020
      periodSeconds: 2
      failureThreshold: 1800
    liveness:
      tcpSocket:
        port: 18020
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 18020
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 6
