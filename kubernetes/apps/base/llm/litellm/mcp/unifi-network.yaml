---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com_litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: unifi-network
spec:
  alias: unifi_network
  params:
    allow_all_keys: false
    server_id: unifi_network
  proxyNamespace: llm
  proxyRef: litellm
  transport: http
  workload:
    env:
      - name: UNIFI_NETWORK_HOST
        value: unifi.internal
      - name: UNIFI_NETWORK_SITE
        value: default
      - name: UNIFI_NETWORK_VERIFY_SSL
        value: "false"
      - name: UNIFI_MCP_HTTP_ENABLED
        value: "true"
      - name: UNIFI_MCP_HTTP_TRANSPORT
        value: streamable-http
      - name: UNIFI_MCP_HOST
        value: 0.0.0.0
      - name: UNIFI_MCP_PORT
        value: "3000"
      - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
        value: "false"
      - name: UNIFI_TOOL_REGISTRATION_MODE
        value: meta_only
      - name: UNIFI_POLICY_CREATE
        value: "false"
      - name: UNIFI_POLICY_UPDATE
        value: "false"
      - name: UNIFI_POLICY_DELETE
        value: "false"
      - name: UNIFI_TOOL_PERMISSION_MODE
        value: confirm
      - name: UNIFI_NETWORK_USERNAME
        valueFrom:
          secretKeyRef:
            key: UNIFI_NETWORK_USERNAME
            name: litellm-mcp-unifi-network-username
      - name: UNIFI_NETWORK_PASSWORD
        valueFrom:
          secretKeyRef:
            key: UNIFI_NETWORK_PASSWORD
            name: litellm-mcp-unifi-network-password
    image: ghcr.io/sirkirby/unifi-network-mcp:0.36.2@sha256:ef7ac87ec60c826e3fd4ae28a8674d7b6100325bcad6422e54dd1a6096859585
    port: 3000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
