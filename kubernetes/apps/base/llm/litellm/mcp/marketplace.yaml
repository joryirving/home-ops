---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com_litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: marketplace
spec:
  alias: marketplace
  params:
    allow_all_keys: false
    server_id: marketplace
  proxyRef: litellm
  proxyNamespace: llm
  transport: http
  workload:
    env:
      - name: MARKETPLACE_BACKEND
        value: facebook
      - name: HOST
        value: 0.0.0.0
      - name: HOME
        value: /tmp
      - name: PORT
        value: "8080"
      - name: BROWSER_PROFILE_DIR
        value: /home/node/.marketplace/browser-profile
      - name: FACEBOOK_MARKETS_FILE
        value: /etc/marketplace/markets.json
      - name: REAUTH_ADMIN_PORT
        value: "8787"
      - name: FACEBOOK_USERNAME
        valueFrom:
          secretKeyRef:
            key: FACEBOOK_USERNAME
            name: marketplace-mcp-user
      - name: FACEBOOK_PASSWORD
        valueFrom:
          secretKeyRef:
            key: FACEBOOK_PASSWORD
            name: marketplace-mcp-password
    image: ghcr.io/misospace/marketplace:main@sha256:14ca3046e5a2b1a85ebd6f2ee6b89a1f6382aafc7e93fe444ddc5827d2cb9b9e
    port: 8080
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
    podSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
    volumeMounts:
      - mountPath: /home/node/.marketplace/browser-profile
        name: browser-profile
      - mountPath: /etc/marketplace
        name: markets
        readOnly: true
      - mountPath: /dev/shm
        name: shm
      - mountPath: /tmp
        name: tmp
    volumes:
      - name: browser-profile
        persistentVolumeClaim:
          claimName: marketplace-browser-profile
      - configMap:
          name: marketplace-markets
        name: markets
      - emptyDir:
          medium: Memory
          sizeLimit: 512Mi
        name: shm
      - emptyDir:
          medium: Memory
          sizeLimit: 64Mi
        name: tmp
