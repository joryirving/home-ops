---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: gemma-4-e4b
spec:
  source: hf://unsloth/gemma-4-E4B-it-qat-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
    - mmproj-BF16.gguf
  mmproj: mmproj-BF16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gemma-4-e4b
  labels:
    krr/ignore: "true"
spec:
  modelRef: gemma-4-e4b
  modelCache:
    claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4@sha256:1c655ca0443655f2e7603d054770b07cd8c79267145728b3261295f005053947
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 86400
  command:
    - llama-server
  replicas: 1
  priority: low
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 32768
  parallelSlots: 2
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  batchSize: 4096
  uBatchSize: 2048
  resources:
    cpu: "500m"
    memory: 8Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --cont-batching
    - --kv-unified
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --min-p
    - "0"
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --load-mode
    - none
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
