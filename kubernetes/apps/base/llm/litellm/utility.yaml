---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: utility
spec:
  source: hf://unsloth/Qwen3.5-4B-MTP-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - Qwen3.5-4B-UD-Q4_K_XL.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: utility-mtp
spec:
  source: https://huggingface.co/ggml-org/Qwen3.5-4B-GGUF/resolve/8d43d974efc48399cb58957ad49c8b26bf5a109c/mtp-Qwen3.5-4B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: utility
  labels:
    krr/ignore: "true"
spec:
  modelRef: utility
  runtime: llamacpp
  speculativeDecoding:
    type: draft-mtp
    draftModelRef: utility-mtp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:4e88890069ad09665bf3b8f430f49b308198b5326329693022fef8abc25d2930
  securityContext:
    privileged: true
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    utility-pool: "true"
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: layla
  # 32768 across 2 slots = 16384 per request.
  contextSize: 32768
  parallelSlots: 2
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: "4"
    memory: 12Gi
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
    - --n-gpu-layers
    - "99"
    - --cache-type-k
    - q8_0
    - --cache-type-v
    - q8_0
    - --threads
    - "4"
    - --threads-batch
    - "4"
  extraVolumes:
    - name: render
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
  extraVolumeMounts:
    - name: render
      mountPath: /dev/dri/renderD128
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
