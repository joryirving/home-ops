---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: utility
spec:
  source: hf://unsloth/Qwen3.5-4B-MTP-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - Qwen3.5-4B-UD-Q4_K_XL.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      vendor: intel
      runtime: vulkan
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-intel-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: utility-mtp
spec:
  source: https://huggingface.co/ggml-org/Qwen3.5-4B-GGUF/resolve/8d43d974efc48399cb58957ad49c8b26bf5a109c/mtp-Qwen3.5-4B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: utility
  labels:
    krr/ignore: "true"
spec:
  modelRef: utility
  runtime: llamacpp
  speculativeDecoding:
    type: draft-mtp
    draftModelRef: utility-mtp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:7e40bc3d631ec7f071aa2e320d8b12ea83a9405871df7a3984b3f71f196e59f3
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    utility-pool: "true"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                utility-pool: "true"
            topologyKey: kubernetes.io/hostname
  # 65536 across 2 slots = 32768 per request.
  contextSize: 65536
  parallelSlots: 2
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: "4"
    memory: 16Gi
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
    - --cache-type-k
    - q8_0
    - --cache-type-v
    - q8_0
    - --threads
    - "4"
    - --threads-batch
    - "4"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
