---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: utility
spec:
  source: hf://unsloth/Qwen3.5-4B-MTP-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - Qwen3.5-4B-UD-Q4_K_XL.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: intel
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: utility
spec:
  modelRef: utility
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:a4911a324843555ff09cd403f21ba314a78a1aa5f515a145774465161f168a7a
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
    - --n-gpu-layers
    - "99"
    - --cache-type-k
    - q8_0
    - --cache-type-v
    - q8_0
    - --threads
    - "4"
    - --threads-batch
    - "4"
  contextSize: 32768
  parallelSlots: 2
  batchSize: 2048
  uBatchSize: 2048
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: intel
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  securityContext:
    privileged: true
  resources:
    cpu: "4"
    memory: 10Gi
  modelCache:
    claimName: llmkube-layla-cache
  extraVolumes:
    - name: render
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
  extraVolumeMounts:
    - name: render
      mountPath: /dev/dri/renderD128
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
