---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: rerank
spec:
  modelRef: rerank
  runtime: generic
  skipModelInit: true
  mode: rerank
  image: openvino/model_server:2026.4.1-gpu@sha256:a928903fe429f1e3e27107cc45932d30d95febfd2d1159dc50869c3eac76fc58
  args:
    - --source_model
    - OpenVINO/bge-reranker-v2-m3-fp16-ov
    - --model_name
    - rerank
    - --task
    - rerank
    - --target_device
    - GPU
    - --model_repository_path
    - /models
    - --cache_dir
    - /models/ov-cache
    - --rest_port
    - "8080"
  securityContext:
    privileged: true
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 300
  replicas: 1
  priority: normal
  nodeSelector:
    topology.kubernetes.io/gpus: intel
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  resources:
    cpu: 500m
    memory: 8Gi
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: llmkube-layla-cache
    - name: dri
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
  extraVolumeMounts:
    - name: models
      mountPath: /models
    - name: dri
      mountPath: /dev/dri/renderD128
  containerPort: 8080
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /v2/health/live
        port: 8080
      periodSeconds: 10
      failureThreshold: 120
    liveness:
      httpGet:
        path: /v2/health/live
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 20
      failureThreshold: 6
    readiness:
      httpGet:
        path: /v2/health/ready
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 6
