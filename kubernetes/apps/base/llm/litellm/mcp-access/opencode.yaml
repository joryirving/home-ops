---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com_litellmteam_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: opencode-mcp
spec:
  alias: Opencode MCP
  models:
    - no-default-models
  mcpServers:
    - arr
    - dispatch
    - flux
    - github
    - grafana
    - ha
    - kubectl
    - marketplace
    - plan_shop_eat
    - seerr
    - talos
    - unifi_network
  proxyRef: litellm
  teamID: opencode-mcp
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com_litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: opencode-mcp
spec:
  keyAlias: Opencode MCP
  models:
    - no-default-models
  proxyRef: litellm
  secretKey: api-key
  secretName: litellm-mcp-key-opencode
  teamID: opencode-mcp
