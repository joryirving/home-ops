---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: file
  image: ghcr.io/berriai/litellm-database:1.110.2@sha256:3b239acc68e601c436e5feeec7ca0f01a41cd5dffe50975142b7fa7155c1b2ff
  replicas: 3
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
    - litellm.jory.dev
    parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  env:
  - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
    value: 'true'
  - name: CHATGPT_TOKEN_DIR
    value: /app/chatgpt_tokens
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        key: uri
        name: litellm-app
  - name: GENERIC_AUTHORIZATION_ENDPOINT
    value: https://sso.jory.dev/application/o/authorize/
  - name: GENERIC_SCOPE
    value: openid email profile litellm_role
  - name: GENERIC_TOKEN_ENDPOINT
    value: https://sso.jory.dev/application/o/token/
  - name: GENERIC_USERINFO_ENDPOINT
    value: https://sso.jory.dev/application/o/userinfo/
  - name: GENERIC_USER_ROLE_ATTRIBUTE
    value: litellm_role
  - name: LITELLM_LOG
    value: INFO
  - name: LITELLM_MODE
    value: PRODUCTION
  - name: PROXY_BASE_URL
    value: https://litellm.jory.dev
  - name: PROXY_LOGOUT_URL
    value: https://sso.jory.dev/application/o/litellm/end-session/
  - name: REDIS_HOST
    value: litellm-dragonfly
  - name: REDIS_PORT
    value: '6379'
  envFrom:
  - secretRef:
      name: litellm
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
  - name: cache
    emptyDir: {}
  - name: ui
    persistentVolumeClaim:
      claimName: litellm
  volumeMounts:
  - name: cache
    mountPath: /app/cache
  - name: ui
    mountPath: /app/chatgpt_tokens
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
    # Share the actual QFN deployments rather than duplicate Gufo/Strata entries.
    model_group_alias:
      grooming-pool: qwen3.8-flash-next
    # Callers carrying a recognized session header (x-session-id / x-litellm-session-id)
    # pin their QFN session to the first deployment via the shared Redis cache;
    # failover serves from the peer without moving the pin. The optional check list is
    # required: the pre-router's adopted affinity check otherwise never receives the
    # per-group config (LiteLLM 1.110.2 wiring).
    optional_pre_call_checks: [session_affinity]
    model_group_affinity_config:
      qwen3.8-flash-next: [session_affinity]
      qwen3.8-flash-next-chat: [session_affinity]
      grooming-pool: [session_affinity]
    cooldown_time: 30
    enable_pre_call_checks: true
    # Gufo rejects a cache fork from a live session when the fork boundary
    # misses an in-pass checkpoint position (400 "unsupported Flash-Next
    # in-pass boundary"). The condition is transient — a single same-group
    # retry lands after the live session's frontier moves. Scoped retries are
    # not configurable per exception today, so accept one extra attempt on
    # genuinely invalid requests.
    retry_policy:
      BadRequestErrorRetries: 1
    fallbacks:
    - grooming-pool:
      - grooming-luna
      - grooming-glm-flash
    - auto:
      - dsv4.1f
      - MiniMax-M3.1-Flash
  litellmSettings:
    success_callback:
    - prometheus
    failure_callback:
    - prometheus
    prometheus_adapter: true
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
      supported_call_types:
      - embedding
      - aembedding
    request_timeout: 900
    num_retries: 2
    retry_after: 5
    set_verbose: false
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
  extraConfig:
    environment:
    - KIMI_CODE_API_KEY
    - MINIMAX_API_KEY
    - NEURALWATT_API_KEY
    - ZAI_API_KEY
    - UNSLOTH_API_KEY
    - REDIS_HOST
    - REDIS_PORT
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
