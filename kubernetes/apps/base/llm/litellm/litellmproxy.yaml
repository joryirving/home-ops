---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: file
  # Draft blocker: publish the runtime image and pin its verified digest before merge.
  image: ghcr.io/joryirving/litellm-mcp:1.104.0-mcp1
  replicas: 3
  automountServiceAccountToken: false
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
    - litellm.jory.dev
    parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: x-litellm-session-id
          value: '%REQ(x-session-id)%'
  env:
  - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
    value: 'true'
  - name: CHATGPT_TOKEN_DIR
    value: /app/chatgpt_tokens
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        key: uri
        name: litellm-app
  - name: GENERIC_AUTHORIZATION_ENDPOINT
    value: https://sso.jory.dev/application/o/authorize/
  - name: GENERIC_SCOPE
    value: openid email profile litellm_role
  - name: GENERIC_TOKEN_ENDPOINT
    value: https://sso.jory.dev/application/o/token/
  - name: GENERIC_USERINFO_ENDPOINT
    value: https://sso.jory.dev/application/o/userinfo/
  - name: GENERIC_USER_ROLE_ATTRIBUTE
    value: litellm_role
  - name: LITELLM_ENABLE_MCP_STDIO
    value: 'true'
  - name: LITELLM_LOG
    value: INFO
  - name: LITELLM_MODE
    value: PRODUCTION
  - name: PROXY_BASE_URL
    value: https://litellm.jory.dev
  - name: PROXY_LOGOUT_URL
    value: https://sso.jory.dev/application/o/litellm/end-session/
  - name: REDIS_HOST
    value: litellm-dragonfly
  - name: REDIS_PORT
    value: '6379'
  envFrom:
  - secretRef:
      name: litellm
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
  - name: mcp-arr-credentials
    projected:
      defaultMode: 0440
      sources:
      - secret:
          name: litellm-mcp-sonarr
          items:
          - key: SONARR_API_KEY
            path: SONARR_API_KEY
      - secret:
          name: litellm-mcp-radarr
          items:
          - key: RADARR_API_KEY
            path: RADARR_API_KEY
      - secret:
          name: litellm-mcp-prowlarr
          items:
          - key: PROWLARR_API_KEY
            path: PROWLARR_API_KEY
  - name: mcp-seerr-credentials
    secret:
      defaultMode: 0440
      secretName: litellm-mcp-seerr
      items:
      - key: SEERR_API_KEY
        path: SEERR_API_KEY
  - name: mcp-github-credentials
    secret:
      defaultMode: 0440
      secretName: litellm-mcp-github
      items:
      - key: token
        path: token
  - name: mcp-dispatch-credentials
    secret:
      defaultMode: 0440
      secretName: litellm-mcp-dispatch
      items:
      - key: token
        path: token
  - name: cache
    emptyDir: {}
  - name: ui
    persistentVolumeClaim:
      claimName: litellm
  volumeMounts:
  - name: mcp-arr-credentials
    mountPath: /var/run/litellm-mcp/arr
    readOnly: true
  - name: mcp-seerr-credentials
    mountPath: /var/run/litellm-mcp/seerr
    readOnly: true
  - name: mcp-github-credentials
    mountPath: /var/run/litellm-mcp/github
    readOnly: true
  - name: mcp-dispatch-credentials
    mountPath: /var/run/litellm-mcp/dispatch
    readOnly: true
  - name: cache
    mountPath: /app/cache
  - name: ui
    mountPath: /app/chatgpt_tokens
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
    fallbacks:
    - qwen3.8-flash-next:
      - qwen3.8-27b
    - qwen3.8-flash-next-chat:
      - muse-glimmer
      - MiniMax-M2.7
    - qwen3.8-27b:
      - qwen3.8-flash-next
    - gemma-4-12b-it-qat:
      - MiniMax-M3-chat
    - auto:
      - dsv4.1f
      - MiniMax-M3-chat
    context_window_fallbacks:
    - qwen3.8-27b:
      - qwen3.8-flash-next
  litellmSettings:
    default_key_generate_params:
      object_permission:
        mcp_tool_search_enabled: true
    success_callback:
    - prometheus
    failure_callback:
    - prometheus
    prometheus_adapter: true
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
      supported_call_types:
      - embedding
      - aembedding
    request_timeout: 900
    num_retries: 2
    retry_after: 5
    set_verbose: false
  generalSettings:
    mcp_allow_all_keys_respects_mcp_scope: true
    health_check_endpoint: /v1/health
    store_model_in_db: false
  extraConfig:
    environment:
    - KIMI_CODE_API_KEY
    - MINIMAX_API_KEY
    - NEURALWATT_API_KEY
    - ZAI_API_KEY
    - UNSLOTH_API_KEY
    - REDIS_HOST
    - REDIS_PORT
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
