---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: file
  image: ghcr.io/berriai/litellm-database:1.110.2@sha256:3b239acc68e601c436e5feeec7ca0f01a41cd5dffe50975142b7fa7155c1b2ff
  replicas: 3
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
    - litellm.jory.dev
    parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  env:
  - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
    value: 'true'
  - name: CHATGPT_TOKEN_DIR
    value: /app/chatgpt_tokens
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        key: uri
        name: litellm-app
  - name: GENERIC_AUTHORIZATION_ENDPOINT
    value: https://sso.jory.dev/application/o/authorize/
  - name: GENERIC_SCOPE
    value: openid email profile litellm_role
  - name: GENERIC_TOKEN_ENDPOINT
    value: https://sso.jory.dev/application/o/token/
  - name: GENERIC_USERINFO_ENDPOINT
    value: https://sso.jory.dev/application/o/userinfo/
  - name: GENERIC_USER_ROLE_ATTRIBUTE
    value: litellm_role
  - name: LITELLM_LOG
    value: INFO
  - name: LITELLM_MODE
    value: PRODUCTION
  - name: PROXY_BASE_URL
    value: https://litellm.jory.dev
  - name: PROXY_LOGOUT_URL
    value: https://sso.jory.dev/application/o/litellm/end-session/
  - name: REDIS_HOST
    value: litellm-dragonfly
  - name: REDIS_PORT
    value: '6379'
  envFrom:
  - secretRef:
      name: litellm
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
  - name: cache
    emptyDir: {}
  - name: ui
    persistentVolumeClaim:
      claimName: litellm
  volumeMounts:
  - name: cache
    mountPath: /app/cache
  - name: ui
    mountPath: /app/chatgpt_tokens
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    # least-busy spreads by each deployment's real in-flight count. Its
    # selector breaks 0-vs-0 ties by deployment id -- the defect the old
    # comment was written for, and also the feature: solo/sequential
    # traffic always lands on the same rung and never bounces (implicit
    # affinity for free), while bursts spill to the peer by real load.
    # Measured peaks (qfn-engines dashboard, 2026-11-22): prefill strata
    # 2470 tok/s vs gufo ~1400; decode gufo ~60 tok/s vs strata ~73. So
    # strata is the cheap catch-up lane (one re-prefill on arrival, then
    # its conversation cache holds the session) and gufo is the
    # decode-premium lane the ties favour.
    # session_affinity is gone: Redis pins made busy engines queue --
    # observed 2 busy + 2 queued on gufo while strata sat at zero -- because
    # failover only serves from the peer on cooldown, never on saturation.
    # The interim simple-shuffle was the worst of the three: it re-rolls
    # placement per request, so multi-turn agent sessions coin-flip a full
    # re-prefill every turn (~50% bounce odds at two rungs).
    routing_strategy: least-busy
    # Share the actual QFN deployments rather than duplicate Gufo/Strata entries.
    model_group_alias:
      grooming-pool: qwen3.8-flash-next
    cooldown_time: 30
    enable_pre_call_checks: true
    # Gufo rejects a cache fork from a live session when the fork boundary
    # misses an in-pass checkpoint position (400 "unsupported Flash-Next
    # in-pass boundary"). The condition is transient — a single same-group
    # retry lands after the live session's frontier moves. Scoped retries are
    # not configurable per exception today, so accept one extra attempt on
    # genuinely invalid requests.
    retry_policy:
      BadRequestErrorRetries: 1
    fallbacks:
    - grooming-pool:
      - grooming-luna
      - grooming-glm-flash
  litellmSettings:
    success_callback:
    - prometheus
    failure_callback:
    - prometheus
    prometheus_adapter: true
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
      supported_call_types:
      - embedding
      - aembedding
    request_timeout: 900
    num_retries: 2
    retry_after: 5
    set_verbose: false
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
  extraConfig:
    environment:
    - KIMI_CODE_API_KEY
    - MINIMAX_API_KEY
    - NEURALWATT_API_KEY
    - ZAI_API_KEY
    - UNSLOTH_API_KEY
    - REDIS_HOST
    - REDIS_PORT
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
