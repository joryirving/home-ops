---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-nvidia
spec:
  source: hf://unsloth/Qwen3.8-27B-GGUF
  files:
    - Qwen3.8-27B-UD-Q4_K_XL.gguf
    - mmproj-F16.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: 99
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-nvidia
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-nvidia
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:644029017d189d1090e3407e3458ccb889b59323caa84131dff2740fa5c99199
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priorityClassName: gpu-preemptible
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  # contextSize: 140000
  contextSize: 131072
  flashAttention: true
  jinja: true
  # parallelSlots: 1
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 32768
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  resources:
    gpu: 1
    cpu: "500m"
    memory: 16Gi
  speculativeDecoding:
    type: draft-mtp
    nDraftMax: 2
    pMin: 0.75
  extraArgs:
    - --alias
    - llama-nvidia
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - -sps
    - "0.75"
    - --cache-prompt
    - --cache-ram
    - "40960"
    - --kv-unified
    - --temp
    - "1"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --mmap
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
    - --reasoning-preserve
    - --n-predict
    - "40960"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
