---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix
spec:
  source: hf://orcarouter/Qwen3.8-Flash-Next-Uncensored-GGUF
  files:
    - Qwen3.8-Flash-Next-Uncensored-IQ4_XS-00001-of-00003.gguf
    - Qwen3.8-Flash-Next-Uncensored-IQ4_XS-00002-of-00003.gguf
    - Qwen3.8-Flash-Next-Uncensored-IQ4_XS-00003-of-00003.gguf
    - Qwen3.8-Flash-Next-Uncensored-MTP-draft.gguf
    - mmproj-Qwen3.8-Flash-Next-Uncensored-F16.gguf
  mmproj: mmproj-Qwen3.8-Flash-Next-Uncensored-F16.gguf
  format: gguf
  quantization: IQ4_XS
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      vendor: amd
      runtime: vulkan
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-strix
  modelCache:
    claimName: llmkube-skirk-cache
  extraVolumes:
    - name: prompt-cache
      persistentVolumeClaim:
        claimName: llama-strix-prompt-cache
  extraVolumeMounts:
    - name: prompt-cache
      mountPath: /prompt-cache
  runtime: llamacpp
  image: ghcr.io/joryirving/llama-qwen4exp:0.5.5@sha256:ad2cad06d11dca5f220c859369e627349925683a7d885803c760b2e7cdcc985f
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  command:
    - /app/llama-server
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  parallelSlots: 1
  flashAttention: true
  jinja: true
  speculativeDecoding:
    type: draft-mtp
    draftModel: Qwen3.8-Flash-Next-Uncensored-MTP-draft.gguf
    nDraftMax: 7
    pMin: 0.75
  cacheTypeK: q4_0
  cacheTypeV: q4_0
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  batchSize: 4096
  uBatchSize: 2048
  resources:
    cpu: "500m"
    memory: 16Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-strix
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --cache-prompt
    - --cache-dir
    - /prompt-cache
    - --cache-disk
    - "49152"
    - --kv-unified
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "8"
    - --threads-batch
    - "16"
    - --load-mode
    - mmap
    - --tensor-read-lazy
    - on
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
    - --reasoning-preserve
    - --no-host
    - --no-repack
    - --spec-draft-adaptive
    - --spec-draft-n-min
    - "0"
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
