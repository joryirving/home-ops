---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelPool
metadata:
  name: nvidia
spec:
  nodeSelector:
    topology.kubernetes.io: egpu
  gpu: 1
  swapPolicy: reclaim
  swapBudget: 900s
  default: muse-glimmer
  reclaimAfter: 5m
  members:
    - inferenceServiceRef:
        name: qwen3.8-27b
    - inferenceServiceRef:
        name: muse-glimmer
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: nvidia
spec:
  defaultRouteStrategy: BackendNameMatch
  defaultRoute: qwen38-27b
  backends:
    - name: qwen38-27b
      displayName: qwen3.8-27b
      inferenceServiceRef:
        name: qwen3.8-27b
      capabilities: ["tools"]
    - name: muse-glimmer
      inferenceServiceRef:
        name: muse-glimmer
      capabilities: ["tools", "vision"]
  rules:
    # One-way fallthrough. Muse requests can hit Qwen3.8-27B, but not the reverse.
    - name: muse-fallthrough
      match:
        models: ["muse-glimmer"]
      route:
        backends: ["muse-glimmer", "qwen38-27b"]
        poolActivation: IfIdle
  proxy:
    replicas: 1
    responseHeaderTimeout: 600s
