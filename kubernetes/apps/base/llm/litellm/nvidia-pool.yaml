---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelPool
metadata:
  name: nvidia
spec:
  nodeSelector:
    topology.kubernetes.io: egpu
  gpu: 1
  swapPolicy: reclaim
  swapBudget: 600s
  default: muse-glimmer
  reclaimAfter: 5m
  members:
    - inferenceServiceRef:
        name: qwen3.8-27b
    - inferenceServiceRef:
        name: muse-glimmer
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: nvidia
spec:
  defaultRouteStrategy: BackendNameMatch
  defaultRoute: qwen38-27b
  backends:
    - name: qwen38-27b
      displayName: qwen3.8-27b
      inferenceServiceRef:
        name: qwen3.8-27b
      capabilities: ["tools"]
    - name: muse-glimmer
      inferenceServiceRef:
        name: muse-glimmer
      capabilities: ["tools", "vision"]
  rules:
    # Both members prefer themselves but neither forces a swap+hold while the
    # other is busy: IfIdle skips the busy incumbent and falls through to
    # whichever model is warm (#1787). An idle incumbent still swaps.
    - name: sage-prefer-muse-ifidle
      match:
        models: ["muse-glimmer"]
      route:
        backends: ["muse-glimmer", "qwen38-27b"]
        poolActivation: IfIdle
    - name: foreman-prefer-27b-ifidle
      match:
        models: ["qwen3.8-27b"]
      route:
        backends: ["qwen38-27b", "muse-glimmer"]
        poolActivation: IfIdle
  proxy:
    replicas: 1
    responseHeaderTimeout: 600s
