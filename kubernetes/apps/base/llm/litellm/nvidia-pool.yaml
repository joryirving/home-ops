---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelPool
metadata:
  name: nvidia
spec:
  nodeSelector:
    topology.kubernetes.io: egpu
  gpu: 1
  swapPolicy: reclaim
  swapBudget: 600s
  default: muse-glimmer
  # 27B (non-default) reclaims back to muse after 15m idle: when foreman goes quiet the slot
  # re-warms muse so Sage stays hot. Must exceed foreman's ~2min inter-burst gap to avoid thrash.
  reclaimAfter: 15m
  members:
    - inferenceServiceRef:
        name: qwen3.8-27b
    - inferenceServiceRef:
        name: muse-glimmer
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: nvidia
spec:
  defaultRouteStrategy: BackendNameMatch
  defaultRoute: qwen38-27b
  backends:
    - name: qwen38-27b
      displayName: qwen3.8-27b
      inferenceServiceRef:
        name: qwen3.8-27b
      capabilities: ["tools"]
    - name: muse-glimmer
      inferenceServiceRef:
        name: muse-glimmer
      capabilities: ["tools", "vision"]
  rules:
    # Sage prefers muse-glimmer but should not force a swap+hold when the 27B
    # incumbent is busy: IfIdle skips the busy incumbent and falls through to
    # 27B instead (#1787). Foreman's pinned qwen3.8-27b traffic stays on the
    # default route (Wait), so a caller that needs 27B still holds through a swap.
    - name: sage-prefer-muse-ifidle
      match:
        models: ["muse-glimmer"]
      route:
        backends: ["muse-glimmer", "qwen38-27b"]
        poolActivation: IfIdle
  proxy:
    replicas: 1
    responseHeaderTimeout: 600s
