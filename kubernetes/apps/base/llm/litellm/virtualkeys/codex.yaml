---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: codex
spec:
  proxyRef: litellm
  keyAlias: Codex
  secretName: litellm-key-codex
  secretKey: api-key
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: codex
spec:
  secretStoreRefs:
  - name: onepassword
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-codex
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: LITELLM_CODEX_API_KEY
