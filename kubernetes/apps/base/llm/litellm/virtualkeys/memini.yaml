---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: memini
spec:
  proxyRef: litellm
  keyAlias: Memini
  secretName: litellm-key-memini
  secretKey: api-key
  models:
  - local-pool-chat
  - muse-glimmer
  - qwen3.8-27b-chat
  - qwen3.8-flash-next-chat
  - qwen3.8-flash-next
  - gemma-4-12b-it-qat-chat
  - embed
  - rerank
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: memini
spec:
  secretStoreRefs:
  - name: onepassword
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-memini
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: LITELLM_MEMINI_API_KEY
