---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: decision
spec:
  source: https://huggingface.co/ggml-org/Kev-4B-GGUF/resolve/f4624b6bb7072f1bab726a622c1cad3f96030b9e/Kev-4B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      vendor: intel
      runtime: vulkan
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-intel-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: decision
  labels:
    krr/ignore: "true"
spec:
  modelRef: decision
  runtime: llamacpp
  # Vulkan image and Intel DRA claim use the MS-01 Iris Xe GPUs.
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:8af21639d085883fe5147a25a2ee29ce38302d950faa7e42355556d9f9a5af6c
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    decision-pool: "true"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                decision-pool: "true"
            topologyKey: kubernetes.io/hostname
  # No llm-workload toleration on purpose: that taint marks skirk, whose
  # budget is reserved for gufo + the embed/rerank pair. decision-1 stays
  # on the untainted CPU nodes.
  # The decision window is 8192 total tokens (state + question + rubric);
  # 16384 across 2 slots gives exactly 8192 per request — the advertised
  # maxInputTokens. Decision serving needs no chat/prompt flags: /v1/systemone
  # scores the declared options in a single pass and never decodes text.
  contextSize: 16384
  parallelSlots: 2
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: "4"
    memory: 8Gi
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
    # Keep CPU threads bounded while the GPU handles model layers.
    - --threads
    - "4"
    - --threads-batch
    - "4"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
