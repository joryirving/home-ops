---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: decision
spec:
  source: https://huggingface.co/ggml-org/vllm-d3-mini-GGUF/resolve/8b29fd3b87373ea85fa59cc2f26251c1591d771a/vllm-d3-mini-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      vendor: intel
      runtime: vulkan
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-intel-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: decision
  labels:
    krr/ignore: "true"
spec:
  modelRef: decision
  runtime: llamacpp
  # Vulkan image and Intel DRA claim use the MS-01 Iris Xe GPUs.
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:d397a7c758857d5f3c8e6d31b3e2a33d4d5b8226388a0cb9ffa79a70056a1731
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    decision-pool: "true"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                decision-pool: "true"
            topologyKey: kubernetes.io/hostname
  # No llm-workload toleration on purpose: that taint marks skirk, whose
  # budget is reserved for gufo + the embed/rerank pair. decision-1 stays
  # on the untainted CPU nodes.
  # d3 attention is noncausal: llama.cpp asserts ubatch >= request tokens,
  # so batch/ubatch must cover the full 16384 context.
  contextSize: 16384
  parallelSlots: 2
  batchSize: 16384
  uBatchSize: 16384
  resources:
    cpu: "4"
    memory: 12Gi
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
    # Keep CPU threads bounded while the GPU handles model layers.
    - --threads
    - "4"
    - --threads-batch
    - "4"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
