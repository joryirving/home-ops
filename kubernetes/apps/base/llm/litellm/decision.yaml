---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: decision
spec:
  source: hf://ggml-org/vllm-d3-mini-GGUF
  sourceSecretRef:
    name: huggingface
  files:
    - vllm-d3-mini-Q4_K_M.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: intel
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: decision
spec:
  modelRef: decision
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:a4911a324843555ff09cd403f21ba314a78a1aa5f515a145774465161f168a7a
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
    - --n-gpu-layers
    - "99"
    # Keep CPU threads bounded while the GPU handles model layers.
    - --threads
    - "4"
    - --threads-batch
    - "4"
  contextSize: 16384
  parallelSlots: 2
  batchSize: 16384
  uBatchSize: 8192
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  nodeSelector:
    topology.kubernetes.io/gpus: intel
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  resources:
    cpu: "4"
    memory: 8Gi
  modelCache:
    claimName: llmkube-layla-cache
  extraVolumes:
    - name: render
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
  extraVolumeMounts:
    - name: render
      mountPath: /dev/dri/renderD128
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
