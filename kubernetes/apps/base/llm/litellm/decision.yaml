---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: decision
spec:
  source: https://huggingface.co/ggml-org/Kev-4B-GGUF/resolve/main/Kev-4B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: decision-1
  labels:
    krr/ignore: "true"
spec:
  modelRef: decision
  runtime: llamacpp
  # Image override: the operator's llamacpp runtime predates llama.cpp's
  # /v1/systemone decision endpoint (PR #29818, 2026-10-02). The ggml-org
  # server image tracks master; digest-pinned from that tag.
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:89fe93c2ef53ea2d09ca9f53db8878a8f57bb6b143eb63c76a9c218fb583b392
  # Decision serving needs no chat/prompt flags: /v1/systemone scores the
  # declared options in a single forward pass and never decodes text.
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "true"
    decision-pool: "true"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                decision-pool: "true"
            topologyKey: kubernetes.io/hostname
  # No llm-workload toleration on purpose: that taint marks skirk, whose
  # budget is reserved for gufo + the embed/rerank pair. decision-1 stays
  # on the untainted CPU nodes.
  # Kev-4B's native decision window is 8192 total tokens (state + rubric);
  # 16384/4 gives 4096 per request headroom without growing the KV cache.
  contextSize: 16384
  parallelSlots: 4
  batchSize: 8192
  uBatchSize: 8192
  resources:
    cpu: "4"
    memory: 6Gi
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
