---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: decision
spec:
  source: https://huggingface.co/ggml-org/vllm-d3-mini-GGUF/resolve/8b29fd3b87373ea85fa59cc2f26251c1591d771a/vllm-d3-mini-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: decision
  labels:
    krr/ignore: "true"
spec:
  modelRef: decision
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:4e88890069ad09665bf3b8f430f49b308198b5326329693022fef8abc25d2930
  securityContext:
    privileged: true
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    cpu-inference: "false"
    decision-pool: "true"
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: layla
  # d3 attention is noncausal: llama.cpp asserts ubatch >= request tokens,
  # so batch/ubatch must cover the full 16384 context.
  contextSize: 16384
  parallelSlots: 2
  batchSize: 16384
  uBatchSize: 16384
  resources:
    cpu: "4"
    memory: 12Gi
  extraArgs:
    - --cont-batching
    - --flash-attn
    - "on"
    - --load-mode
    - mmap
    - --n-gpu-layers
    - "99"
    # Keep CPU threads bounded while the GPU handles model layers.
    - --threads
    - "4"
    - --threads-batch
    - "4"
  extraVolumes:
    - name: render
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
  extraVolumeMounts:
    - name: render
      mountPath: /dev/dri/renderD128
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
