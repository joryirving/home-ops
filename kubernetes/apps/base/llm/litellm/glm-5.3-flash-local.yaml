---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: glm-5.3-flash-local
spec:
  source: hf://antirez/glm-5.3-flash-gguf
  sourceSecretRef:
    name: huggingface
  files:
    - GLM-5.3-Flash-Q2.gguf
  format: gguf
  quantization: Q2_K
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      runtime: rocm
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: glm-5.3-flash-local
  labels:
    krr/ignore: "true"
  annotations:
    inference.llmkube.dev/idle-endpoint: /v1/models
spec:
  modelRef: glm-5.3-flash-local
  runtime: generic
  image: docker.io/kyuz0/strix-halo-ds4-toolbox:rocm-10.0
  command:
    - ds4-server
  args:
    - --host
    - 0.0.0.0
    - -m
    - /models/glm/GLM-5.3-Flash-Q2.gguf
    - --ctx
    - "262144"
    - --kv-disk-dir
    - /cache
    - --kv-disk-space-mb
    - "100000"
    - --mtp
    - --warm-weights
  skipModelInit: true
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: GGML_HIP_ENABLE_UNIFIED_MEMORY
      value: "1"
  resources:
    cpu: "1"
    memory: 40Gi
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: llmkube-skirk-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  extraVolumeMounts:
    - name: models
      mountPath: /models
      readOnly: true
    - name: models
      mountPath: /cache
      subPath: ds4-kv-cache
    - name: shm
      mountPath: /dev/shm
  containerPort: 8000
  endpoint:
    port: 8000
    type: ClusterIP
  probeOverrides:
    startup:
      tcpSocket:
        port: 8000
      periodSeconds: 10
      failureThreshold: 720
    liveness:
      tcpSocket:
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /v1/models
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
