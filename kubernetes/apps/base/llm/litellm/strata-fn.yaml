---
# Strata Flash-Next (IQ3_S) on ganyu / RTX 3090.
# Cutover with this PR: muse-glimmer and qwen3.8-27b retire; see strata-fn-draft.md.
# Packs already live on llmkube-ganyu-cache at /data/Strata-data (downloaded 2026-11-08
# during the benchmark); skipModelInit keeps the llmkube downloader out of the picture.
# The MTP draft (~5 GB, /data/Strata-data/mtp/rt) is fetched by strata launch itself,
# not by this Model CR.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: strata-fn
spec:
  # Verified against HF (public, ungated) and against the pack names on disk.
  source: hf://ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
  sourceSecretRef:
    name: huggingface
  files:
  - IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
  - IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
  format: gguf
  quantization: IQ3_S
  hardware:
    accelerator: cuda
    gpu:
      count: 1
      enabled: true
      vendor: nvidia
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: strata-fn
  labels:
    krr/ignore: "true"
spec:
  modelRef: strata-fn
  runtime: generic
  # 0.2.7-cuda13 @ sha256:db96cd9… is the amd64 manifest the benchmark ran.
  image: ghcr.io/niko1221/strata:0.2.13-cuda13@sha256:b6e1876515d5663047a7cd8dfee5223c8b2d117710eb2a9c285a433fb6e4a703
  command:
  - /bin/sh
  - -c
  - |
    # Launch IQ3_S at 256K (admission verified to 232K prompt tokens).
    # No FAMILY/MODEL env vars on this pod: strata launch maps env overrides
    # over CLI flags and silently reverts to the wrong pack (observed).
    # --no-api-key: serve without auth, matching the keyless gufo rungs (skirk)
    # in this group. litellm sends sk-llmkube-noauth, which a keyless engine
    # ignores. Kubelet probes hit /v1/models unauthenticated; a keyed engine
    # 401s them and never becomes Ready. Gotchas observed live:
    # - The key actually lives in /data/state/api-key on the PVC (NOT the
    #   launch preset json); strata 401s every request until that file is
    #   deleted once. --no-api-key does not remove it.
    # - Keyless mode enforces a DNS-rebinding Host check (keyed mode skips
    #   it), so the Service DNS names must be in STRATA_ALLOWED_HOSTS below;
    #   without it the engine 403s litellm's requests by Host header.
    strata launch --model iq3_s --data-dir /data/Strata-data --context 256k \
      --vision gpu --tune skip --access lan --port 8080 --yes --no-tui --no-api-key
    # `strata launch --no-tui` starts the engine and returns; supervise it.
    # Any HTTP response means the engine is alive; connection errors mean it
    # died.
    PY=/opt/strata/terminal/python/bin/python3
    while $PY -c 'import urllib.request, urllib.error
    try:
        urllib.request.urlopen("http://127.0.0.1:8080/v1/models", timeout=5)
    except urllib.error.HTTPError:
        pass
    ' 2>/dev/null; do
      sleep 15
    done
    echo "strata engine died; exiting so the pod restarts"
    exit 1
  # The engine warned about low free VRAM (<512 MiB) and suggested
  # --vram-reserve-mib 768 in the generated engine args; strata launch does not
  # expose that flag. If decode throughput degrades, patch the generated run
  # config in this wrapper before the engine starts.
  skipModelInit: true
  replicas: 1
  priority: high
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  # Keyless engines enforce a DNS-rebinding Host allowlist (see command
  # above); without the Service DNS names here litellm gets 403s.
  env:
  - name: STRATA_ALLOWED_HOSTS
    value: strata-fn.llm.svc.cluster.local,strata-fn.llm.svc,strata-fn
  tolerations:
  - key: llm-workload
    operator: Exists
    effect: NoSchedule
  resources:
    cpu: "8"
    memory: 64Gi
    gpu: 1
  extraVolumes:
  - name: models
    persistentVolumeClaim:
      claimName: llmkube-ganyu-cache
  extraVolumeMounts:
  - name: models
    mountPath: /data
  containerPort: 8080
  endpoint:
    port: 8080
    type: ClusterIP
  # Keyless engine (see command above): default unauthenticated probes
  # pass. If the engine ever runs keyed again, restore probeOverrides
  # with an Authorization httpHeader — a keyed engine 401s headerless
  # probes and the pod never becomes Ready.
