---
# Strata Flash-Next (IQ3_S) on ganyu / RTX 3090.
# Cutover with this PR: muse-glimmer and qwen3.8-27b retire; see strata-fn-draft.md.
# Packs already live on llmkube-ganyu-cache at /data/Strata-data (downloaded 2026-11-08
# during the benchmark); skipModelInit keeps the llmkube downloader out of the picture.
# The MTP draft (~5 GB, /data/Strata-data/mtp/rt) is fetched by strata launch itself,
# not by this Model CR.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: strata-fn
spec:
  # Verified against HF (public, ungated) and against the pack names on disk.
  source: hf://ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
  sourceSecretRef:
    name: huggingface
  files:
  - IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
  - IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
  format: gguf
  quantization: IQ3_S
  hardware:
    accelerator: cuda
    gpu:
      count: 1
      enabled: true
      vendor: nvidia
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: strata-fn
  labels:
    krr/ignore: "true"
spec:
  modelRef: strata-fn
  runtime: generic
  # 0.2.7-cuda13 @ sha256:db96cd9… is the amd64 manifest the benchmark ran.
  image: ghcr.io/niko1221/strata:0.2.7-cuda13@sha256:db96cd9b111c930f7deb77444f38f66e53db43af57644a33a9e8a2f05f038360
  command:
  - /bin/sh
  - -c
  - |
    # Launch IQ3_S at 256K (admission verified to 232K prompt tokens).
    # No FAMILY/MODEL env vars on this pod: strata launch maps env overrides
    # over CLI flags and silently reverts to the wrong pack (observed).
    # --api-key-env pins the engine key to the pod env; without it strata keeps
    # whatever key a previous launch saved in /data/state — observed live: it
    # kept the benchmark-era key, which 401s both the litellm rung and probe.
    strata launch --model iq3_s --data-dir /data/Strata-data --context 256k \
      --vision gpu --tune skip --access lan --port 8080 --yes --no-tui --api-key-env API_KEY
    # `strata launch --no-tui` starts the engine and returns; supervise it.
    # Any HTTP response (200 or 401) means the engine is alive; connection
    # errors mean it died.
    PY=/opt/strata/terminal/python/bin/python3
    while $PY -c 'import urllib.request, urllib.error
    try:
        urllib.request.urlopen("http://127.0.0.1:8080/v1/models", timeout=5)
    except urllib.error.HTTPError:
        pass
    ' 2>/dev/null; do
      sleep 15
    done
    echo "strata engine died; exiting so the pod restarts"
    exit 1
  # The engine warned about low free VRAM (<512 MiB) and suggested
  # --vram-reserve-mib 768 in the generated engine args; strata launch does not
  # expose that flag. If decode throughput degrades, patch the generated run
  # config in this wrapper before the engine starts.
  skipModelInit: true
  replicas: 1
  priority: high
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  tolerations:
  - key: llm-workload
    operator: Exists
    effect: NoSchedule
  env:
  - name: API_KEY
    value: sk-llmkube-noauth
  resources:
    cpu: "8"
    memory: 64Gi
    gpu: 1
  extraVolumes:
  - name: models
    persistentVolumeClaim:
      claimName: llmkube-ganyu-cache
  extraVolumeMounts:
  - name: models
    mountPath: /data
  containerPort: 8080
  endpoint:
    port: 8080
    type: ClusterIP
  # Strata serves /v1/models behind the API key; k8s httpGet carries headers.
  probeOverrides:
    startup:
      httpGet:
        path: /v1/models
        port: 8080
        httpHeaders:
        - name: Authorization
          value: Bearer sk-llmkube-noauth
      periodSeconds: 10
      failureThreshold: 120 # cold start: hash (~84 GB) + load = 4-8 min
    liveness:
      httpGet:
        path: /v1/models
        port: 8080
        httpHeaders:
        - name: Authorization
          value: Bearer sk-llmkube-noauth
      periodSeconds: 60
      failureThreshold: 3
    readiness:
      httpGet:
        path: /v1/models
        port: 8080
        httpHeaders:
        - name: Authorization
          value: Bearer sk-llmkube-noauth
      periodSeconds: 15
      failureThreshold: 3
