---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: litellm-patch-least-busy
    files:
      - patches/sitecustomize.py
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ./dashboard
  - ./models
  - ./virtualkeys
  - ./decision.yaml
  - ./utility.yaml
  - ./embed.yaml
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./guardrail.yaml
  - ./litellmproxy.yaml
  - ./llmkube-ganyu-cache.yaml
  - ./maya-ganyu-data.yaml
  - ./llmkube-skirk-cache.yaml
  - ./prometheusrule.yaml
  - ./project-maya.yaml
  - ./qwen3-8-flash-next-gufo.yaml
  - ./servicemonitor.yaml
  - ./qwen3-8-flash-next-strata.yaml
