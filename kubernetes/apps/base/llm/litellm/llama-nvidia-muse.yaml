---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-nvidia
spec:
  source: hf://meta-models/Muse-Glimmer-30B-GGUF
  files:
    - muse-glimmer-30B-kquant-17gb.gguf
    - dflash-kquant.gguf
  mmproj: mmproj-kquant.gguf
  format: gguf
  quantization: kquant
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: 99
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-nvidia
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-nvidia
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:fd92bf277a79e121da59ef2913581d3842806d3560dfe56090b3211a59c8d7ce
  rolloutPolicy:
    waitForIdle: false
  replicas: 1
  priorityClassName: gpu-preemptible
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 131072
  flashAttention: true
  jinja: true
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 1024
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  cacheTypeK: f16
  cacheTypeV: f16
  resources:
    gpu: 1
    cpu: "500m"
    memory: 16Gi
  extraArgs:
    - --alias
    - llama-nvidia
    - --cont-batching
    - --spec-type
    - draft-dflash
    - --spec-draft-model
    - /models/5112e8376dfd8c46/dflash-kquant.gguf
    - --spec-draft-n-max
    - "15"
    - --spec-draft-p-min
    - "0.75"
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --cache-ram
    - "40960"
    - --kv-unified
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --reasoning-preserve
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
