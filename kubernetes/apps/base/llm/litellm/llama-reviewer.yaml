---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-reviewer
spec:
  source: hf://unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
  files:
    - NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_XL.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-reviewer
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-reviewer
  modelCache:
    claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4@sha256:1c655ca0443655f2e7603d054770b07cd8c79267145728b3261295f005053947
  rolloutPolicy:
    waitForIdle: false
  command:
    - llama-server
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 200000
  parallelSlots: 2
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  speculativeDecoding:
    type: draft-mtp
    nDraftMax: 3
    pMin: 0.75
  batchSize: 6144
  uBatchSize: 2048
  resources:
    cpu: "500m"
    memory: 16Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-reviewer
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --cache-prompt
    - --cache-ram
    - "4096"
    - --kv-unified
    - --checkpoint-min-step
    - "32768"
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --load-mode
    - none
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
