---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix-fp8
spec:
  source: hf://julianmb/Qwen-3.8-27B-ROCmFP4-FAST-GGUF
  files:
    - Qwen3.8-27B-ROCmFP8.gguf
  format: gguf
  quantization: ROCmFP8
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix-fp8
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-strix-fp8
  modelCache:
    claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: ghcr.io/joryirving/q38rocm-engine:rocm7.14-v1.0.0
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 86400
  command:
    - llama-server
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  parallelSlots: 1
  flashAttention: true
  jinja: true
  reasoningBudget: 32768
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  batchSize: 2048
  uBatchSize: 1024
  resources:
    cpu: "500m"
    memory: 32Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-strix-fp8
    - -ctk
    - q8_0
    - -ctv
    - turbo4
    - -dev
    - Vulkan0
    - -ctxcp
    - "0"
    - -cram
    - "16384"
    - --poll
    - "100"
    - --cont-batching
    - --spec-type
    - draft-mtp
    - --spec-draft-n-max
    - "6"
    - --spec-draft-p-min
    - "0.60"
    - --temp
    - "1"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
