---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix-muse
spec:
  source: hf://meta-models/Muse-Glimmer-30B-GGUF
  files:
    - muse-glimmer-30B-kquant-17gb.gguf
  mmproj: mmproj-kquant.gguf
  format: gguf
  quantization: kquant
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix-muse
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-strix-muse
  modelCache:
    claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4@sha256:6c5b95e6d080b41beca21256b62fbbf8457a0f0f18299a968a16e582225e51ac
  rolloutPolicy:
    waitForIdle: false
  command:
    - llama-server
  replicas: 0
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 131072
  parallelSlots: 2
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  batchSize: 6144
  uBatchSize: 2048
  resources:
    cpu: "500m"
    memory: 28Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-strix-muse
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --cache-prompt
    - --kv-unified
    - --checkpoint-min-step
    - "32768"
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --load-mode
    - none
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
