---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix-dsv4f
spec:
  source: hf://unsloth/DeepSeek-V4-Flash-0731-GGUF
  files:
    - UD-IQ2_M/DeepSeek-V4-Flash-0731-UD-IQ2_M-00001-of-00003.gguf
    - UD-IQ2_M/DeepSeek-V4-Flash-0731-UD-IQ2_M-00002-of-00003.gguf
    - UD-IQ2_M/DeepSeek-V4-Flash-0731-UD-IQ2_M-00003-of-00003.gguf
    - dspark/dspark-DeepSeek-V4-Flash-0731-BF16.gguf
    - dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf
  format: gguf
  quantization: UD-IQ2_M
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      vendor: amd
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix-dsv4f
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-strix-dsv4f
  modelCache:
    claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: ghcr.io/nathanw1014/strix-halo-llamacpp:vulkan@sha256:8aab6efecfab16366ca15067304ebec7c0d604db84f91ff6534ff291ce53fd53
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 86400
  command:
    - llama-server
  replicas: 1
  priority: high
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 150000
  parallelSlots: 1
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  batchSize: 4096
  uBatchSize: 4096
  resources:
    cpu: "500m"
    memory: 32Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-strix-dsv4f
    - --cont-batching
    - --cache-prompt
    - --kv-unified
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --load-mode
    - none
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 15
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
