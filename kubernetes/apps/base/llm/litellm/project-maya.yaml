---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: project-maya-glm-5-3-flash-s24
spec:
  # Where the weights come from. Maya's setup downloads them itself (the repo
  # below, into the PVC), and the operator fetches nothing: the runtime
  # resolves this source at startup, so the Model is Ready right away.
  #
  # It must not be a pvc:// source to that same PVC. The operator holds an
  # InferenceService back until its Model is Ready, and a pvc:// Model is only
  # Ready once the claim is Bound. local-hostpath binds on first consumer, so
  # the claim waits for the pod that the Model holds back: the two wait for
  # each other and the service never starts.
  source: hf://peasantsmith/GLM-5.3-Flash-Maya-GGUF
  format: gguf
  quantization: IQ2_XXS
  hardware:
    accelerator: cuda
    gpu:
      count: 1
      enabled: true
      vendor: nvidia
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: project-maya-glm-5-3-flash-s24
  labels:
    krr/ignore: "true"
    litellm.home-operations.com/managed-by: flux
spec:
  modelRef: project-maya-glm-5-3-flash-s24
  runtime: generic
  # The engine and the vision encoder, with upstream's stamps so maya.py --setup compiles nothing,
  # and the toolchain upstream's step-1 checks look for.
  image: ghcr.io/joryirving/maya:1.1.74@sha256:fbd76c3c4afa580a034c4e92d314f55149a99c745142c31dd26513aa562d90b4
  imagePullPolicy: IfNotPresent
  command:
    - /bin/sh
    - -ec
    - |
      # Maya pins the model's RAM tier, and the driver's pinned allocations
      # count against the memlock limit. Kubernetes cannot set a container's
      # rlimits, and this node hands containers an 8 MiB limit, so the limit is
      # raised here (that needs CAP_SYS_RESOURCE) and the privileges are
      # dropped again before Maya runs. The limit is inherited, so the engine
      # keeps it.
      ulimit -l unlimited
      cd /opt/maya

      # The settings, in one place. A start from the config honours --parallel
      # and writes it back into the config (maya.py's server_command), but
      # drafting and the VRAM reserve live only in the config, so the fast path
      # below has to check those two instead of passing them.
      PARALLEL=2
      DRAFT=off
      RESERVE=

      CONF=/opt/maya/maya-maya-s24.json
      PACK=/data/Maya-S24/pack
      MAYA="/opt/maya/.venv/bin/python /opt/maya/maya.py"

      # The engine drafts nothing with more than one conversation at a time, so
      # a drafter without a single slot would start fine and decode slowly.
      if [ "$DRAFT" = on ] && [ "$PARALLEL" != 1 ]; then
        echo "DRAFT=on needs PARALLEL=1" >&2
        exit 1
      fi

      # Drafting is a setup choice: --draft dflash2 has the setup fetch the
      # pinned drafter and write the engine's --dflash into the config. The
      # reserve is the VRAM the expert pool leaves free beside it.
      SETUP_FLAGS=
      if [ "$DRAFT" = on ]; then
        SETUP_FLAGS="--draft dflash2"
      fi
      if [ -n "$RESERVE" ]; then
        SETUP_FLAGS="$SETUP_FLAGS --vram-reserve-mib $RESERVE"
      fi

      # Upstream's setup is idempotent: with the model, the pack and the config
      # in place it starts the server and downloads nothing. Reuse a config only
      # where it agrees with the settings above, since a container restart keeps
      # the file and would otherwise run the previous settings in silence. A pod
      # replacement starts from setup anyway: the config lives in the image's own
      # directory, not on the data claim.
      agrees() {
        /opt/maya/.venv/bin/python -c "import json,sys; a=json.load(open(sys.argv[1])).get('args') or []; at=lambda f: a[a.index(f)+1] if f in a and a.index(f)+1 < len(a) else None; sys.exit(0 if at('--parallel') == sys.argv[2] and (('--dflash' in a) == (sys.argv[3] == 'on')) and (not sys.argv[4] or at('--vram-reserve-mib') == sys.argv[4]) else 1)" "$CONF" "$PARALLEL" "$DRAFT" "$RESERVE"
      }
      if [ -s "$CONF" ] && [ -d "$PACK" ] && agrees; then
        exec setpriv --reuid 65534 --regid 65534 --keep-groups $MAYA --config "$CONF" --host 0.0.0.0 --port 8080 --parallel "$PARALLEL" --yes --plain
      fi
      exec setpriv --reuid 65534 --regid 65534 --keep-groups $MAYA --setup --model Maya-S24 --download-model --models-dir /data \
        --context 1000000 --parallel "$PARALLEL" $SETUP_FLAGS --host 0.0.0.0 --port 8080 --yes --plain
  skipModelInit: true
  # Strata owns the 3090. Keep Maya's model cache for redeploy.
  replicas: 0
  priority: high
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  # The first start downloads ~95 GB and builds the pack before the server
  # binds its port, so the startup budget is hours, not minutes.
  startupTimeout: 6h
  podSecurityContext:
    # The container starts as root: it raises the memlock limit (which needs
    # CAP_SYS_RESOURCE) and drops to the image's user before Maya runs. The
    # fsGroup gives the pod's user write access to the data claim.
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - SETGID
        - SETUID
        - SYS_RESOURCE
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    cpu: "8"
    memory: 96Gi
    gpu: 1
  env:
    # The RAM tier: how much of the model the engine keeps resident. The whole
    # Maya-S24 quant is 88.2 GiB, so this holds all of it in RAM and leaves
    # the disk tier empty.
    - name: MAYA_EXPERT_RAM_GB
      value: "88"
  extraVolumes:
    - name: maya-data
      persistentVolumeClaim:
        claimName: project-maya-ganyu-data
  extraVolumeMounts:
    - name: maya-data
      mountPath: /data
  containerPort: 8080
  endpoint:
    port: 8080
    type: ClusterIP
