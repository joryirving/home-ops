---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: glm-5.3-flash-zai
spec:
  modelName: glm-5.3-flash
  proxyRef: litellm
  params:
    model: openai/glm-5.3-flash
    apiBase: https://api.z.ai/api/coding/paas/v4
    apiKey: os.environ/ZAI_API_KEY
    additional:
      order: 1
      allowed_openai_params:
      - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 1.5e-07
      cache_creation_input_token_cost: 1.5e-07
      cache_read_input_token_cost: 3.0e-08
      output_cost_per_token: 5.0e-07
---
# Fallback behind z.ai: DeepSeek V4.1 Flash on Neuralwatt, reached only when
# the Z.AI rung fails.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: glm-5.3-flash-neuralwatt
spec:
  modelName: glm-5.3-flash
  proxyRef: litellm
  params:
    model: openai/deepseek-v4.1-flash
    apiBase: https://api.neuralwatt.com/v1
    apiKey: os.environ/NEURALWATT_API_KEY
    additional:
      order: 2
      allowed_openai_params:
      - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 1.5e-07
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 1.5e-08
      output_cost_per_token: 6.0e-07
