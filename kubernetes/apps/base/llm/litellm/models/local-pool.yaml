---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-pool-gemma
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: openai/gemma-4-12b-it-qat
    apiBase: http://gemma-wake.llm:8080/v1
    apiKey: sk-noauth
    additional:
      timeout: 300
      num_retries: 3
      temperature: 1.0
      top_p: 0.95
      top_k: 64
      order: 3
      max_parallel_requests: 4
      drop_params: true
      additional_drop_params:
        - response_format
  info:
    mode: chat
    maxInputTokens: 262144
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 2.23e-08
      output_cost_per_token: 4.83e-07
      cache_read_input_token_cost: 0.0
