---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-pool-muse
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: openai/muse-glimmer
    apiBase: http://nvidia-router-proxy.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 40960
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
apiVersion: litellm.home-operations.com/v1alpha1
