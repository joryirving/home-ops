---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: summary
spec:
  modelName: summary
  proxyRef: litellm
  params:
    model: openai/qwen3.5-4b
    apiBase: http://memini-summary.llm:8080/v1
    apiKey: qwen3.5-4b
    additional:
      additional_drop_params:
      - reasoning_effort
      max_parallel_requests: 3
  info:
    mode: chat
    maxInputTokens: 32768
    maxOutputTokens: 8192
    supportsFunctionCalling: false
    supportsVision: false
    extra:
      input_cost_per_token: 1.0e-08
      output_cost_per_token: 4.0e-08
