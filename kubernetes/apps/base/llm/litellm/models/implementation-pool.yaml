---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: implementation-pool-chatgpt
spec:
  modelName: implementation-pool
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-luna
    additional:
      additional_drop_params:
      - temperature
      order: 1
      extra_body:
        reasoning:
          effort: high
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.0e-07
      cache_creation_input_token_cost: 1.25e-07
      cache_read_input_token_cost: 1.0e-08
      output_cost_per_token: 5.0e-07
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: implementation-pool-27b
spec:
  modelName: implementation-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 2
      max_parallel_requests: 2
      reasoning_effort: xhigh
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 40960
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: implementation-pool-minimax
spec:
  modelName: implementation-pool
  proxyRef: litellm
  params:
    model: openai/MiniMax-M2.7
    apiBase: https://api.minimax.io/v1
    apiKey: os.environ/MINIMAX_API_KEY
    additional:
      order: 3
  info:
    mode: chat
    maxInputTokens: 204800
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    extra:
      input_cost_per_token: 3.0e-07
      output_cost_per_token: 1.2e-06
