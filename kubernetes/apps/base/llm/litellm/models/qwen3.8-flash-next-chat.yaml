---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3.8-flash-next-chat
spec:
  modelName: qwen3.8-flash-next-chat
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next
    apiBase: http://qwen3-8-flash-next-gufo.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      repetition_penalty: 1.0
      order: 1
      max_parallel_requests: 2
      timeout: 1800
      # usage-based-routing-v2 steering (see qwen3.8-flash-next group for
      # the rationale): equal absurd limits, lowest per-minute usage wins.
      tpm: 10000000
      rpm: 10000
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  info:
    mode: chat
    maxInputTokens: 271360
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      allowed_fails_policy:
        RateLimitErrorAllowedFails: 10000
      input_cost_per_token: 2.09e-07
      output_cost_per_token: 2.97e-06
      cache_read_input_token_cost: 0.0
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: flash-next-chat-strata
spec:
  modelName: qwen3.8-flash-next-chat
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next-iq3_s
    apiBase: http://qwen3-8-flash-next-strata.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      repetition_penalty: 1.0
      order: 1
      # 2 slots live on the engine (--parallel 2, IQ4_XS all-resident).
      max_parallel_requests: 2
      timeout: 1800
      # Matches the gufo rung: equal limits keep the usage-based-v2 filter
      # inert on both rungs of the group.
      tpm: 10000000
      rpm: 10000
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  info:
    mode: chat
    maxInputTokens: 271360
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: true # verified 2026-11-09 on the strata engine: data-URL image request, 200 + correct description
    extra:
      allowed_fails_policy:
        RateLimitErrorAllowedFails: 10000
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
