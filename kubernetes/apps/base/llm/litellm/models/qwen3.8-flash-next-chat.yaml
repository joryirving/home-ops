---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3.8-flash-next-chat
spec:
  modelName: qwen3.8-flash-next-chat
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next
    apiBase: http://qwen3-8-flash-next.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      repetition_penalty: 1.0
      order: 1
      max_parallel_requests: 2
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  info:
    mode: chat
    maxInputTokens: 245760
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 2.09e-07
      output_cost_per_token: 2.97e-06
      cache_read_input_token_cost: 0.0
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: flash-next-chat-strata
spec:
  modelName: qwen3.8-flash-next-chat
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next-iq3_s
    apiBase: http://strata-fn.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      repetition_penalty: 1.0
      order: 1
      max_parallel_requests: 3
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  info:
    mode: chat
    maxInputTokens: 245760
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true # verified 2026-11-09 on strata-fn: data-URL image request, 200 + correct description
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
