---
# TEMPORARY TEST (2026-11-22): Inkling-2-Mini on ganyu's 3090, one slot at
# 131,072 tokens. That is the ceiling for the fast CUDA backend on a 24 GB
# card: all 12.28 GB of experts are resident, leaving ~2 GiB for KV. The
# Strata pod is swapped to the strata-inkling engine, so this alias is the
# only way to reach it and the QFN groups run on Gufo alone.
# The engine accepts any `model:` name, so that field is cosmetic.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: inkling-2-mini-strata
spec:
  modelName: inkling-2-mini
  proxyRef: litellm
  params:
    model: openai/inkling-2-mini-sq-15
    apiBase: http://qwen3-8-flash-next-strata.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 1
      # Matches the engine's --parallel 1. Keep them equal or the router will
      # admit more work than the engine can hold.
      max_parallel_requests: 1
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      allowed_fails_policy:
        RateLimitErrorAllowedFails: 10000
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      cache_read_input_token_cost: 0.0
