---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: nemotron
spec:
  modelName: nemotron
  proxyRef: litellm
  params:
    model: openai/llama-strix-nemotron
    apiBase: http://llama-strix-nemotron.llm:8080/v1
    apiKey: llama-strix-nemotron
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 262144
    maxOutputTokens: 20480
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 1.25e-07
      cache_creation_input_token_cost: 1.25e-07
      cache_read_input_token_cost: 1.25e-08
      output_cost_per_token: 4.999e-07
