---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: muse-glimmer
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: muse-glimmer
  proxyRef: litellm
  params:
    model: openai/muse-glimmer-30b
    apiBase: http://mac.internal:1234/v1
    apiKey: sk-llmkube-noauth
    additional:
      # TEMPORARY TEST 2026-11-06: supplant in-cluster muse with the MBP LM
      # Studio instance; remove this deployment and the order fields when the
      # test ends.
      order: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 20480
    supportsFunctionCalling: true
    supportsVision: true
  extra:
    input_cost_per_token: 6.2e-08
    output_cost_per_token: 1.35e-06
    cache_read_input_token_cost: 0.0
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: muse-glimmer-nvidia
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: muse-glimmer
  proxyRef: litellm
  params:
    model: openai/muse-glimmer
    apiBase: http://nvidia-router-proxy.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      order: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 20480
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
