---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: vision
spec:
  modelName: vision
  proxyRef: litellm
  params:
    model: openai/llama-vision
    apiBase: http://llama-vision.llm:8080/v1
    apiKey: llama-vision
    additional:
      additional_drop_params:
      - reasoning_effort
      max_parallel_requests: 1
  info:
    mode: chat
    maxInputTokens: 32768
    maxOutputTokens: 8192
    supportsFunctionCalling: false
    supportsVision: true
    extra:
      input_cost_per_token: 1.25e-07
      cache_creation_input_token_cost: 1.25e-07
      cache_read_input_token_cost: 1.25e-08
      output_cost_per_token: 4.999e-07
