---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-4
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/glm-5.3-flash-local
    apiBase: http://glm-5-3-flash-local.llm.svc.cluster.local:8000/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 4
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 245760
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 2.09e-07
      output_cost_per_token: 2.97e-06
      cache_read_input_token_cost: 0.0
