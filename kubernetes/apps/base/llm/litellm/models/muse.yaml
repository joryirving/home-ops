---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: muse
spec:
  modelName: muse
  proxyRef: litellm
  params:
    model: openai/llama-strix-muse
    apiBase: http://llama-strix-muse.llm:8080/v1
    apiKey: llama-strix-muse
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 20480
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 1.25e-07
      cache_creation_input_token_cost: 1.25e-07
      cache_read_input_token_cost: 1.25e-08
      output_cost_per_token: 4.999e-07
