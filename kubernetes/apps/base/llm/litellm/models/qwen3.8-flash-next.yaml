---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3-8-flash-next-gufo
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: qwen3.8-flash-next
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next
    apiBase: http://qwen3-8-flash-next-gufo.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 1
      max_parallel_requests: 2
      # usage-based-routing-v2: the router sends new requests to the rung
      # with the lowest per-minute usage from the Redis router_usage store
      # -- the only cluster-wide signal the three proxy replicas share.
      # least-busy counted per-process in-flight requests, so fresh replicas
      # always saw 0-vs-0 and stacked everything on gufo (2 lanes + 5
      # engine-queued while strata sat at max 1 over a 5 h window). The
      # limits are deliberately absurd: they never filter, relative usage
      # does the steering, and the idle rung wins until token-minutes even
      # out. Ties (both counters at zero) scan in group order, so gufo --
      # the better quant -- keeps the first stream.
      tpm: 10000000
      rpm: 10000
  info:
    mode: chat
    maxInputTokens: 271360
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      allowed_fails_policy:
        RateLimitErrorAllowedFails: 10000
      input_cost_per_token: 2.09e-07
      output_cost_per_token: 2.97e-06
      cache_read_input_token_cost: 0.0
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3-8-flash-next-strata
spec:
  modelName: qwen3.8-flash-next
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next-iq3_s
    apiBase: http://qwen3-8-flash-next-strata.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 1
      # 2 slots live on the engine (--parallel 2, IQ4_XS all-resident): two
      # concurrent sessions fit the 96Gi cgroup with headroom (measured).
      max_parallel_requests: 2
      # Matches the gufo rung: equal limits keep the usage-based-v2 filter
      # inert on both rungs of the group.
      tpm: 10000000
      rpm: 10000
  info:
    mode: chat
    maxInputTokens: 271360
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      allowed_fails_policy:
        RateLimitErrorAllowedFails: 10000
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
