---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chatgpt-gpt-6.2-astra
spec:
  modelName: chatgpt/gpt-6.2-astra
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6.2-astra
    additional:
      additional_drop_params:
      - temperature
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 8.0e-06
      cache_creation_input_token_cost: 4.0e-07
      cache_read_input_token_cost: 4.0e-07
      output_cost_per_token: 4.0e-05
