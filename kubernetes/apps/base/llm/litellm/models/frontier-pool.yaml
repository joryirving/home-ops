---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-pool-kimi
spec:
  modelName: frontier-pool
  proxyRef: litellm
  params:
    model: openai/k3
    apiBase: https://api.kimi.com/coding/v1
    apiKey: os.environ/KIMI_CODE_API_KEY
    additional:
      order: 1
      additional_drop_params:
      - frequency_penalty
      - n
      - presence_penalty
      - temperature
      - thinking
      - top_p
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 3.0e-06
      cache_creation_input_token_cost: 3.0e-06
      cache_read_input_token_cost: 3.0e-07
      output_cost_per_token: 1.5e-05
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-pool-chatgpt
spec:
  modelName: frontier-pool
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-astra
    additional:
      additional_drop_params:
      - temperature
      order: 2
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.0e-05
      cache_creation_input_token_cost: 1.25e-05
      cache_read_input_token_cost: 1.0e-06
      output_cost_per_token: 5.0e-05
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-pool-zai
spec:
  modelName: frontier-pool
  proxyRef: litellm
  params:
    model: openai/glm-5.3
    apiBase: https://api.z.ai/api/coding/paas/v4
    apiKey: os.environ/ZAI_API_KEY
    additional:
      order: 3
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.4e-06
      cache_creation_input_token_cost: 1.4e-06
      cache_read_input_token_cost: 2.6e-07
      output_cost_per_token: 4.4e-06
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-pool-hyper
spec:
  modelName: frontier-pool
  proxyRef: litellm
  params:
    model: openai/deepseek-v4.1-flash
    apiBase: https://hyper.charm.land/v1
    apiKey: os.environ/HYPER_API_KEY
    additional:
      order: 4
      allowed_openai_params:
      - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 1310722
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 3.2664e-07
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 3.2664e-08
      output_cost_per_token: 1.30656e-06
