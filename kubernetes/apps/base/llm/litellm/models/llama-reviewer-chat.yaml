---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: llama-reviewer-chat
spec:
  modelName: llama-reviewer-chat
  proxyRef: litellm
  params:
    model: openai/gemma-4-12b-it-qat
    apiBase: http://gemma-wake.llm:8080/v1
    apiKey: sk-noauth
    additional:
      timeout: 300
      num_retries: 3
      temperature: 1.0
      top_p: 0.95
      top_k: 64
      reasoning_effort: none
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 262144
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: true
