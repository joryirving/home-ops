---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: project-maya-glm-5-3-flash-s24
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: glm-5.3-flash-local
  proxyRef: litellm
  params:
    model: openai/glm-5.3-flash
    apiBase: http://project-maya-glm-5-3-flash-s24.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 3
      # Keep this equal to the engine's PARALLEL in litellm/project-maya.yaml, or
      # the proxy queues a second request at a card that decodes one at a time and
      # the latency looks worse than it is.
      max_parallel_requests: 2
      reasoning_effort: xhigh
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    # The engine's context is 1000000 in total: the input and the output share it.
    maxInputTokens: 991808
    maxOutputTokens: 8192
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
