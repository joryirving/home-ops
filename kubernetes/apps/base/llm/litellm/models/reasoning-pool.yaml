---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-kimi
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/kimi-for-coding
    apiBase: https://api.kimi.com/coding/v1
    apiKey: os.environ/KIMI_CODE_API_KEY
    additional:
      order: 1
      additional_drop_params:
      - frequency_penalty
      - n
      - presence_penalty
      - reasoning_effort
      - temperature
      - thinking
      - top_p
  info:
    mode: chat
    maxInputTokens: 262144
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 9.5e-07
      cache_creation_input_token_cost: 9.5e-07
      cache_read_input_token_cost: 1.9e-07
      output_cost_per_token: 4.0e-06
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-chatgpt
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6.1-sol
    additional:
      additional_drop_params:
      - temperature
      order: 2
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 2.0e-06
      cache_creation_input_token_cost: 2.5e-06
      cache_read_input_token_cost: 1.0e-07
      output_cost_per_token: 1.0e-05
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-zai
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/glm-5.3-flash
    apiBase: https://api.z.ai/api/coding/paas/v4
    apiKey: os.environ/ZAI_API_KEY
    additional:
      order: 3
      allowed_openai_params:
      - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 1.5e-07
      cache_creation_input_token_cost: 1.5e-07
      cache_read_input_token_cost: 3.0e-08
      output_cost_per_token: 5.0e-07
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-minimax
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/MiniMax-M3
    apiBase: https://api.minimax.io/v1
    apiKey: os.environ/MINIMAX_API_KEY
    additional:
      order: 4
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    extra:
      input_cost_per_token: 3.0e-07
      output_cost_per_token: 1.2e-06
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-flash-next
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next
    apiBase: http://qwen3-8-flash-next.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 5
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 245760
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 2.09e-07
      output_cost_per_token: 2.97e-06
      cache_read_input_token_cost: 0.0
