---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/opencode
              tag: 2.2.1@sha256:9cd3b2621b0c38a7c0e6f7a01b3246d3dab1e119fbb7b1b7da0deeb4b5151377
            command: ["/etc/opencode/entrypoint.sh"]
            env:
              HOME: &homepath /home/opencode
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-opencode
                    key: api-key
              OPENCODE_CONFIG: /etc/opencode/opencode.json
              TZ: America/Edmonton
            envFrom:
              - secretRef:
                  name: opencode
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["opencode.jory.dev"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port
      api:
        hostnames: ["opencode-api.jory.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        annotations:
          gatus.home-operations.com/endpoint: |
            conditions: ["len([BODY]) == 0"]
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: *homepath
      config:
        type: configMap
        name: opencode-config
        defaultMode: 0755
        globalMounts:
          - path: /etc/opencode
