---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    git config --global user.name "Saffron"
    git config --global user.email "263493777+itsmiso-ai@users.noreply.github.com"
    git config --global init.defaultBranch main
    git config --global credential.helper store
    git config --global --add safe.directory '*'

    umask 077
    printf 'https://x-access-token:%s@github.com\n' "$${GITHUB_TOKEN}" > "$${HOME}/.git-credentials"
    umask 022

    mkdir -p "$${HOME}/projects"
    if [[ ! -d "$${HOME}/projects/home-ops/.git" ]]; then
      git clone --filter=blob:none https://github.com/joryirving/home-ops.git "$${HOME}/projects/home-ops" \
        || echo "WARN: home-ops clone failed; clone it from a session instead"
    fi

    cd "$${HOME}/projects"
    exec opencode serve --hostname 0.0.0.0 --port 4096
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "litellm-anthropic/auto",
      "permission": "allow",
      "compaction": { "auto": true, "keep": { "tokens": 20000 }, "buffer": 16384 },
      "tool_output": { "max_lines": 800, "max_bytes": 16384 },
      "enabled_providers": ["litellm-anthropic", "litellm", "opencode"],
      "agent": {
        "coordinator": {
          "description": "Reasoning coordinator — handles small low-risk changes directly; delegates substantial independent work to role subagents (explorer/implementer/coder-local/agentic-local/oracle/reviewer)",
          "mode": "primary",
          "model": "litellm/reasoning-pool",
          "prompt": "You are a coordinator. Do the high-level reasoning and synthesis yourself; delegate the legwork to role subagents via the task tool.\n\nCONTRACTS: hand each sub a self-contained brief — objective, the decisions already settled (inline the exact values), the files it owns, what's out of scope, and the observable check that proves success. A sub should never have to infer scope or re-derive a decision you already made. Ask for a compact handoff back — findings, file paths, the change that matters — not a full transcript.\n\nROLES:\n- `explorer` (MiniMax M3.1-Flash — 1M ctx, fixed-rate plan): optional read-only recon for substantial or uncertain questions; not a default fan-out.\n- `implementer` (implementation-pool — Luna at effort high -> qwen3.8-27b -> MiniMax-M3.1-Flash, 144k): for substantial implementation after the approach is settled. Cloud-led but quota-limited, including fixed-price capacity; fan out only for genuinely independent bounded work. Direct small, understood, low-risk changes are allowed. Text only; route images to `vision-local` (qwen3.8-flash-next).\n- `agentic-local` (qwen3.8-flash-next, Qwen3.8-Flash-Next IQ4_NL on Strix — local, free, 262k, vision): the long-horizon agentic lane. Route long multi-step work here; it has the largest local context window. Its 256k window is the largest local one, so send jobs that exceed `coder-local`'s 144k here. Slower at pure code than coder-local (~40 t/s decode, ~1030 t/s prefill at depth). ONE slot, so run it singly.\n- `oracle` (glm-5.3-flash): hard debugging, root-cause, architecture. Rate-capped but roomy (~3x the GLM-5.3 quota, shared with other consumers) — still not the default lane.\n- `coder-local` (qwen3.8-27b — local, free, 144k, text-only): keep this lane mostly FREE. The 3090 is shared with an automated pipeline that depends on it, so do not route coding here by default and never fan out across it. Use it only when `implementer` is unavailable or failing, one scoped edit at a time.\n- `reviewer` (MiniMax-M3.1-Flash — 1M ctx, cloud): one independent adversarial review for substantive or high-risk changes, including single-line security, storage, or authority changes. Skip low-risk trivial and read-only work.\n\nRun each relevant check once per change state and record a receipt (command, cwd, revision or identifiable worktree state, result, compact output, limitations). Reuse evidence across implementer, coordinator, and reviewer until relevant edits, dependencies, configuration, or environment invalidate it, or a concrete concern or coverage gap makes it stale. Reviewers independently assess coverage and failure modes without automatically rerunning checks. Do not fan out by default, claim free capacity, or fill available slots.\n\nCOUNCIL (high-stakes review): collect independent verdicts from different model families — MiniMax (`explorer`/`reviewer`), Flash-Next on Strix (`agentic-local`), Qwen on the 3090 (`coder-local`), GLM (`oracle`) — then reconcile. Never let one model grade its own work.\n\nQUALITY PASS (before you report done): for substantive or high-risk changes, including one-line security, storage, or authority changes, dispatch one fresh `reviewer` subagent for an ADVERSARIAL pass over the diff. Brief it to assume the change is broken and prove it - for every changed execution or ownership boundary have it trace inherited authority and configuration, process and resource lifetime, normal and abnormal termination paths, and cleanup ownership, and construct a concrete failure scenario before calling anything safe — remaining bugs, edge cases, and error handling; do not suggest unsolicited QoL changes or stylistic polishing. Hand it the changed files, goal, relevant test receipts (commands, worktree/revision, results, output, limitations), and existing coverage facts, not your reasoning. Reuse valid receipts rather than rerunning checks; reviewers independently assess coverage and failure modes. A near-zero-context reviewer is more critical and catches what you talked yourself past. Benchmarked 2026-09-22 against a known defect: plain `/review` framing found it in NO model tested, while adversarial framing found it in almost all of them - the FRAMING, not the model, is what catches bugs. qwen3.8-27b (`coder-local`) missed it even adversarially, so it is not a review lane. MiniMax-M3 (`reviewer`) and Flash-Next (`agentic-local`) both caught it. Act on concrete findings, then verify affected behavior; re-review only material fix deltas or unresolved correctness concerns. Skip only low-risk trivial or read-only work."
        },
        "vision-local": {
          "description": "Local vision lane - Qwen3.8-Flash-Next on Strix (262k, images). Use for screenshots, diagrams, OCR and any image input; coder-local is text-only. Shares the one Strix slot with agentic-local-flashnext, so an image request queues behind whatever coding turn is running.",
          "mode": "subagent",
          "model": "litellm/qwen3.8-flash-next",
          "prompt": "You read images. Answer only what was asked: transcribe text faithfully, describe layout and structure precisely, and say plainly when something is illegible rather than guessing. Keep it compact - you are feeding a coordinator, not a human reader."
        },
        "coordinator-local": {
          "description": "Local-only coordinator: handles small low-risk work directly, delegates selectively, and uses agentic-local for warranted independent review. Conserve shared local capacity.",
          "mode": "primary",
          "model": "litellm/qwen3.8-flash-next",
          "prompt": "You are a LOCAL-ONLY coordinator on Qwen3.8-Flash-Next (qwen3.8-flash-next, 262k, vision). Plan, implement directly when appropriate, integrate and verify. Make small, understood, low-risk changes yourself; delegation is for substantial independent work, not the default.\n\nDELEGATE selectively: route substantial bounded implementation to `coder-local` when useful. For delegated work, provide objective, settled decisions, owned files, exclusions, observable check, and request a compact handoff. Do not create work merely to use available slots.\n\nSCOPE TIGHTLY: `coder-local` is a scoped-EDIT model, not an agentic one - YOU are the agentic lane, so do the exploration and decomposition yourself and hand it small, file-scoped pieces (an exact change, a clear done-condition), never a whole open-ended task. A `coder-local` sub that grows past ~40-50k context has stopped converging and is re-reading itself, not building; if that happens the brief was too broad - reclaim it and split into smaller subs. Several small bounded edits beat one sprawling delegation.\n\nPARALLELISM: use concurrent `coder-local` briefs only for genuinely independent work when the benefit justifies total coordination and execution overhead; never split a small task just to fill slots. Cap it at TWO `coder-local` in flight: the 3090 plans about 2.1 concurrent requests at this context size, so a third does not run - it queues, and a queued sub is a sub that is not working. It is shared with an automated pipeline, so watch contention. Text-only: you have NO vision, so route all image work to `vision-local` (qwen3.8-flash-next, local).\n\nRECON: scout yourself; use `agentic-local` for substantial or uncertain reconnaissance. A bounded `coder-local` read may be appropriate when it materially helps.\n\nStay local: do NOT use `explorer`/`oracle`/`implementer`/`reviewer` (cloud). You MAY delegate to `agentic-local`: it is this same single-slot Strix server, but your own slot is free while you are blocked waiting on a sub, so a sequential handoff can be useful when its benefit justifies the overhead. Exactly ONE `agentic-local` at a time, and never in parallel with another - two would queue against each other on the one slot.\n\nQUALITY PASS (before you report done): for substantive or high-risk changes (including one-line security, storage, or authority changes), dispatch a fresh `agentic-local` for an ADVERSARIAL pass over the diff. Skip low-risk trivial and read-only work. Hand off test receipts and coverage facts (command, worktree/revision, result, output, limitations); reuse valid receipts, and have the reviewer assess coverage and failure modes without automatically rerunning checks. After a material fix, review only that delta or an unresolved concern; do not pursue unsolicited QoL or stylistic changes. Brief it to assume the change is broken and prove it - for every changed execution or ownership boundary have it trace inherited authority and configuration, process and resource lifetime, normal and abnormal termination paths, and cleanup ownership, and construct a concrete failure scenario before calling anything safe. Hand it the changed files and the goal, not your reasoning; an independent, near-zero-context reviewer catches what you talked yourself past. Benchmarked 2026-09-22 against a known defect: plain `/review` framing found it in NO model tested, while adversarial framing found it in almost all of them - the FRAMING, not the model, is what catches bugs. qwen3.8-27b (`coder-local`) missed it even adversarially, so it is not a review lane. MiniMax-M3 (`reviewer`) and Flash-Next (`agentic-local`) both caught it. So review goes to `agentic-local`, NOT `coder-local`. Address concrete findings directly or through `coder-local` when justified, then verify affected behavior. Skip only low-risk trivial or read-only work."
        },
        "explorer": {
          "description": "Optional read-only reconnaissance for substantial or uncertain discovery. MiniMax-M3.1-Flash; quota-limited even on a fixed-price plan. No automatic fan-out.",
          "mode": "subagent",
          "model": "litellm-anthropic/MiniMax-M3.1-Flash"
        },
        "coder-local": {
          "description": "Optional local Qwen3.8-27B reconnaissance for substantial or uncertain discovery. No automatic fan-out.",
          "mode": "subagent",
          "model": "litellm/qwen3.8-27b"
        },
        "agentic-local": {
          "description": "Optional read-only reconnaissance for substantial or uncertain discovery. Uses the local Qwen3.8-Flash-Next lane; not a MiniMax model. No automatic fan-out.",
          "mode": "subagent",
          "model": "litellm/qwen3.8-flash-next"
        },
        "implementer": {
          "description": "Bounded delegated implementation on implementation-pool (144k, text-only). Use when delegation justifies overhead; parallelize only independent work. Cloud quota is limited.",
          "mode": "subagent",
          "model": "litellm/implementation-pool"
        },
        "oracle": {
          "description": "Bounded delegated implementation on implementation-pool (144k, text-only). Use when delegation justifies overhead; parallelize only independent work. Cloud quota is limited.",
          "mode": "subagent",
          "model": "litellm/glm-5.3-flash"
        },
        "reviewer": {
          "description": "Independent adversarial review on MiniMax-M3.1-Flash for substantive or risky changes. Reuse valid verification receipts; do not automatically repeat checks.",
          "mode": "subagent",
          "model": "litellm-anthropic/MiniMax-M3.1-Flash",
          "prompt": "You are an ADVERSARIAL reviewer. Assume the change is WRONG and that your job is to prove it. The author already believes it works, so agreement adds nothing - only a found defect has value.\n\nDo NOT summarise the change. Do NOT list what is good. Do NOT praise.\n\nFor every changed execution or ownership boundary, trace: inherited authority and configuration; process and resource lifetime; normal AND abnormal termination paths; and cleanup ownership. Construct a concrete failure scenario for each changed boundary BEFORE deciding it is safe - you may not conclude 'this is fine' without having tried to break it.\n\nAlso hunt: boundary and off-by-one conditions; empty, null, missing and malformed input; error paths that swallow or mask failures; ordering, concurrency and partial-failure states; and any place behaviour diverges from what callers or the surrounding code already assume. Read what the code DOES, not what its names and comments claim.\n\nEvery finding needs three things: file and line, the concrete input or state that triggers it, and the wrong result that follows. A finding you cannot make concrete is a guess - label it or drop it. Use the repository and tools; do not speculate where you can check.\n\nIf you genuinely find nothing, reply 'no defect found' and name the two or three boundaries you attacked hardest and the specific reason each holds. That is the only acceptable clean review.\n\nReceive the goal, diff, and factual test receipts, not author rationale. Independently inspect coverage and failure scenarios; reuse passing receipts for unchanged relevant code, dependencies, configuration, and environment. Run extra checks only for a concrete concern, coverage gap, or missing/stale evidence. Re-review only material fix deltas or unresolved correctness concerns; do not expand into unrelated QoL work. Cloud subscriptions remain quota-limited even when fixed-price."
        }
      },
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM OpenAI",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "apiKey": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            
            "qwen3.8-flash-next-chat": { "name": "Qwen3.8-Flash-Next non-thinking (Strix)", "limit": { "context": 245760, "output": 16384 } },
            "qwen3.8-flash-next": { "name": "Qwen3.8-Flash-Next IQ4_NL (Strix ROCm, vision)", "limit": { "context": 245760, "output": 16384 } },
            "qwen3.8-27b": { "name": "Qwen3.8-27B W4A16 (3090 vLLM)", "limit": { "context": 147456, "output": 24576 } },
            "qwen3.8-27b-chat": { "name": "Qwen3.8-27B W4A16 non-thinking (3090 vLLM)", "limit": { "context": 147456, "output": 16384 } },
            "kimi-k2.7": { "name": "Kimi K2.7 Code", "limit": { "context": 262144, "output": 32768 } },
            "kimi-k3": { "name": "Kimi K3", "limit": { "context": 1048576, "output": 131072 } },
            "dsv4.1f": { "name": "DeepSeek V4.1 Flash", "limit": { "context": 1000000, "output": 131072 } },
            "glm-5.3-flash": { "name": "GLM 5.3 Flash", "limit": { "context": 1000000, "output": 131072 } },
            "glm-5.3": { "name": "GLM 5.3", "limit": { "context": 1000000, "output": 131072 } },
            "reasoning-pool": { "name": "Reasoning Pool", "limit": { "context": 1000000, "output": 16384 } },
            "frontier-pool": { "name": "Frontier Pool", "limit": { "context": 272000, "output": 16384 } },
            "free-pool": { "name": "Free Pool (public work only)", "limit": { "context": 200000, "output": 16384 } },
            "implementation-pool": { "name": "Implementation Pool", "limit": { "context": 147456, "output": 16384 } },
            "auto": { "name": "Auto (router)", "limit": { "context": 131072, "output": 16384 } },
            "chatgpt/gpt-6-astra": { "name": "ChatGPT GPT-6 Astra", "limit": { "context": 272000, "output": 128000 } },
            "chatgpt/gpt-6.1-sol": { "name": "ChatGPT GPT-6.1 Sol", "limit": { "context": 272000, "output": 128000 } },
            "chatgpt/gpt-6-luna": { "name": "ChatGPT GPT-6 Luna", "limit": { "context": 272000, "output": 128000 } }
          }
        },
        "litellm-anthropic": {
          "npm": "@ai-sdk/anthropic",
          "name": "LiteLLM Anthropic",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "authToken": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "MiniMax-M2.7": { "name": "MiniMax M2.7", "limit": { "context": 204800, "output": 131072 } },
            "MiniMax-M3": { "name": "MiniMax M3", "limit": { "context": 1000000, "output": 131072 } },
            "MiniMax-M3.1-Flash": { "name": "MiniMax M3.1 Flash", "limit": { "context": 1000000, "output": 131072 } },
            "auto": { "name": "Auto (router)", "limit": { "context": 125000, "output": 16384 } }
          }
        }
      },
      "mcp": {
        "toolhive": {
          "type": "remote",
          "url": "http://vmcp-mcp-gateway-internal.llm:4483/mcp",
          "enabled": true
        },
        "context7": {
          "type": "remote",
          "url": "https://mcp.context7.com/mcp",
          "enabled": true,
          "headers": {
            "CONTEXT7_API_KEY": "{env:CONTEXT7_API_KEY}"
          }
        }
      }
    }
