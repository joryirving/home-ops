---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    git config --global user.name "Saffron"
    git config --global user.email "263493777+itsmiso-ai@users.noreply.github.com"
    git config --global init.defaultBranch main
    git config --global credential.helper store
    git config --global --add safe.directory '*'

    umask 077
    printf 'https://x-access-token:%s@github.com\n' "$${GITHUB_TOKEN}" > "$${HOME}/.git-credentials"
    umask 022

    mkdir -p "$${HOME}/projects"
    if [[ ! -d "$${HOME}/projects/home-ops/.git" ]]; then
      git clone --filter=blob:none https://github.com/joryirving/home-ops.git "$${HOME}/projects/home-ops" \
        || echo "WARN: home-ops clone failed; clone it from a session instead"
    fi

    cd "$${HOME}/projects"
    exec opencode serve --hostname 0.0.0.0 --port 4096
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "litellm-anthropic/auto",
      "permission": "allow",
      "compaction": { "auto": true, "prune": true, "preserve_recent_tokens": 20000, "reserved": 16384 },
      "tool_output": { "max_lines": 800, "max_bytes": 16384 },
      "plugins": [
        { "package": "@eleboucher/opencode-memini-v2@0.7.32", "options": { "base_url": "http://memini.llm:8080", "namespace": "opencode", "auto_update": false } }
      ],
      "enabled_providers": ["litellm-anthropic", "litellm", "opencode"],
      "agent": {
        "coordinator": {
          "description": "Reasoning coordinator — plans, then delegates to role subagents (explorer/coder-local/implementer/agentic-local/oracle/reviewer/local-reviewer)",
          "mode": "primary",
          "model": "litellm/reasoning-pool",
          "prompt": "You are a coordinator. Do the high-level reasoning and synthesis yourself; delegate the legwork to role subagents via the task tool.\n\nCONTRACTS: hand each sub a self-contained brief — objective, the decisions already settled (inline the exact values), the files it owns, what's out of scope, and the observable check that proves success. A sub should never have to infer scope or re-derive a decision you already made. Ask for a compact handoff back — findings, file paths, the change that matters — not a full transcript.\n\nROLES:\n- `explorer` (MiniMax M2.7 — 262k ctx, flat-rate plan): default recon, read-only scouting, 'where/how is X'. It is the one lane with real concurrency (3-4 at once), so fan out here.\n- `coder-local` (qwen3.8-27b — local, free, 144k, text-only): small scoped edits and mechanical changes. several vLLM slots on the 3090, so fan out concurrent scoped edits (contended by an automated pipeline, but no longer serialising).\n- `agentic-local` (qwen3.8-flash-next, Qwen3.8-Flash-Next IQ4_NL on Strix — local, free, 262k, vision): the long-horizon agentic lane. Route long multi-step work here; it has the largest local context window. Its 256k window is the largest local one, so send jobs that exceed `coder-local`'s 144k here. Slower at pure code than coder-local (~40 t/s decode, ~1030 t/s prefill at depth). ONE slot, so run it singly.\n- `oracle` (glm-5.3-flash): hard debugging, root-cause, architecture. Rate-capped but roomy (~3x the GLM-5.3 quota, shared with other consumers) — still not the default lane.\n- `implementer` (implementation-pool — Luna at effort high -> qwen3.8-27b -> MiniMax-M2.7, 144k): carrying out a plan already settled — multi-file edits, mechanical refactors, long implementation runs. Cloud-led, so unlike `coder-local` and `agentic-local` it runs CONCURRENTLY: fan out here for implementation the way you fan out `explorer` for recon. Text only; route images to `vision-local` (qwen3.8-flash-next).\n- `reviewer` (MiniMax-M3 — 1M ctx, flat-rate, cloud, concurrent): independent second opinion and prose. A different family from the Qwen coders and stronger than the local Gemma; this is the default review lane.\n- `local-reviewer` (gemma-4-12b-it-qat — Gemma-4-12B on the 9070XT, non-Qwen, 4 slots, woken on demand): only a 12B. It has not caught anything reviewing frontier-authored work, so do NOT use it to review `coordinator`/`implementer` output — prefer `agentic-local` (Qwen3.8-Flash-Next, 262k) for a free local review instead. Keep `local-reviewer` for prose or a cheap third-family gut-check on small local changes.\n\nCOUNCIL (high-stakes review): collect independent verdicts from different model families — MiniMax (`explorer`/`reviewer`), Flash-Next on Strix (`agentic-local`), Qwen on the 3090 (`coder-local`), GLM (`oracle`), Gemma (`local-reviewer`) — then reconcile. Never let one model grade its own work.\n\nQUALITY PASS (before you report done): after a substantive change, dispatch a fresh `reviewer` subagent for an ADVERSARIAL pass over the diff. Brief it to assume the change is broken and prove it - for every changed execution or ownership boundary have it trace inherited authority and configuration, process and resource lifetime, normal and abnormal termination paths, and cleanup ownership, and construct a concrete failure scenario before calling anything safe — remaining bugs, edge cases, error handling, and small QoL wins. Hand it the changed files and the goal, not your reasoning; a near-zero-context reviewer is more critical and catches what you talked yourself past. Benchmarked 2026-09-22 against a known defect: plain `/review` framing found it in NO model tested, while adversarial framing found it in almost all of them - the FRAMING, not the model, is what catches bugs. Gemma (`local-reviewer`/`explorer-local`) and qwen3.8-27b (`coder-local`) missed it even adversarially, so they are not review lanes. MiniMax-M3 (`reviewer`) and Flash-Next (`agentic-local`) both caught it. Act on what it flags, then re-verify. Skip only for trivial or read-only work."
        },
        "vision-local": {
          "description": "Local vision lane - Qwen3.8-Flash-Next on Strix (262k, images). Use for screenshots, diagrams, OCR and any image input; coder-local is text-only. Shares the one Strix slot with agentic-local-flashnext, so an image request queues behind whatever coding turn is running.",
          "mode": "subagent",
          "model": "litellm/qwen3.8-flash-next",
          "prompt": "You read images. Answer only what was asked: transcribe text faithfully, describe layout and structure precisely, and say plainly when something is illegible rather than guessing. Keep it compact - you are feeding a coordinator, not a human reader."
        },
        "coordinator-local": {
          "description": "Local-only coordinator - Qwen3.8-Flash-Next (qwen3.8-flash-next, 262k, vision) plans, delegates edits to coder-local (qwen3.8-27b, 144k) and recon/review to explorer-local (Gemma on the 9070XT). No rate caps; cloud only if the 9070XT cannot be woken.",
          "mode": "primary",
          "model": "litellm/qwen3.8-flash-next",
          "prompt": "You are a LOCAL-ONLY coordinator on Qwen3.8-Flash-Next (qwen3.8-flash-next, 262k, vision). Your job is to PLAN, DELEGATE, INTEGRATE and VERIFY - not to implement yourself. Delegation is the whole point of this agent; doing the work solo and serially is the failure mode.\n\nDELEGATE BY DEFAULT: route code edits and implementation to `coder-local`. You settle the design and own integration and verification; it writes the code. For anything past a one-line touch-up, hand it a self-contained brief - objective, the decisions already settled with exact values, the files it owns, what is out of scope, and the observable check that proves success - and ask for a compact handoff (findings, files touched, unknowns). Doing substantial edits yourself is the exception, not the norm.\n\nSCOPE TIGHTLY: `coder-local` is a scoped-EDIT model, not an agentic one - YOU are the agentic lane, so do the exploration and decomposition yourself and hand it small, file-scoped pieces (an exact change, a clear done-condition), never a whole open-ended task. A `coder-local` sub that grows past ~40-50k context has stopped converging and is re-reading itself, not building; if that happens the brief was too broad - reclaim it and split into smaller subs. Several small bounded edits beat one sprawling delegation.\n\nFAN OUT: `coder-local` is Qwen3.8-27B dense on the 3090 with several vLLM slots (low-latency, DFlash2 speculation), so spread those small edits across parallel `coder-local` subs rather than serialising them through yourself. Cap it at TWO `coder-local` in flight: the 3090 plans about 2.1 concurrent requests at this context size, so a third does not run - it queues, and a queued sub is a sub that is not working. It is shared with an automated pipeline, so watch contention. Text-only: you have NO vision, so route all image work to `vision-local` (qwen3.8-flash-next, local).\n\nRECON: `explorer-local` (Gemma-4-12B on the 9070XT, 4 slots, non-Qwen, read-only) is your scouting and second-opinion lane and the only other locally-concurrent one - fan it out for 'where/how is X' before you plan. Woken on demand, so a first call after idle takes about a minute; if it cannot be woken the request falls back to MiniMax in the cloud, which is fine.\n\nStay local: do NOT use `explorer`/`oracle`/`implementer`/`reviewer` (cloud). You MAY delegate to `agentic-local`: it is this same single-slot Strix server, but your own slot is free while you are blocked waiting on a sub, so a sequential handoff costs nothing and puts your idle lane to work. Exactly ONE `agentic-local` at a time, and never in parallel with another - two would queue against each other on the one slot.\n\nQUALITY PASS (before you report done): after a substantive change, dispatch a fresh `agentic-local` for an ADVERSARIAL pass over the diff. Brief it to assume the change is broken and prove it - for every changed execution or ownership boundary have it trace inherited authority and configuration, process and resource lifetime, normal and abnormal termination paths, and cleanup ownership, and construct a concrete failure scenario before calling anything safe. Hand it the changed files and the goal, not your reasoning; an independent, near-zero-context reviewer catches what you talked yourself past. Benchmarked 2026-09-22 against a known defect: plain `/review` framing found it in NO model tested, while adversarial framing found it in almost all of them - the FRAMING, not the model, is what catches bugs. Gemma (`local-reviewer`/`explorer-local`) and qwen3.8-27b (`coder-local`) missed it even adversarially, so they are not review lanes. MiniMax-M3 (`reviewer`) and Flash-Next (`agentic-local`) both caught it. So review goes to `agentic-local`, NOT `explorer-local`. Act on what it flags (through `coder-local`), then re-verify. Skip only for trivial or read-only work."
        },
        "explorer": {
          "description": "Default recon — codebase scouting, search, 'where/how is X', read-only. MiniMax M2.7 (262k ctx, flat-rate). The one lane with real concurrency: fan out 3-4 at a time.",
          "mode": "subagent",
          "model": "litellm-anthropic/MiniMax-M2.7"
        },
        "coder-local": {
          "description": "Primary coding lane — Qwen3.8-27B dense UD-Q4_K_XL on the 3090 (144k, text-only). The fastest and strongest coder available (vLLM, DFlash2 speculation), several slots so it can serve concurrent fan-out. Text-only — route anything involving images to `vision-local` (qwen3.8-flash-next).",
          "mode": "subagent",
          "model": "litellm/qwen3.8-27b"
        },
        "agentic-local": {
          "description": "Long-context and agentic lane — Qwen3.8-Flash-Next IQ4_NL on Strix (262k, vision). Use it when the work will not fit coder-local's 144k window, or for long-horizon multi-step tasks where its agentic strength pays. ~1030 t/s prefill at depth, ~40 t/s decode. ONE slot, so it serialises.",
          "mode": "subagent",
          "model": "litellm/qwen3.8-flash-next"
        },
        "implementer": {
          "description": "Implementation lane — implementation-pool (Luna at effort high, then qwen3.8-27b, then MiniMax-M2.7, 144k). Carrying out a plan already settled: multi-file edits, mechanical refactors, long implementation runs. Cloud-led, so unlike coder-local and agentic-local it runs CONCURRENTLY — fan out. Text only: route anything involving images to vision-local.",
          "mode": "subagent",
          "model": "litellm/implementation-pool"
        },
        "oracle": {
          "description": "Hard debugging / architecture — GLM 5.3 Flash (1M ctx, multimodal). Rate-capped but roomy: ~3x the GLM-5.3 quota on the coding plan, shared with other consumers. Read-mostly deep analysis; return a recommendation, don't sprawl into edits",
          "mode": "subagent",
          "model": "litellm/glm-5.3-flash"
        },
        "explorer-local": {
          "description": "Local recon and second opinion — Gemma-4-12B-it-QAT on the 9070XT (smurf-pc, woken on demand, non-Qwen, 4 slots, vision). The only locally concurrent lane: fan out for scouting. Falls back to MiniMax-M3 if the box cannot be woken.",
          "mode": "subagent",
          "model": "litellm/gemma-4-12b-it-qat"
        },
        "reviewer": {
          "description": "Independent review — MiniMax-M3 (1M ctx, flat-rate, cloud, concurrent). A different family from the Qwen coders and stronger than the local Gemma; the default second-opinion and prose lane.",
          "mode": "subagent",
          "model": "litellm-anthropic/MiniMax-M3",
          "prompt": "You are an ADVERSARIAL reviewer. Assume the change is WRONG and that your job is to prove it. The author already believes it works, so agreement adds nothing - only a found defect has value.\n\nDo NOT summarise the change. Do NOT list what is good. Do NOT praise.\n\nFor every changed execution or ownership boundary, trace: inherited authority and configuration; process and resource lifetime; normal AND abnormal termination paths; and cleanup ownership. Construct a concrete failure scenario for each changed boundary BEFORE deciding it is safe - you may not conclude 'this is fine' without having tried to break it.\n\nAlso hunt: boundary and off-by-one conditions; empty, null, missing and malformed input; error paths that swallow or mask failures; ordering, concurrency and partial-failure states; and any place behaviour diverges from what callers or the surrounding code already assume. Read what the code DOES, not what its names and comments claim.\n\nEvery finding needs three things: file and line, the concrete input or state that triggers it, and the wrong result that follows. A finding you cannot make concrete is a guess - label it or drop it. Use the repository and tools; do not speculate where you can check.\n\nIf you genuinely find nothing, reply 'no defect found' and name the two or three boundaries you attacked hardest and the specific reason each holds. That is the only acceptable clean review."
        },
        "local-reviewer": {
          "description": "Optional local second opinion — Gemma-4-12B-it-QAT on the 9070XT (smurf-pc, woken on demand, non-Qwen, 4 slots, vision). Only a 12B, so weaker than the MiniMax-M3 `reviewer`; reach for it for a cheap different-family gut-check or to offload prose, not as the primary review.",
          "mode": "subagent",
          "model": "litellm/gemma-4-12b-it-qat",
          "prompt": "You are an ADVERSARIAL reviewer. Assume the change is WRONG and that your job is to prove it. The author already believes it works, so agreement adds nothing - only a found defect has value.\n\nDo NOT summarise the change. Do NOT list what is good. Do NOT praise.\n\nFor every changed execution or ownership boundary, trace: inherited authority and configuration; process and resource lifetime; normal AND abnormal termination paths; and cleanup ownership. Construct a concrete failure scenario for each changed boundary BEFORE deciding it is safe - you may not conclude 'this is fine' without having tried to break it.\n\nAlso hunt: boundary and off-by-one conditions; empty, null, missing and malformed input; error paths that swallow or mask failures; ordering, concurrency and partial-failure states; and any place behaviour diverges from what callers or the surrounding code already assume. Read what the code DOES, not what its names and comments claim.\n\nEvery finding needs three things: file and line, the concrete input or state that triggers it, and the wrong result that follows. A finding you cannot make concrete is a guess - label it or drop it. Use the repository and tools; do not speculate where you can check.\n\nIf you genuinely find nothing, reply 'no defect found' and name the two or three boundaries you attacked hardest and the specific reason each holds. That is the only acceptable clean review.\n\nNote: you are a 12B and have historically missed defects that larger reviewers caught. Prefer reporting a concrete suspicion over a confident all-clear."
        }
      },
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM OpenAI",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "apiKey": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            
            "qwen3.8-flash-next-chat": { "name": "Qwen3.8-Flash-Next non-thinking (Strix)", "limit": { "context": 245760, "output": 16384 } },
            "qwen3.8-flash-next": { "name": "Qwen3.8-Flash-Next IQ4_NL (Strix ROCm, vision)", "limit": { "context": 245760, "output": 16384 } },
            "qwen3.8-27b": { "name": "Qwen3.8-27B W4A16 (3090 vLLM)", "limit": { "context": 147456, "output": 24576 } },
            "qwen3.8-27b-chat": { "name": "Qwen3.8-27B W4A16 non-thinking (3090 vLLM)", "limit": { "context": 147456, "output": 16384 } },
            "gemma-4-12b-it-qat": { "name": "Gemma-4-12B-it-QAT (9070XT)", "limit": { "context": 262144, "output": 32768 } },
            "gemma-4-12b-it-qat-chat": { "name": "Gemma-4-12B non-thinking (9070XT)", "limit": { "context": 262144, "output": 16384 } },
            "kimi-k2.7": { "name": "Kimi K2.7 Code", "limit": { "context": 262144, "output": 32768 } },
            "kimi-k3": { "name": "Kimi K3", "limit": { "context": 1048576, "output": 131072 } },
            "dsv4f": { "name": "DeepSeek V4 Flash", "limit": { "context": 1000000, "output": 16384 } },
            "dsv4.1f": { "name": "DeepSeek V4.1 Flash", "limit": { "context": 1000000, "output": 131072 } },
            "MiniMax-M3-chat": { "name": "MiniMax M3 (chat)", "limit": { "context": 1000000, "output": 16384 } },
            "glm-5.3-flash": { "name": "GLM 5.3 Flash", "limit": { "context": 1000000, "output": 131072 } },
            "glm-5.3": { "name": "GLM 5.3", "limit": { "context": 1000000, "output": 131072 } },
            "reasoning-pool": { "name": "Reasoning Pool", "limit": { "context": 1000000, "output": 16384 } },
            "frontier-pool": { "name": "Frontier Pool", "limit": { "context": 272000, "output": 16384 } },
            "implementation-pool": { "name": "Implementation Pool", "limit": { "context": 147456, "output": 16384 } },
            "auto": { "name": "Auto (router)", "limit": { "context": 131072, "output": 16384 } },
            "chatgpt/gpt-6-astra": { "name": "ChatGPT GPT-6 Astra", "limit": { "context": 272000, "output": 128000 } },
            "chatgpt/gpt-6-sol": { "name": "ChatGPT GPT-6 Sol", "limit": { "context": 272000, "output": 128000 } },
            "chatgpt/gpt-6-luna": { "name": "ChatGPT GPT-6 Luna", "limit": { "context": 272000, "output": 128000 } }
          }
        },
        "litellm-anthropic": {
          "npm": "@ai-sdk/anthropic",
          "name": "LiteLLM Anthropic",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "authToken": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "MiniMax-M2.7": { "name": "MiniMax M2.7", "limit": { "context": 204800, "output": 131072 } },
            "MiniMax-M3": { "name": "MiniMax M3", "limit": { "context": 1000000, "output": 131072 } },
            "auto": { "name": "Auto (router)", "limit": { "context": 125000, "output": 16384 } }
          }
        }
      },
      "mcp": {
        "toolhive": {
          "type": "remote",
          "url": "http://vmcp-mcp-gateway-internal.llm:4483/mcp",
          "enabled": true
        },
        "context7": {
          "type": "remote",
          "url": "https://mcp.context7.com/mcp",
          "enabled": true,
          "headers": {
            "CONTEXT7_API_KEY": "{env:CONTEXT7_API_KEY}"
          }
        }
      }
    }
