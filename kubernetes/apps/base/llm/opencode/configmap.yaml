---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    git config --global user.name "Saffron"
    git config --global user.email "263493777+itsmiso-ai@users.noreply.github.com"
    git config --global init.defaultBranch main
    git config --global credential.helper store
    git config --global --add safe.directory '*'

    umask 077
    printf 'https://x-access-token:%s@github.com\n' "$${GITHUB_TOKEN}" > "$${HOME}/.git-credentials"
    umask 022

    mkdir -p "$${HOME}/projects"
    if [[ ! -d "$${HOME}/projects/home-ops/.git" ]]; then
      git clone --filter=blob:none https://github.com/joryirving/home-ops.git "$${HOME}/projects/home-ops" \
        || echo "WARN: home-ops clone failed; clone it from a session instead"
    fi

    cd "$${HOME}/projects"
    exec opencode serve --hostname 0.0.0.0 --port 4096
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "litellm-anthropic/auto",
      "compaction": { "auto": true, "prune": true, "preserve_recent_tokens": 20000, "reserved": 16384 },
      "tool_output": { "max_lines": 800, "max_bytes": 16384 },
      "plugin": [
        ["@eleboucher/opencode-memini@0.7.23", { "base_url": "http://memini.llm:8080", "namespace": "opencode", "auto_update": false }]
      ],
      "enabled_providers": ["litellm-anthropic", "litellm", "opencode"],
      "agent": {
        "coordinator": {
          "description": "Reasoning coordinator — plans, then delegates to role subagents (explorer/fixer/agentic-local/oracle/reviewer)",
          "mode": "primary",
          "model": "litellm/reasoning-pool",
          "prompt": "You are a coordinator. Do the high-level reasoning and synthesis yourself; delegate the legwork to role subagents via the task tool.\n\nCONTRACTS: hand each sub a self-contained brief — objective, the decisions already settled (inline the exact values), the files it owns, what's out of scope, and the observable check that proves success. A sub should never have to infer scope or re-derive a decision you already made. Ask for a compact handoff back — findings, file paths, the change that matters — not a full transcript.\n\nROLES:\n- `explorer` (MiniMax M3 — 1M ctx, flat-rate plan): default recon, read-only scouting, 'where/how is X'. It is the one lane with real concurrency (3-4 at once), so fan out here.\n- `fixer` (llama-nvidia — local, free, 131k, vision-capable): small scoped edits and anything involving images. Two slots on the 3090, shared with an automated pipeline — keep its jobs small and bounded.\n- `agentic-local` (llama-strix, Qwen3.8-Flash-Next 180B-A6B UD-IQ4_XS — local, free, 262k, vision): the long-context and agentic lane. Reach for it when the job will not fit `fixer`'s 131k window, or for long-horizon multi-step work. Slower and weaker at pure code (~300 t/s prefill at depth, ~26 t/s decode). ONE slot, so run it singly.\n- `oracle` (glm-5.3-flash): hard debugging, root-cause, architecture. Rate-capped but roomy (~3x the GLM-5.3 quota, shared with other consumers) — still not the default lane.\n- `reviewer` (llama-reviewer — Gemma-4-12B on the 9070XT, part-time/non-Qwen, 4 slots; MiniMax-M3 fallback when the box is off): independent second opinion and prose.\n\nCOUNCIL (high-stakes review): collect independent verdicts from different model families — MiniMax (`explorer`), Qwen on Strix (`agentic-local`), Qwen on the 3090 (`fixer`), GLM (`oracle`), Gemma (`reviewer`) — then reconcile. Never let one model grade its own work."
        },
        "local": {
          "description": "Local-only coordinator - Flash-Next (llama-strix, 262k) plans, delegates edits to the 27B fixer (llama-nvidia) and recon to local-explorer (Gemma on the 9070XT). No rate caps; cloud only if the 9070XT cannot be woken.",
          "mode": "primary",
          "model": "litellm/llama-strix",
          "prompt": "You are a LOCAL-ONLY coordinator on Flash-Next (Qwen3.8-Flash-Next, 262k). Do the planning and synthesis yourself and delegate the legwork.\n\nLANES:\n- `fixer` (llama-nvidia, Qwen3.8-27B, 3090, 131k, low-latency, multimodal): scoped implementation and edits, and anything involving images. Two time-sliced slots on one card, contended by an automated pipeline, so keep jobs small and bounded.\n- `local-explorer` (llama-reviewer, Gemma-4-12B on the 9070XT, 4 slots, non-Qwen): read-only recon and independent second opinions. It is the only lane here that runs concurrently, so fan out for scouting. The box is woken on demand, so the first call after an idle period takes about a minute; if it cannot be woken the request is served by MiniMax in the cloud, which is acceptable.\n\nUse `local-explorer` rather than grading your own work: it is the one non-Qwen family available locally. Do NOT use `explorer` or `oracle` - cloud lanes. Do NOT use `agentic-local` - it is this same single-slot server, so delegating there only queues behind you."
        },
        "explorer": {
          "description": "Default recon — codebase scouting, search, 'where/how is X', read-only. MiniMax M3 (1M ctx, flat-rate). The one lane with real concurrency: fan out 3-4 at a time.",
          "mode": "subagent",
          "model": "litellm-anthropic/MiniMax-M3"
        },
        "fixer": {
          "description": "Primary coding lane — Qwen3.8-27B dense UD-Q4_K_XL on the 3090 (131k, vision-capable). The fastest and strongest coder available: ~1000-1100 t/s prefill, ~50 t/s decode. Two time-sliced slots on the one card, shared with an automated pipeline, so watch contention rather than shrinking the work. Route anything involving images here.",
          "mode": "subagent",
          "model": "litellm/llama-nvidia"
        },
        "agentic-local": {
          "description": "Long-context and agentic lane — Qwen3.8-Flash-Next UD-IQ4_XS, a 180B-A6B MoE on Strix (262k, vision). Use it when the work will not fit fixer's 131k window, or for long-horizon multi-step tasks where its agentic strength pays. Slower and weaker at pure code: ~300 t/s prefill at depth, ~26 t/s decode. ONE slot, so it serialises.",
          "mode": "subagent",
          "model": "litellm/llama-strix"
        },
        "oracle": {
          "description": "Hard debugging / architecture — GLM 5.3 Flash (1M ctx, multimodal). Rate-capped but roomy: ~3x the GLM-5.3 quota on the coding plan, shared with other consumers. Read-mostly deep analysis; return a recommendation, don't sprawl into edits",
          "mode": "subagent",
          "model": "litellm/glm-5.3-flash"
        },
        "local-explorer": {
          "description": "Local recon and second opinion — Gemma-4-12B-it-QAT on the 9070XT (smurf-pc, woken on demand, non-Qwen, 4 slots, vision). The only locally concurrent lane: fan out for scouting. Falls back to MiniMax-M3 if the box cannot be woken.",
          "mode": "subagent",
          "model": "litellm/llama-reviewer"
        },
        "reviewer": {
          "description": "Independent review — Gemma-4-12B-it-QAT on the 9070XT (smurf-pc, part-time, non-Qwen, ~55 tok/s, 4 slots, vision). Falls back to MiniMax-M3 when the box is off. Distinct family from the Qwen coders.",
          "mode": "subagent",
          "model": "litellm/llama-reviewer"
        },
        "lean": {
          "description": "Minimal MCP context — toolhive router only (reaches other MCPs via call_tool)",
          "mode": "primary",
          "tools": {
            "github*": false,
            "kubectl*": false,
            "konflate*": false,
            "dispatch*": false,
            "context7*": false
          }
        },
        "gitops": {
          "description": "Cluster ops — kubectl/konflate direct on macOS; via toolhive router off-Mac",
          "mode": "primary",
          "tools": {
            "github*": false,
            "dispatch*": false,
            "context7*": false
          }
        }
      },
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM OpenAI",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "apiKey": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "llama-strix": { "name": "Qwen3.8-Flash-Next UD-IQ4_XS (Strix)", "limit": { "context": 262144, "output": 20480 } },
            "llama-nvidia": { "name": "Qwen3.8-27B UD-Q4_K_XL (3090)", "limit": { "context": 131072, "output": 40960 } },
            "llama-reviewer": { "name": "Gemma-4-12B-it-QAT (9070XT)", "limit": { "context": 262144, "output": 32768 } },
            "kimi-k2.7": { "name": "Kimi K2.7 Code", "limit": { "context": 262144, "output": 32768 } },
            "kimi-k3": { "name": "Kimi K3", "limit": { "context": 1048576, "output": 131072 } },
            "dsv4f": { "name": "DeepSeek V4 Flash", "limit": { "context": 1000000, "output": 16384 } },
            "MiniMax-M3-chat": { "name": "MiniMax M3 (chat)", "limit": { "context": 1000000, "output": 16384 } },
            "glm-5.3-flash": { "name": "GLM 5.3 Flash", "limit": { "context": 1000000, "output": 131072 } },
            "glm-5.3": { "name": "GLM 5.3", "limit": { "context": 1000000, "output": 131072 } },
            "reasoning-pool": { "name": "Reasoning Pool", "limit": { "context": 1050000, "output": 16384 } },
            "frontier-pool": { "name": "Frontier Pool", "limit": { "context": 272000, "output": 16384 } },
            "auto": { "name": "Auto (router)", "limit": { "context": 131072, "output": 16384 } },
            "chatgpt/gpt-6-astra": { "name": "ChatGPT GPT-6 Astra", "limit": { "context": 272000, "output": 128000 } },
            "chatgpt/gpt-5.6-sol": { "name": "ChatGPT GPT-5.6 Sol", "limit": { "context": 1100000, "output": 128000 } },
            "chatgpt/gpt-5.6-terra": { "name": "ChatGPT GPT-5.6 Terra", "limit": { "context": 1050000, "output": 128000 } },
            "chatgpt/gpt-5.6-luna": { "name": "ChatGPT GPT-5.6 Luna", "limit": { "context": 1050000, "output": 128000 } }
          }
        },
        "litellm-anthropic": {
          "npm": "@ai-sdk/anthropic",
          "name": "LiteLLM Anthropic",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "authToken": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "MiniMax-M2.7": { "name": "MiniMax M2.7" },
            "MiniMax-M3": { "name": "MiniMax M3" },
            "auto": { "name": "Auto (router)", "limit": { "context": 125000, "output": 16384 } }
          }
        }
      },
      "mcp": {
        "toolhive": {
          "type": "remote",
          "url": "http://vmcp-mcp-gateway-internal.llm:4483/mcp",
          "enabled": true
        },
        "context7": {
          "type": "remote",
          "url": "https://mcp.context7.com/mcp",
          "enabled": true,
          "headers": {
            "CONTEXT7_API_KEY": "{env:CONTEXT7_API_KEY}"
          }
        }
      }
    }
