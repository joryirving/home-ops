---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    git config --global user.name "Saffron"
    git config --global user.email "263493777+itsmiso-ai@users.noreply.github.com"
    git config --global init.defaultBranch main
    git config --global credential.helper store
    git config --global --add safe.directory '*'

    umask 077
    printf 'https://x-access-token:%s@github.com\n' "$${GITHUB_TOKEN}" > "$${HOME}/.git-credentials"
    umask 022

    mkdir -p "$${HOME}/projects"
    if [[ ! -d "$${HOME}/projects/home-ops/.git" ]]; then
      git clone --filter=blob:none https://github.com/joryirving/home-ops.git "$${HOME}/projects/home-ops" \
        || echo "WARN: home-ops clone failed; clone it from a session instead"
    fi

    cd "$${HOME}/projects"
    exec opencode serve --hostname 0.0.0.0 --port 4096
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "litellm-anthropic/auto",
      "compaction": { "auto": true, "prune": true, "preserve_recent_tokens": 20000, "reserved": 16384 },
      "tool_output": { "max_lines": 800, "max_bytes": 16384 },
      "plugin": [
        ["@eleboucher/opencode-memini@0.7.22", { "base_url": "http://memini.llm:8080", "namespace": "opencode", "auto_update": false }]
      ],
      "enabled_providers": ["litellm-anthropic", "litellm", "opencode"],
      "agent": {
        "coordinator": {
          "description": "Reasoning coordinator — plans, then delegates to role subagents (explorer/fixer/fixer-bigctx/oracle/reviewer)",
          "mode": "primary",
          "model": "litellm/reasoning-pool",
          "prompt": "You are a coordinator. Do the high-level reasoning and synthesis yourself; delegate the legwork to role subagents via the task tool.\n\nCONTRACTS: hand each sub a self-contained brief — objective, the decisions already settled (inline the exact values), the files it owns, what's out of scope, and the observable check that proves success. A sub should never have to infer scope or re-derive a decision you already made. Ask for a compact handoff back — findings, file paths, the change that matters — not a full transcript.\n\nROLES:\n- `explorer` (MiniMax M3 — 1M ctx, flat-rate plan): default recon, read-only scouting, 'where/how is X'. It is the one lane with real concurrency (3-4 at once), so fan out here.\n- `fixer` (llama-nvidia — local, free, 131k, vision-capable): small scoped edits and anything involving images. Two slots on the 3090, shared with an automated pipeline — keep its jobs small and bounded.\n- `fixer-bigctx` (llama-strix — local, free, 262k): bulk coding lane. Two slots, so up to two at once; beyond that they queue.\n- `oracle` (glm-5.3-flash): hard debugging, root-cause, architecture. Rate-capped but roomy (~3x the GLM-5.3 quota, shared with other consumers) — still not the default lane.\n- `reviewer` (llama-reviewer — local, free, two slots): independent second opinion and prose.\n\nCOUNCIL (high-stakes review): collect independent verdicts from different model families — MiniMax (`explorer`), Qwen on Strix (`fixer-bigctx`), Qwen on the 3090 (`fixer`), GLM (`oracle`), Nemotron (`reviewer`) — then reconcile. Never let one model grade its own work."
        },
        "local": {
          "description": "Local-only coordinator - Flash-Next (llama-strix, 262k) plans and delegates to LOCAL lanes only (fixer=27B, reviewer=Nemotron). No cloud, no rate caps.",
          "mode": "primary",
          "model": "litellm/llama-strix",
          "prompt": "You are a LOCAL-ONLY coordinator on Flash-Next (Qwen3.8-Flash-Next, 262k). Do the high-level reasoning yourself; delegate legwork to LOCAL subagents via the task tool. Offline profile: do NOT use `explorer` (MiniMax) or `oracle` (GLM) - both cloud. LOCAL LANES: `fixer` (llama-nvidia, Qwen3.8-27B, 3090, low-latency, multimodal) - the coder/fast lane, scoped edits, keep jobs small and bounded. `reviewer` (llama-reviewer, Nemotron, local) - independent second opinion and prose. Do recon yourself or via a bounded `fixer` job; no concurrent recon lane here."
        },
        "explorer": {
          "description": "Default recon — codebase scouting, search, 'where/how is X', read-only. MiniMax M3 (1M ctx, flat-rate). The one lane with real concurrency: fan out 3-4 at a time.",
          "mode": "subagent",
          "model": "litellm-anthropic/MiniMax-M3"
        },
        "fixer": {
          "description": "Fast scoped edits — Qwen3.8-27B local on the 3090 (145k, vision-capable). One slot and heavily contended by an automated pipeline: keep jobs small and bounded. Route anything involving images here.",
          "mode": "subagent",
          "model": "litellm/llama-nvidia"
        },
        "fixer-bigctx": {
          "description": "Bulk coding lane — Qwen3.8-Flash-Next local on Strix (262k, one slot, multimodal). Run singly; concurrent calls queue.",
          "mode": "subagent",
          "model": "litellm/llama-strix"
        },
        "oracle": {
          "description": "Hard debugging / architecture — GLM 5.3 Flash (1M ctx, multimodal). Rate-capped but roomy: ~3x the GLM-5.3 quota on the coding plan, shared with other consumers. Read-mostly deep analysis; return a recommendation, don't sprawl into edits",
          "mode": "subagent",
          "model": "litellm/glm-5.3-flash"
        },
        "reviewer": {
          "description": "Independent review / creative — Nemotron 3.5 Lightning 30B-A3B local on Strix (free, two slots). Distinct family from the Qwen coders and the MiniMax explorer. Second opinions and prose.",
          "mode": "subagent",
          "model": "litellm/llama-reviewer"
        },
        "lean": {
          "description": "Minimal MCP context — toolhive router only (reaches other MCPs via call_tool)",
          "mode": "primary",
          "tools": {
            "github*": false,
            "kubectl*": false,
            "konflate*": false,
            "dispatch*": false,
            "context7*": false
          }
        },
        "gitops": {
          "description": "Cluster ops — kubectl/konflate direct on macOS; via toolhive router off-Mac",
          "mode": "primary",
          "tools": {
            "github*": false,
            "dispatch*": false,
            "context7*": false
          }
        }
      },
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM OpenAI",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "apiKey": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "llama-strix": { "name": "Qwen3.8-Flash-Next (Strix)", "limit": { "context": 262144, "output": 20480 } },
            "llama-nvidia": { "name": "Qwen3.8-27B (3090)", "limit": { "context": 131072, "output": 40960 } },
            "llama-reviewer": { "name": "Nemotron 3.5 Lightning 30B-A3B (Strix)", "limit": { "context": 200000, "output": 20480 } },
            "kimi-k2.7": { "name": "Kimi K2.7 Code", "limit": { "context": 262144, "output": 32768 } },
            "kimi-k3": { "name": "Kimi K3", "limit": { "context": 1048576, "output": 131072 } },
            "dsv4f": { "name": "DeepSeek V4 Flash", "limit": { "context": 1000000, "output": 16384 } },
            "MiniMax-M3-chat": { "name": "MiniMax M3 (chat)", "limit": { "context": 1000000, "output": 16384 } },
            "glm-5.3-flash": { "name": "GLM 5.3 Flash", "limit": { "context": 1000000, "output": 131072 } },
            "glm-5.3": { "name": "GLM 5.3", "limit": { "context": 1000000, "output": 131072 } },
            "reasoning-pool": { "name": "Reasoning Pool", "limit": { "context": 1050000, "output": 16384 } },
            "frontier-pool": { "name": "Frontier Pool", "limit": { "context": 1000000, "output": 16384 } },
            "auto": { "name": "Auto (router)", "limit": { "context": 140000, "output": 16384 } },
            "chatgpt/gpt-5.6-sol": { "name": "ChatGPT GPT-5.6 Sol", "limit": { "context": 1100000, "output": 128000 } },
            "chatgpt/gpt-5.6-terra": { "name": "ChatGPT GPT-5.6 Terra", "limit": { "context": 1050000, "output": 128000 } },
            "chatgpt/gpt-5.6-luna": { "name": "ChatGPT GPT-5.6 Luna", "limit": { "context": 1050000, "output": 128000 } }
          }
        },
        "litellm-anthropic": {
          "npm": "@ai-sdk/anthropic",
          "name": "LiteLLM Anthropic",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "authToken": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "MiniMax-M2.7": { "name": "MiniMax M2.7" },
            "MiniMax-M3": { "name": "MiniMax M3" },
            "auto": { "name": "Auto (router)", "limit": { "context": 125000, "output": 16384 } }
          }
        }
      },
      "mcp": {
        "toolhive": {
          "type": "remote",
          "url": "http://vmcp-mcp-gateway-internal.llm:4483/mcp",
          "enabled": true
        },
        "context7": {
          "type": "remote",
          "url": "https://mcp.context7.com/mcp",
          "enabled": true,
          "headers": {
            "CONTEXT7_API_KEY": "{env:CONTEXT7_API_KEY}"
          }
        }
      }
    }
