---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    git config --global user.name "Saffron"
    git config --global user.email "263493777+itsmiso-ai@users.noreply.github.com"
    git config --global init.defaultBranch main
    git config --global credential.helper store
    git config --global --add safe.directory '*'

    umask 077
    printf 'https://x-access-token:%s@github.com\n' "$${GITHUB_TOKEN}" > "$${HOME}/.git-credentials"
    umask 022

    mkdir -p "$${HOME}/projects"
    if [[ ! -d "$${HOME}/projects/home-ops/.git" ]]; then
      git clone --filter=blob:none https://github.com/joryirving/home-ops.git "$${HOME}/projects/home-ops" \
        || echo "WARN: home-ops clone failed; clone it from a session instead"
    fi

    exec opencode serve --hostname 0.0.0.0 --port 4096
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "litellm-anthropic/auto",
      "enabled_providers": ["litellm-anthropic", "litellm", "opencode"],
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM OpenAI",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "apiKey": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "llama-strix": { "name": "Qwen3.6-35B-A3B heretic (Strix)", "limit": { "context": 262144, "output": 20480 } },
            "llama-nvidia": { "name": "Qwen3.8-27B (3090)", "limit": { "context": 140000, "output": 40960 } },
            "llama-strix-nemotron": { "name": "Nemotron 3.5 Lightning 30B-A3B (Strix)", "limit": { "context": 262144, "output": 20480 } },
            "llama-vision": { "name": "Qwen3.5-9B abliterated (Intel iGPU, vision)", "limit": { "context": 32768, "output": 8192 } },
            "kimi-k2.7": { "name": "Kimi K2.7 Code", "limit": { "context": 262144, "output": 32768 } },
            "kimi-k3": { "name": "Kimi K3", "limit": { "context": 1048576, "output": 131072 } },
            "dsv4f": { "name": "DeepSeek V4 Flash", "limit": { "context": 1000000, "output": 16384 } },
            "go-gpt-5.6-luna": { "name": "GPT-5.6 Luna (Go)", "limit": { "context": 272000, "output": 16384 } },
            "dsv4p": { "name": "DeepSeek V4 Pro", "limit": { "context": 1000000, "output": 16384 } },
            "MiniMax-M3-chat": { "name": "MiniMax M3 (chat)", "limit": { "context": 1000000, "output": 16384 } },
            "mimo-v2.5-pro": { "name": "MiMo V2.5 Pro", "limit": { "context": 262144, "output": 16384 } },
            "mimo-v2.5": { "name": "MiMo V2.5", "limit": { "context": 262144, "output": 16384 } },
            "glm-5.3": { "name": "GLM 5.3", "limit": { "context": 1000000, "output": 131072 } },
            "reasoning-pool": { "name": "Reasoning Pool", "limit": { "context": 1050000, "output": 16384 } },
            "frontier-pool": { "name": "Frontier Pool", "limit": { "context": 1000000, "output": 16384 } },
            "auto": { "name": "Auto (router)", "limit": { "context": 140000, "output": 16384 } },
            "chatgpt/gpt-5.6-sol": { "name": "ChatGPT GPT-5.6 Sol", "limit": { "context": 1100000, "output": 128000 } },
            "chatgpt/gpt-5.6-terra": { "name": "ChatGPT GPT-5.6 Terra", "limit": { "context": 1050000, "output": 128000 } },
            "chatgpt/gpt-5.6-luna": { "name": "ChatGPT GPT-5.6 Luna", "limit": { "context": 1050000, "output": 128000 } }
          }
        },
        "litellm-anthropic": {
          "npm": "@ai-sdk/anthropic",
          "name": "LiteLLM Anthropic",
          "options": {
            "baseURL": "http://litellm.llm:4000/v1",
            "authToken": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "MiniMax-M2.7": { "name": "MiniMax M2.7" },
            "MiniMax-M3": { "name": "MiniMax M3" },
            "auto": { "name": "Auto (router)", "limit": { "context": 125000, "output": 16384 } }
          }
        }
      },
      "mcp": {
        "toolhive": {
          "type": "remote",
          "url": "http://vmcp-mcp-gateway-internal.llm:4483/mcp",
          "enabled": true
        },
        "context7": {
          "type": "remote",
          "url": "https://mcp.context7.com/mcp",
          "enabled": true,
          "headers": {
            "CONTEXT7_API_KEY": "{env:CONTEXT7_API_KEY}"
          }
        }
      }
    }
