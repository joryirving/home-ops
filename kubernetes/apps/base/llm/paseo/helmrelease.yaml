---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paseo
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  dependsOn: []
  values:
    controllers:
      paseo:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 3600
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/paseo
              tag: 0.12.0@sha256:57b6e37d575b03e3479c439931c63f5b0943a18e731c69886cd53316e74eb0a5
            env:
              TZ: America/Edmonton
              PASEO_LISTEN: 0.0.0.0:6767
              PASEO_HOSTNAMES: paseo.jory.dev
              PASEO_TRUSTED_PROXIES: 10.42.0.0/16
              PASEO_WEB_UI_ENABLED: "true"
              PASEO_RELAY_ENABLED: "false"
              PASEO_LOG_FILE_LEVEL: info
              CONTEXT7_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: opencode
                    key: CONTEXT7_API_KEY
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-opencode
                    key: api-key
            envFrom:
              - secretRef:
                  name: *app
            probes:
              startup: &health
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 6767
              readiness: *health
              liveness: *health
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 8Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - paseo.jory.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          paseo:
            app:
              - path: /home/paseo
                subPath: home
              - path: /workspace
                subPath: workspace
      config:
        type: configMap
        name: paseo-config
        defaultMode: 0755
        advancedMounts:
          paseo:
            app:
              - path: /etc/paseo
      opencode-config:
        type: configMap
        name: opencode-config
        advancedMounts:
          paseo:
            app:
              - path: /etc/paseo/opencode.json
                subPath: opencode.json
      tmp:
        type: emptyDir
        advancedMounts:
          paseo:
            app:
              - path: /tmp
