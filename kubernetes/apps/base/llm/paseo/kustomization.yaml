---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: paseo-config
    files:
      - paseo.json=./config/paseo.json
      - gitconfig=./config/gitconfig
generatorOptions:
  disableNameSuffixHash: true
