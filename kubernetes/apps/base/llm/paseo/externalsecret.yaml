---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        CONTEXT7_API_KEY: "{{ .CONTEXT7_OPENCODE_API_KEY }}"
        GH_TOKEN: "{{ .GITHUB_TOKEN }}"
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        MEMINI_API_KEY: "{{ .OPENCODE_API_KEY }}"
        OPENCODE_SERVER_PASSWORD: "{{ .OPENCODE_SERVER_PASSWORD }}"
        PASEO_PASSWORD: "{ .PASEO_PASSWORD } "
  dataFrom:
  - extract:
      key: opencode
    rewrite:
      - regexp:
          source: ^password$
          target: OPENCODE_SERVER_PASSWORD
  - extract:
      key: context7
    rewrite:
      - regexp:
          source: ^OPENCODE_API_KEY$
          target: CONTEXT7_OPENCODE_API_KEY
  - extract:
      key: github-miso
  - extract:
      key: paseo
    rewrite:
      - regexp:
          source: ^password$
          target: PASEO_PASSWORD
