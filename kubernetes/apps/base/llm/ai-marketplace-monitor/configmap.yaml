---
# yaml-language-server: $schema=https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.31/#configmap-v1-core
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-marketplace-monitor-config
data:
  config.toml: |
    [ai.litellm]
    api_key = "$${LITELLM_API_KEY}"
    base_url = "http://litellm.llm:4000/v1"
    model = "qwen3.8-flash-next-chat"
    provider = "OpenAI"

    [marketplace.facebook]
    city_name = ["Calgary"]
    currency = ["CAD"]
    search_city = ["calgary"]

    [item.high_vram_gpu]
    ai = ["litellm"]
    description = "A discrete GPU with at least 24 GB of VRAM, suitable for local AI workloads. Prefer cards in good working condition and exclude broken or for-parts listings."
    rating = 4
    search_phrases = ["RTX 3090", "RTX 4090", "RTX 5090", "RTX A6000", "A100", "H100"]

    [item.solar_panels]
    ai = ["litellm"]
    description = "Solar panels or a small residential solar-panel lot available in or near Calgary. Prefer complete, usable panels and exclude solar lights, chargers, toys, and unrelated accessories."
    rating = 4
    search_phrases = ["solar panels", "solar panel"]
