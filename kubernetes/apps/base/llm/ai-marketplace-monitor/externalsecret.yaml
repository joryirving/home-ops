---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ai-marketplace-monitor
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        FACEBOOK_PASSWORD: "{{ .password }}"
        FACEBOOK_USERNAME: "{{ .username }}"
        LITELLM_API_KEY: "{{ .LITELLM_AI_MARKETPLACE_MONITOR_API_KEY }}"
  dataFrom:
    - extract:
        key: Facebook
    - extract:
        key: litellm
