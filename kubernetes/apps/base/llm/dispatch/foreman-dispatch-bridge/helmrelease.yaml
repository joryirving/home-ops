---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foreman-dispatch-bridge
spec:
  chartRef:
    kind: OCIRepository
    name: foreman-dispatch-bridge
  interval: 15m
  values:
    defaultPodOptions:
      # app-template defaults this off; the bridge needs the SA token to create
      # Workloads via the in-cluster kube API (load_incluster_config).
      automountServiceAccountToken: true
    controllers:
      foreman-dispatch-bridge:
        type: cronjob
        cronjob:
          # schedule: "*/15 20-23,0-7 * * *"
          schedule: "*/15 * * * *"
          timeZone: America/Edmonton
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        serviceAccount:
          identifier: foreman-dispatch-bridge
        containers:
          app:
            image:
              repository: ghcr.io/misospace/foreman-dispatch-bridge
              tag: 0.7.8@sha256:d9aeea453ad064ca30c96b9a9a9cf2cfe35e8f00c65551c0bd377d28fa0a83db
            env:
              DISPATCH_URL: http://dispatch.llm:3000
              # Dash, not slash (like saffron-normal): agents auto-register, but a "/"
              # splits the queue URL path (/api/agents/{name}/queue) and 404s.
              DISPATCH_AGENT_NAME: foreman-coder
              # Two-tier flow: everything grooms into local; the bridge escalates
              # exhausted issues into frontier (cloud lane retired — no distinct
              # executor backed it, and upfront complexity triage was asking too
              # much of the 4B groomer).
              DISPATCH_LANES: local,frontier
              # Bridge 0.4.0+: instead of tombstoning after RETRY_MAX_ATTEMPTS,
              # re-lane the issue to frontier + unclaim; the next tick claims it
              # there and builds the Workload with the coder-frontier Agent
              # (cloud-proxy -> litellm -> MiniMax-M3). Ignored by older bridges.
              ESCALATION_LANE: frontier
              LANE_CODER_AGENTS: '{"*":["coder"],"frontier":["coder-frontier"]}'
              # coder is 1, not 2, deliberately. llama-nvidia runs
              # parallelSlots: 2, and admitting two local coders fills both,
              # so everything else on that backend queues behind runs that
              # last 24-88 minutes. The groomer needs seconds and lost that
              # race: windowstead#347 failed to groom three times with
              # "Groomer LLM call to model 'local-pool' aborted after
              # 100000ms", observed while requests_processing was 2 and
              # requests_deferred was 1.
              #
              # One coder leaves a slot free for grooming, reviews and probes.
              # coder-frontier stays at 4 — that lane is MiniMax over the
              # network and does not touch local hardware.
              CODER_AGENT_SLOTS: '{"coder":1,"coder-frontier":4}'
              FOREMAN_NAMESPACE: llm
              MAX_IN_PROGRESS: "14"
              VERDICT_SELF_GO: "code-fix,docs,packaging,config,ci-policy"
              GATEPROFILE_MAP: '{"misospace/pr-reviewer-action":{"testLayout":{"testRoot":"tests","sourceRoot":"pr_reviewer"}},"misospace/windowstead":{"testLayout":{"testRoot":"tests","sourceRoot":"scripts"},"sourceExtensions":[".gd"]},"misospace/pinchflat":{"testLayout":{"testRoot":"test","sourceRoot":"lib"},"sourceExtensions":[".ex",".exs",".heex"]},"misospace/foreman-dispatch-bridge":{"testLayout":{"testRoot":"tests","sourceRoot":"bridge"}},"misospace/miso-chat":{"testLayout":{"testRoot":"tests","sourceRoot":"lib"}},"*":{"sourceExtensions":[".go",".hcl"]}}'
              REVISION_CODER_AGENTS: '{"*":"coder-revision"}'
              PR_FIX_ENABLED: "true"
              PR_FIX_MAX_ATTEMPTS: "4"
              PR_FIX_LANE_AGENTS: '{"NORMAL":"coder-frontier","ESCALATED":"coder-frontier"}'
            envFrom:
              - secretRef:
                  name: foreman-dispatch-bridge
            resources:
              requests:
                cpu: 25m
              limits:
                memory: 128Mi
    serviceAccount:
      foreman-dispatch-bridge: {}
    rbac:
      roles:
        # The bridge creates Workloads and, since v0.3.0, reconciles failed ones:
        # list/get to find Failed Workloads, delete + create to retry them (bounded).
        # Retry stays delete-then-recreate, not in-place mutation. patch covers one
        # narrow case: bridge 0.6.28 stamps a bridge-owned terminal-since annotation
        # so the prune TTL is measured against a timestamp the Foreman controller
        # does not rewrite (misospace/foreman-dispatch-bridge#170).
        foreman-dispatch-bridge:
          type: Role
          rules:
            - apiGroups: ["foreman.llmkube.dev"]
              resources: ["workloads"]
              verbs: ["create", "get", "list", "delete", "patch"]
            # Bridge 0.5.0 reads a failed Workload's task results (reviewer
            # NO-GO findings, coder errors) to build feedback-carrying retries.
            - apiGroups: ["foreman.llmkube.dev"]
              resources: ["agentictasks"]
              verbs: ["get", "list"]
      bindings:
        foreman-dispatch-bridge:
          type: RoleBinding
          roleRef:
            identifier: foreman-dispatch-bridge
          subjects:
            - identifier: foreman-dispatch-bridge
              serviceAccount: foreman-dispatch-bridge
