---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foreman-dispatch-bridge
spec:
  chartRef:
    kind: OCIRepository
    name: foreman-dispatch-bridge
  interval: 15m
  values:
    defaultPodOptions:
      # app-template defaults this off; the bridge needs the SA token to create
      # Workloads via the in-cluster kube API (load_incluster_config).
      automountServiceAccountToken: true
    controllers:
      foreman-dispatch-bridge:
        type: cronjob
        cronjob:
          # schedule: "*/15 20-23,0-7 * * *"
          schedule: "*/15 * * * *"
          timeZone: America/Edmonton
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        serviceAccount:
          identifier: foreman-dispatch-bridge
        containers:
          app:
            image:
              repository: ghcr.io/misospace/foreman-dispatch-bridge
              tag: 0.7.4@sha256:efc5621486b6ce7599df248b8be139c443da80db675ceca8a48fcab54c44190f
            env:
              DISPATCH_URL: http://dispatch.llm:3000
              # Dash, not slash (like saffron-normal): agents auto-register, but a "/"
              # splits the queue URL path (/api/agents/{name}/queue) and 404s.
              DISPATCH_AGENT_NAME: foreman-coder
              # Two-tier flow: everything grooms into local; the bridge escalates
              # exhausted issues into frontier (cloud lane retired — no distinct
              # executor backed it, and upfront complexity triage was asking too
              # much of the 4B groomer).
              DISPATCH_LANES: local,frontier
              # Bridge 0.4.0+: instead of tombstoning after RETRY_MAX_ATTEMPTS,
              # re-lane the issue to frontier + unclaim; the next tick claims it
              # there and builds the Workload with the coder-frontier Agent
              # (cloud-proxy -> litellm -> MiniMax-M3). Ignored by older bridges.
              ESCALATION_LANE: frontier
              LANE_CODER_AGENTS: '{"*":["coder"],"frontier":["coder-frontier"]}'
              CODER_AGENT_SLOTS: '{"coder":2,"coder-frontier":4}'
              FOREMAN_NAMESPACE: llm
              MAX_IN_PROGRESS: "14"
              VERIFY_ENABLED: "false"
              VERDICT_SELF_GO: "code-fix,docs,packaging,config,ci-policy"
              GATEPROFILE_MAP: '{"misospace/KubeTix":{"language":"python","image":"python:3.11","commands":{"format":"pip install -q black && black --check .","lint":"pip install -q flake8 && flake8 .","build":"pip install -q -r requirements.txt && python -m compileall -q .","test":"pip install -q -r requirements.txt && TESTING=1 python -m pytest tests/unit/ tests/integration/ -q"}},"misospace/miso-gallery":{"language":"python","image":"python:3.14","commands":{"format":"true","lint":"pip install -q ruff && ruff check . --select=E,F,W,B,SIM,I --ignore=E501","build":"pip install -q -r requirements.txt && python -m compileall -q .","test":"pip install -q -r requirements.txt pytest requests && python -m pytest -q"}},"misospace/pr-reviewer-action":{"testLayout":{"testRoot":"tests","sourceRoot":"pr_reviewer"},"language":"python","image":"python:3.14","commands":{"format":"true","lint":"pip install -q yamllint && yamllint action.yml examples/","build":"python -m compileall -q .","test":"pip install -q -r requirements.txt pytest pytest-cov && pytest tests/ -q --cov=pr_reviewer --cov=scripts --cov-report=term-missing:skip-covered --cov-fail-under=72"}},"misospace/dispatch":{"language":"node","image":"node:24","commands":{"format":"true","lint":"npm ci --include=dev && npx prisma generate && NODE_ENV=development npm run lint","build":"NODE_ENV=development npm run typecheck && NODE_ENV=development npm run build","test":"npm run test"}},"misospace/windowstead":{"testLayout":{"testRoot":"tests","sourceRoot":"scripts"},"language":"generic","sourceExtensions":[".gd"],"image":"ghcr.io/misospace/godot-gate:4.7.2@sha256:8e9a0f93b37cc68ba198e8ecb9ebc8070c9e113a2dac6fc9dfb9b3e83fbd3281","commands":{"format":"true","lint":"true","build":"true","test":"export HOME=/tmp XDG_DATA_HOME=/tmp/.local/share && for s in tests/test_*.gd; do n=$(basename \"$s\" .gd); if [ \"$n\" != test_case ]; then godot --headless --path . --script \"res://tests/$n.gd\" > \"/tmp/$n.log\" 2>&1 || { cat \"/tmp/$n.log\"; exit 1; }; if grep -q \"SCRIPT ERROR\" \"/tmp/$n.log\"; then cat \"/tmp/$n.log\"; exit 1; fi; fi; done && godot --headless --path . --fixed-fps 60 --quit-after 300 2>&1 | tee /tmp/smoke.log && ! grep -qE \"SCRIPT ERROR|ERROR:\" /tmp/smoke.log"}},"misospace/pinchflat":{"testLayout":{"testRoot":"test","sourceRoot":"lib"},"language":"generic","sourceExtensions":[".ex",".exs",".heex"],"image":"ghcr.io/misospace/elixir-gate:1.20.3@sha256:dd229795b4e30a8d3b463ce5abf73e451f1530d3eff8be1e4ef61292d8d3799a","commands":{"format":"true","lint":"true","build":"true","test":"export MIX_ENV=test && mix deps.get && yarn install && (cd assets && yarn install) && ./tooling/fetch-sqlean.sh && mix ecto.create && mix ecto.migrate && mix check --no-fix --no-retry"}},"misospace/alert-triage":{"language":"go","image":"golang:1.26","commands":{"format":"test -z \"$(gofmt -l .)\"","lint":"go vet ./...","build":"go build ./...","test":"go test -race ./..."}},"misospace/foreman-dispatch-bridge":{"testLayout":{"testRoot":"tests","sourceRoot":"bridge"},"language":"python","image":"python:3.14","commands":{"format":"true","lint":"pip install -q -r requirements.txt -r requirements-dev.txt pip-audit && ruff check . && pip-audit -r requirements.txt -r requirements-dev.txt --no-deps","build":"pip install -q -r requirements.txt -r requirements-dev.txt && python -m mypy bridge/","test":"pip install -q -r requirements.txt -r requirements-dev.txt && python -m pytest tests/ -q"}},"misospace/miso-chat":{"testLayout":{"testRoot":"tests","sourceRoot":"lib"},"language":"node","image":"node:24","commands":{"format":"true","lint":"npm ci && npm run check:duplicate-modules && npm run lint && npm run check:csp-hashes && npm run audit:deps","build":"npm ci && node --check server.js","test":"npm ci && npm test"}},"*":{"language":"generic","sourceExtensions":[".go",".hcl"],"image":"golang:1.26","commands":{"format":"true","lint":"true","build":"true","test":"true"}}}'
              REVISION_CODER_AGENTS: '{"*":"coder-revision"}'
              PR_FIX_ENABLED: "true"
              PR_FIX_MAX_ATTEMPTS: "3"
              PR_FIX_LANE_AGENTS: '{"NORMAL":"coder-frontier","ESCALATED":"coder-frontier"}'
            envFrom:
              - secretRef:
                  name: foreman-dispatch-bridge
            resources:
              requests:
                cpu: 25m
              limits:
                memory: 128Mi
    serviceAccount:
      foreman-dispatch-bridge: {}
    rbac:
      roles:
        # The bridge creates Workloads and, since v0.3.0, reconciles failed ones:
        # list/get to find Failed Workloads, delete + create to retry them (bounded).
        # Retry stays delete-then-recreate, not in-place mutation. patch covers one
        # narrow case: bridge 0.6.28 stamps a bridge-owned terminal-since annotation
        # so the prune TTL is measured against a timestamp the Foreman controller
        # does not rewrite (misospace/foreman-dispatch-bridge#170).
        foreman-dispatch-bridge:
          type: Role
          rules:
            - apiGroups: ["foreman.llmkube.dev"]
              resources: ["workloads"]
              verbs: ["create", "get", "list", "delete", "patch"]
            # Bridge 0.5.0 reads a failed Workload's task results (reviewer
            # NO-GO findings, coder errors) to build feedback-carrying retries.
            - apiGroups: ["foreman.llmkube.dev"]
              resources: ["agentictasks"]
              verbs: ["get", "list"]
      bindings:
        foreman-dispatch-bridge:
          type: RoleBinding
          roleRef:
            identifier: foreman-dispatch-bridge
          subjects:
            - identifier: foreman-dispatch-bridge
              serviceAccount: foreman-dispatch-bridge
