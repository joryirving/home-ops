---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: courier-broker-apiserver
spec:
  # Purely additive: without enableDefaultDeny:false, this CNP imposes
  # ingress default-deny on every broker pod in this Cilium version and the
  # control's connections are dropped alongside the vanilla policies
  # (observed live 2026-11-02 during the courier#102 exercise). The per-run
  # vanilla policies already own default-deny; this CNP only adds the
  # reserved-identity allow.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      courier.misospace.dev/component: broker
  egress:
    - toEntities:
        - kube-apiserver
