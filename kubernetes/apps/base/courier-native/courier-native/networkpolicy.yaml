---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: courier-native-model-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: coordinator
      app.kubernetes.io/managed-by: courier
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
