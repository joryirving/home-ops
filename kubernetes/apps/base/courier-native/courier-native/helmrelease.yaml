---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: courier-native
spec:
  chartRef:
    kind: OCIRepository
    name: courier-native
  dependsOn: []
  interval: 15m
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            args:
              - --leader-elect
              - --git-remote-template=https://github.com/%s.git
              - --git-credential-secret=
              - --github-credential-secret=courier-native-observer
    crds:
      enabled: false
    dispatch:
      enabled: false
      agentName: courier-native-minimax
      baseURL: http://dispatch.llm.svc.cluster.local:3000
      laneProfile: minimax
      queueLane: local
    laneProfiles:
      minimax:
        concurrency: 1
        framing: >-
          Production native canary. Work only on the assigned task; use bounded
          investigations and compact check receipts. Never merge. Report only
          observed validation and publication results, and leave external checks
          explicitly pending. Do not poll for CI or human review before exiting.
        # Production-blocking consumption finding: native canary runs
        # amplified paid-model usage (unbounded transcript resend — no
        # declared context policy means no compaction — plus per-role probe
        # duplication and 429 burst retries). Until that is fixed and
        # re-accepted, the canary runs exclusively on the LOCAL Qwen 27B:
        # qwen3.8-27b -> nvidia-router-proxy (in-cluster RTX 3090); its
        # configured fallback qwen3.8-flash-next is likewise in-cluster
        # local. No MiniMax/Hyper/Z.ai model, pool, or endpoint is reachable
        # from this profile. Transport matches the route's OpenAI-compatible
        # surface. The context policy bounds the transcript so compaction
        # actually fires; 122880 is the route's own authoritative
        # max_input_tokens (prefer the lower safe value).
        transport: openai
        context:
          compactAtPercent: 60
          outputReservation: 8192
          roles:
            coordinator:
              maxInputTokens: 122880
            reviewer:
              maxInputTokens: 122880
        roles:
          coordinator: qwen3.8-27b
          reviewer: qwen3.8-27b
    ownership:
      namespaces:
        - courier-native
    secure:
      enabled: true
      brokerTokenReviewClusterRole: courier-native-broker-tokenreview
      harnessImage:
        # The tag tracks the chart's AppVersion — dropping the pin makes the
        # harness image follow every chart bump (#717).
        repository: ghcr.io/misospace/courier-harness
      modelGateway:
        keySecret: courier-native/courier-native-model
        keySecretKey: api-key
        url: http://litellm.llm.svc.cluster.local:4000/v1
      providers:
        - name: github
          type: github
          endpoint: https://api.github.com/
          credentials:
            forge-api:
              secretName: courier-native-github
              key: token
            git:
              secretName: courier-native-github
              key: token
          gitEndpoint: https://github.com/%s.git
          gitUsername: x-access-token
          serves:
            - misospace/courier
      runNamespace: courier-native
