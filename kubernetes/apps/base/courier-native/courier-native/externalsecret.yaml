---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courier-native-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: courier-native-github
    template:
      engineVersion: v2
      data:
        token: "{{ .GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: github-miso
---
# Temporary observer alias for Courier v0.1.12. The trusted operator observer
# cannot share the secure provider Secret name because the legacy credential
# taint check treats --github-credential-secret as pod-exposable (#638).
# Both objects intentionally source the same upstream GitHub credential.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courier-native-observer
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: courier-native-observer
    template:
      engineVersion: v2
      data:
        token: "{{ .GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: github-miso
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courier-native-model
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: courier-native-model
    template:
      engineVersion: v2
      data:
        api-key: "{{ .LITELLM_COURIER_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
