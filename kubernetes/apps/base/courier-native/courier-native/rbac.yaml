---
# Temporary workaround for misospace/courier#640; remove after upgrading to a fixed chart.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrole_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: courier-native-broker-bind
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resourceNames:
      - courier-native-broker-tokenreview
    resources:
      - clusterroles
    verbs:
      - bind
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: courier-native-broker-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: courier-native-broker-bind
subjects:
  - kind: ServiceAccount
    name: courier-native
    namespace: courier-native
---
# Temporary lazy-cache workaround for misospace/courier#641.
# Existing chart RBAC already grants cluster-wide Secret get/list.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrole_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: courier-native-cache-read
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - watch
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: courier-native-cache-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: courier-native-cache-read
subjects:
  - kind: ServiceAccount
    name: courier-native
    namespace: courier-native
