---
name: coturn

services:
  coturn:
    container_name: coturn
    command:
      - --log-file=stdout
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    # renovate: datasource=docker depName=docker.io/coturn/coturn
    image: docker.io/coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
