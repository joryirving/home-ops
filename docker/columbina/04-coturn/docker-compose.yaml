---
name: coturn

services:
  coturn:
    container_name: coturn
    command:
      - --log-file=stdout
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    # renovate: datasource=docker depName=docker.io/coturn/coturn
    image: docker.io/coturn/coturn:4.19.0-r0@sha256:0a3c026baaab092c79c9005823a72747bd09bf211071d537bb0865d95eae4638
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
