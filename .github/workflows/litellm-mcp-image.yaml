---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: LiteLLM MCP Image

"on":
  pull_request:
    branches: ["main"]
    paths:
      - docker/litellm-mcp/**
      - .github/workflows/litellm-mcp-image.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.event.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test LiteLLM MCP image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run launcher tests
        working-directory: docker/litellm-mcp
        run: python3 -m unittest -v

      - name: Build amd64 image
        run: docker build --platform linux/amd64 -t litellm-mcp:test ./docker/litellm-mcp

      - name: Verify LiteLLM startup and MCP stdio tools
        run: python3 docker/litellm-mcp/build_image.py --image litellm-mcp:test --skip-build

      - name: Save tested image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: docker save litellm-mcp:test -o /tmp/litellm-mcp-image.tar

      - name: Upload tested image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: litellm-mcp-tested-image
          path: /tmp/litellm-mcp-image.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build-test
    name: Publish tested LiteLLM MCP image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: litellm-mcp-tested-image
          path: /tmp

      - name: Load tested image
        run: docker load -i /tmp/litellm-mcp-image.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish tested image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/litellm-mcp
          COMMIT: ${{ github.sha }}
        run: |
          docker tag litellm-mcp:test "$IMAGE:1.104.0-mcp1"
          docker tag litellm-mcp:test "$IMAGE:sha-$COMMIT"
          docker push "$IMAGE:1.104.0-mcp1"
          docker push "$IMAGE:sha-$COMMIT"
          docker buildx imagetools inspect "$IMAGE:sha-$COMMIT" --format '{{json .Manifest.Digest}}' | tee /tmp/litellm-mcp-digest
          echo "Published $IMAGE:sha-$COMMIT with digest $(cat /tmp/litellm-mcp-digest)" >> "$GITHUB_STEP_SUMMARY"
