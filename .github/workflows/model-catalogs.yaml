---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Model Catalogs

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "kubernetes/apps/base/llm/**"
      - "scripts/check-model-catalogs.py"
      - ".github/workflows/model-catalogs.yaml"

permissions:
  contents: read

jobs:
  main:
    name: Model Catalogs - Check References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --disable-pip-version-check --quiet pyyaml

      - name: Check Model References
        run: python3 scripts/check-model-catalogs.py
