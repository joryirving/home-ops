---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

"on":
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  pull:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Pull Images
    runs-on: ${{ format('{0}-runner-{1}', github.event.repository.name, matrix.cluster) }}
    strategy:
      fail-fast: false
      matrix:
        cluster: ["main", "utility"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          tool_versions: |
            github:home-operations/flate 0.4.12
            aqua:siderolabs/talos 1.13.7

      - name: Extract Images
        run: flate diff images -p ./kubernetes/clusters/${{ matrix.cluster }} -o json > images.json

      - name: Validate Images
        run: .github/scripts/validate-images.sh images.json

      - name: Pull Images
        run: |
          jq -r '.[]' images.json | while IFS= read -r image; do
            attempt=1
            max_attempts=3
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Pulling $image (attempt ${attempt}/${max_attempts})"
              if talosctl --nodes "$NODE" image pull "$image"; then
                echo "Pulled $image"
                break
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "::error::Failed to pull $image after ${max_attempts} attempts" >&2
                exit 1
              fi
              wait_secs=$(( attempt * 5 ))
              echo "Pull failed for $image, attempt ${attempt}/${max_attempts}, retrying in ${wait_secs}s"
              sleep "$wait_secs"
              attempt=$(( attempt + 1 ))
            done
          done

  success:
    if: ${{ always() }}
    needs: [filter, pull]
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          while IFS= read -r result; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::Unexpected job result: $result" >&2; exit 1 ;;
            esac
          done < <(echo "$RESULTS" | jq -r '.[]')
          echo "All jobs passed or skipped"
