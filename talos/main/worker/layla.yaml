# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.serial == "2541EAD060A6" # Crucial E100 1TB
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  # node-role/topology prefixes are rejected by NodeRestriction on self-update
  node.kubernetes.io/gpu-vendor: intel
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  max-pods: "50"
config:
  registerWithTaints:
    - key: llm-workload
      value: "true"
      effect: NoSchedule
---
# EPHEMERAL grows to fill the disk before the user volume can be provisioned.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 400GB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-hostpath
provisioning:
  diskSelector:
    match: disk.serial == "2541EAD060A6"
  minSize: 500GB
  maxSize: 500GB
---
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 5m
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - enp86s0
bondMode: active-backup
miimon: 100
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.70
vlanID: 70
parent: bond0
mtu: 1500
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.90
vlanID: 90
parent: bond0
mtu: 1500
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: bond0
clientIdentifier: mac
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: layla
