---
customization:
  extraKernelArgs:
    - init_on_alloc=0 # Less security, faster puter
    - init_on_free=0 # Less security, faster puter
    - intel_iommu=on # PCI Passthrough
    - iommu=pt # PCI Passthrough
    - mitigations=off # Less security, faster puter
    - security=none # Less security, faster puter
    - ttm.page_pool_size=1048576 # Limit TTM backing-page cache to 4 GiB-
    - talos.auditd.disabled=1 # Less security, faster puter
    - i915.force_probe=!b080 # Keep Arc B390 off i915
    - xe.force_probe=b080 # Bind Arc B390 to Xe

  systemExtensions:
    officialExtensions:
      - siderolabs/xe # Intel Arc B390 (Xe3)
      - siderolabs/i915 # Xe3 DMC firmware (i915/ firmware tree)
      - siderolabs/intel-ucode # Intel microcode
      - siderolabs/intel-npu # Panther Lake NPU (ivpu)
      - siderolabs/mei # Intel Management Engine interface
      - siderolabs/nfsrahead # NFS Performance
